<!doctype html>

  <title>Lesson Review Quiz</title>
  <style>
    :root{--ink:#17232b;--muted:#63727b;--paper:#f7f4ed;--card:#fffdf8;--line:#ded9cd;--teal:#087e78;--dark:#055d59;--coral:#e56b4d;--gold:#f2b544;--good:#267a4b;--bad:#b23b3b;--shadow:0 18px 50px #182a2f1f;--r:22px}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 8% 5%,#f2b54447,transparent 25rem),radial-gradient(circle at 90% 15%,#087e7833,transparent 30rem),var(--paper);font:16px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{width:min(1120px,calc(100% - 32px));margin:auto;padding:28px 0 56px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px;font-weight:850}.mark{width:44px;height:44px;display:grid;place-items:center;color:#fff;background:var(--teal);border-radius:14px;box-shadow:0 8px 20px #087e783d}.brand small{display:block;color:var(--muted);font-weight:600;letter-spacing:.06em}.panel{background:#fffdf8eb;border:1px solid #ded9cde6;border-radius:var(--r);box-shadow:var(--shadow)}
    .login{min-height:560px;display:grid;grid-template-columns:1.05fr .95fr;overflow:hidden}.login-copy{padding:clamp(32px,6vw,72px);display:flex;flex-direction:column;justify-content:center}.eyebrow{color:var(--coral);font-weight:850;text-transform:uppercase;letter-spacing:.12em;font-size:.78rem}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(2.35rem,5vw,4.7rem);line-height:.98;letter-spacing:-.055em;margin:10px 0 22px}h1 span{color:var(--teal)}.lede{color:var(--muted);font-size:1.08rem}.pills{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 30px}.pill{padding:8px 12px;border-radius:999px;background:#eef4f1;color:var(--dark);font-weight:750;font-size:.88rem}.login-form{display:grid;gap:10px;max-width:480px}label{font-weight:800}input[type=text]{width:100%;padding:14px 16px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:13px;outline:0}input[type=text]:focus{border-color:var(--teal);box-shadow:0 0 0 4px #087e781f}.btn{border:0;border-radius:13px;padding:13px 18px;font-weight:850;color:#fff;background:var(--teal);transition:.16s}.btn:hover:not(:disabled){background:var(--dark);transform:translateY(-1px)}.btn:focus-visible,.option:focus-visible{outline:3px solid #f2b544cc;outline-offset:3px}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.secondary{color:var(--dark);background:#e9f3f0}.btn.ghost{color:var(--ink);background:transparent;border:1px solid var(--line)}.help{color:var(--muted);font-size:.84rem}
    .art{position:relative;overflow:hidden;min-height:430px;background:linear-gradient(145deg,var(--dark),#0c8b82 64%,#25a69a)}.code{position:absolute;width:min(400px,82%);padding:24px;color:#d7fff8;background:#0a2026d1;border:1px solid #ffffff26;border-radius:18px;box-shadow:0 26px 60px #0003;font:600 .9rem/1.8 ui-monospace,monospace}.code.one{top:14%;left:9%;transform:rotate(-3deg)}.code.two{right:7%;bottom:13%;transform:rotate(4deg)}.key{color:#ffce69}.call{color:#73e6d7}.note{color:#9eb8b8}.orb{position:absolute;border-radius:50%;background:#ffffff14}.orb.a{width:280px;height:280px;top:-100px;right:-70px}.orb.b{width:180px;height:180px;bottom:-60px;left:-50px}
    #app{display:none}.user{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:#dceee9;color:var(--dark);font-weight:900}.hero{padding:28px;margin-bottom:18px;background:linear-gradient(115deg,#073f3f,var(--teal));color:#fff;position:relative;overflow:hidden}.hero:after{content:"?";position:absolute;right:36px;top:-55px;font-weight:900;font-size:11rem;opacity:.08}.hero h2{margin-bottom:7px;font-size:clamp(1.65rem,3vw,2.4rem);letter-spacing:-.035em}.hero p{margin:0;color:#ccece7}.notice{margin-bottom:18px;padding:14px 16px;border-radius:12px;background:#eef7f5;border:1px solid #b8ddd6;color:var(--dark)}.notice.error{background:#ffeded;border-color:#efb0b0;color:#7f2828}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{padding:20px}.stat-label{color:var(--muted);font-weight:750;font-size:.88rem}.stat-value{font-size:clamp(1.65rem,3vw,2.35rem);line-height:1.15;margin-top:8px;font-weight:900}.stat-sub{color:var(--muted);font-size:.83rem;margin-top:6px}.best{background:linear-gradient(150deg,#fff8df,#fffdf8);border-color:#efdba1}.dash-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:16px}.chart-card,.history-card{padding:22px;min-width:0}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.section-head h3{margin:0;font-size:1.05rem}#chart{display:block;width:100%;height:230px}.empty{padding:34px 16px;text-align:center;color:var(--muted)}.history-wrap{max-height:270px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{padding:10px 8px;border-bottom:1px solid #ece7dc;text-align:left;white-space:nowrap}th{color:var(--muted);font-size:.76rem;text-transform:uppercase;letter-spacing:.06em}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0}.actions .spacer{flex:1}
    .quiz{display:none;padding:clamp(22px,5vw,46px)}.quiz.show,.result.show{display:block}.quiz-top{display:flex;justify-content:space-between;gap:14px;margin-bottom:12px}.qcount{font-weight:900;color:var(--dark)}.live{color:var(--muted);font-weight:750}.progress{height:8px;overflow:hidden;border-radius:99px;background:#e6e2d8;margin-bottom:30px}.progress div{height:100%;width:0;background:linear-gradient(90deg,var(--teal),#36ae9e)}.tag{display:inline-block;margin-bottom:12px;padding:5px 10px;border-radius:8px;background:#e9f3f0;color:var(--dark);font-size:.78rem;font-weight:850}.question{font-size:clamp(1.25rem,2.4vw,1.75rem);line-height:1.3;letter-spacing:-.025em;margin-bottom:24px}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{min-height:68px;display:flex;align-items:center;gap:12px;padding:14px 16px;color:var(--ink);text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px}.option:hover:not(:disabled){transform:translateY(-1px);border-color:var(--teal);background:#f4fbf9}.option:disabled{cursor:default;opacity:1}.option.correct{border-color:#57a878;background:#eaf7ee;color:#155e38}.option.wrong{border-color:#da7777;background:#fff0f0;color:#8f2929}.letter{flex:0 0 32px;height:32px;display:grid;place-items:center;border-radius:9px;background:#f0eee8;font-weight:900}.feedback{display:none;margin-top:20px;padding:17px 18px;border-left:4px solid var(--teal);border-radius:10px;background:#eef7f5}.feedback.show{display:block}.feedback strong{display:block;margin-bottom:4px}.quiz-foot{display:flex;justify-content:flex-end;margin-top:22px}.result{display:none;padding:clamp(28px,6vw,60px);text-align:center}.result-emoji{font-size:4.6rem;line-height:1}.result h2{font-size:clamp(2rem,5vw,3.7rem);letter-spacing:-.045em;margin:14px 0 4px}.result-score,.save{color:var(--muted)}.record{display:none;width:fit-content;margin:18px auto 0;padding:9px 14px;border-radius:999px;background:#fff0c5;color:#765412;font-weight:900}.record.show{display:block}.save{margin:18px auto}.result-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.review{margin-top:30px;text-align:left}.review-item{padding:16px 0;border-top:1px solid var(--line)}.review-item p{margin:5px 0}.right{color:var(--good);font-weight:800}
    @media(max-width:820px){.login{grid-template-columns:1fr}.art{min-height:320px}.stats,.dash-grid,.options{grid-template-columns:1fr}}@media(max-width:520px){.shell{width:calc(100% - 20px);padding-top:16px}.brand small,.user>span:not(.avatar){display:none}.login-copy{padding:28px 22px}.hero,.stat,.chart-card,.history-card{padding:18px}.quiz-top{flex-direction:column}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand"><div class="mark">Q</div><div id="brandTitle">Lesson Quiz<small id="brandSub">REVIEW LAB</small></div></div><div class="user" id="user" hidden><span class="avatar" id="avatar">L</span><span id="userName"></span></div></header>
    <section class="panel login" id="login">
      <div class="login-copy"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="lede" id="subtitle"></p><div class="pills"><span class="pill" id="bankPill"></span><span class="pill" id="attemptPill"></span><span class="pill" id="storagePill"></span></div><form class="login-form" id="loginForm"><label for="name" id="nameLabel"></label><input id="name" type="text" autocomplete="name" maxlength="100" required><button class="btn" id="enter" type="submit"></button><div class="help" id="storageHelp"></div><div class="notice error" id="loginError" hidden></div></form></div>
      <div class="art" aria-hidden="true"><div class="orb a"></div><div class="orb b"></div><div class="code one"><span class="key">learn</span>.<span class="call">map</span>(idea =&gt; recall(idea))<br><span class="note">// practice makes progress</span></div><div class="code two"><span class="key">result</span> = <span class="call">challenge</span>(<span class="key">today</span>)</div></div>
    </section>
    <section id="app">
      <div class="panel hero"><h2 id="welcome"></h2><p id="encourage"></p></div><div class="notice" id="notice"></div>
      <div id="dashboard"><div class="stats"><article class="panel stat"><div class="stat-label" id="totalLabel"></div><div class="stat-value" id="total">0</div><div class="stat-sub" id="totalSub"></div></article><article class="panel stat"><div class="stat-label" id="latestLabel"></div><div class="stat-value" id="latest">—</div><div class="stat-sub" id="latestSub"></div></article><article class="panel stat best"><div class="stat-label" id="bestLabel"></div><div class="stat-value" id="best">—</div><div class="stat-sub" id="bestSub"></div></article></div>
        <div class="dash-grid"><article class="panel chart-card"><div class="section-head"><h3 id="trendLabel"></h3><span class="help">%</span></div><div class="empty" id="chartEmpty"></div><canvas id="chart"></canvas></article><article class="panel history-card"><div class="section-head"><h3 id="historyLabel"></h3><span class="help" id="historyCount"></span></div><div class="empty" id="historyEmpty"></div><div class="history-wrap" id="historyWrap" hidden><table><thead><tr><th id="timeHead"></th><th id="scoreHead"></th><th id="levelHead"></th></tr></thead><tbody id="historyBody"></tbody></table></div></article></div>
      </div>
      <div class="actions" id="mainActions"><button class="btn" id="start"></button><button class="btn secondary" id="importBtn"></button><button class="btn ghost" id="exportBtn"></button><input id="csvInput" type="file" accept=".csv,text/csv" hidden><div class="spacer"></div><button class="btn ghost" id="switchUser"></button></div>
      <section class="panel quiz" id="quiz" aria-live="polite"><div class="quiz-top"><div class="qcount" id="qcount"></div><div class="live" id="live"></div></div><div class="progress"><div id="bar"></div></div><span class="tag" id="topic"></span><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback"><strong id="feedbackTitle"></strong><span id="feedbackText"></span></div><div class="quiz-foot"><button class="btn" id="next" disabled></button></div></section>
      <section class="panel result" id="result" aria-live="polite"><div class="result-emoji" id="resultEmoji"></div><h2 id="resultTitle"></h2><div class="result-score" id="resultScore"></div><div class="record" id="record"></div><div class="save" id="save"></div><div class="result-actions"><button class="btn" id="again"></button><button class="btn ghost" id="resultExport"></button><button class="btn ghost" id="back"></button></div><div class="review" id="review"></div></section>
    </section>
  </main>
  <script>
    const QUIZ={"meta":{"id":"pandas-series-review-15-16-en","title":"Pandas Series Review: Exercises 15-16","subtitle":"Categorical data, unique values, datetime, timedelta, timezones, and time grouping","attemptSize":20,"language":"en","bankSize":50},"questions":[{"id":"q01","t":"Categorical Series","q":"Which dtype converts a Series to categorical data?","c":["`category`","`datetime64[ns]`","`timedelta64[ns]`","`object_index`"],"a":0,"e":"The lesson creates categorical Series with `dtype='category'` or `.astype('category')`."},{"id":"q02","t":"Categorical Series","q":"What is a key benefit of converting repeated values to categorical dtype?","c":["Lower memory usage and potentially more efficient operations","Automatic conversion to timestamps","Guaranteed numeric ordering","Removal of all missing values"],"a":0,"e":"The lesson notes that categorical storage can reduce memory usage and improve efficiency for limited unique values."},{"id":"q03","t":"Categorical Series","q":"What object does `pd.Categorical()` create by itself?","c":["A `pd.Categorical` object, not a Series","A DataFrame with one column","A datetime index","A Python dictionary"],"a":0,"e":"The lesson explicitly notes that `pd.Categorical()` must be wrapped in `pd.Series()` to create a categorical Series."},{"id":"q04","t":"Categorical Series","q":"What is the default value of `ordered` when using `pd.Categorical()`?","c":["False","True","None","It depends on the number of categories"],"a":0,"e":"The lesson states that categories are unordered by default, so `ordered=False`."},{"id":"q05","t":"Categorical Attributes","q":"What does `.cat.categories` return?","c":["The category labels","The integer code for each row","A Boolean ordered flag","The number of missing values"],"a":0,"e":"`.cat.categories` returns the Index containing the categorical labels."},{"id":"q06","t":"Categorical Attributes","q":"In the gender example, what code represents category `M`?","c":["2","0","1","-1"],"a":0,"e":"The category order is `['F', 'LGBTQ', 'M']`, so `M` has zero-based code 2."},{"id":"q07","t":"Categorical Attributes","q":"How are missing categorical values represented by `.cat.codes`?","c":["-1","0","NaN","The last category code"],"a":0,"e":"The lesson shows `None` and `np.nan` represented by code `-1`."},{"id":"q08","t":"Categorical Attributes","q":"What does `.cat.ordered` report?","c":["Whether the categories have an explicit order","The number of categories","Whether values are unique","Whether the Series contains NaN"],"a":0,"e":"`.cat.ordered` returns True for ordered categories and False for unordered categories."},{"id":"q09","t":"Category Management","q":"What does `.cat.add_categories(['Mango'])` do?","c":["Adds Mango to the category list without assigning it to existing rows","Replaces every value with Mango","Removes unused categories","Sorts values by Mango"],"a":0,"e":"Adding a category changes the available category set; it does not assign that new category to existing entries automatically."},{"id":"q10","t":"Category Management","q":"What happens to values belonging to a category removed with `.cat.remove_categories()`?","c":["They become NaN","They become zero","They move to the next category","They are converted to strings"],"a":0,"e":"The lesson shows removed values such as `Orange` becoming NaN."},{"id":"q11","t":"Category Management","q":"What does `.cat.remove_unused_categories()` remove?","c":["Categories not used by any current value","All categories containing NaN","The most frequent category","The first category in the order"],"a":0,"e":"It removes category labels that are present in the category list but unused in the Series values."},{"id":"q12","t":"Category Management","q":"What can `.cat.set_categories()` be used for?","c":["Setting, adding, removing, or reordering the category set","Only counting values","Only converting strings to datetimes","Only replacing missing values"],"a":0,"e":"The lesson describes `set_categories()` as a way to define the category list and optionally reorder or rename it."},{"id":"q13","t":"Renaming Categories","q":"How can `.cat.rename_categories()` receive a partial mapping?","c":["With a dictionary such as `{'M': 'Male'}`","With `ignore_index=True`","With a frequency string","With a timezone name"],"a":0,"e":"The lesson demonstrates dictionary-based renaming, mapping original labels to new labels."},{"id":"q14","t":"Reordering Categories","q":"What does `.cat.reorder_categories(['5th', '4th', '3rd', '2nd', '1st'])` change?","c":["The category order, not the row values","Only the Series index labels","The number of rows","The dtype from category to object"],"a":0,"e":"Reordering changes the declared category order while preserving the observed values in each row."},{"id":"q15","t":"Ordered Categories","q":"What does `.cat.as_ordered()` do?","c":["Converts categories to an ordered categorical type","Sorts the Series alphabetically immediately","Removes unused categories","Converts categories to integers"],"a":0,"e":"The lesson uses `as_ordered()` to change `.cat.ordered` from False to True."},{"id":"q16","t":"Ordered Categories","q":"After defining `Small < Medium < Large`, what is the minimum value?","c":["Small","Medium","Large","The first row's value"],"a":0,"e":"An ordered categorical Series uses the declared semantic order for `min()` and `max()`."},{"id":"q17","t":"Unordered Categories","q":"What happens when `min()` is called on the unordered gender categorical Series?","c":["It raises a TypeError because the categorical data is not ordered","It returns the first category alphabetically","It returns NaN","It automatically orders the categories"],"a":0,"e":"The lesson shows that min cannot be used until the categorical data is ordered."},{"id":"q18","t":"Exploring Categories","q":"What does `s_gender.unique()` return in the example?","c":["The distinct observed values in their appearance order","A count for every category","The category codes only","All possible categories sorted alphabetically"],"a":0,"e":"The result is `['M', 'F', 'LGBTQ']`, reflecting the unique observed values in appearance order."},{"id":"q19","t":"Exploring Categories","q":"What count does `s_gender.value_counts().get('M')` return?","c":["5","3","2","10"],"a":0,"e":"The lesson displays M five times, F three times, and LGBTQ two times."},{"id":"q20","t":"Unordered Categories","q":"What does `.cat.as_unordered()` do to an ordered categorical Series?","c":["It changes the ordered flag to False","It deletes all category labels","It converts every value to NaN","It reverses the category order and keeps ordered=True"],"a":0,"e":"`as_unordered()` converts an ordered categorical Series to nominal, unordered categories."},{"id":"q21","t":"Datetime Conversion","q":"Which function converts date strings such as `2023-01-01` to datetime values?","c":["`pd.to_datetime()`","`pd.to_timedelta()`","`pd.factorize()`","`pd.period_range()`"],"a":0,"e":"The lesson uses `pd.to_datetime()` to create a Series with dtype `datetime64[ns]`."},{"id":"q22","t":"Datetime Conversion","q":"Which argument is used for strings in `DD/MM/YYYY` format?","c":["`dayfirst=True`","`monthfirst=True`","`datefirst=False`","`format='business'`"],"a":0,"e":"The lesson passes `dayfirst=True` for values such as `31/12/2023`."},{"id":"q23","t":"Datetime Ranges","q":"What does `pd.date_range(start='2023-01-01', end='2023-01-10', freq='D')` create?","c":["A daily DatetimeIndex from January 1 through January 10","A range containing weekdays only","A TimedeltaIndex every two days","A PeriodIndex of quarters"],"a":0,"e":"`date_range` creates a DatetimeIndex at the requested frequency, including the shown daily endpoints."},{"id":"q24","t":"Business Dates","q":"How does `pd.bdate_range()` differ from `pd.date_range()` in the example?","c":["It includes business days Monday through Friday only","It includes only Sundays","It creates durations instead of dates","It always uses monthly frequency"],"a":0,"e":"The lesson states that business-day ranges exclude weekends."},{"id":"q25","t":"Timedelta Conversion","q":"Which function converts strings such as `2 days 03:00:00` to timedeltas?","c":["`pd.to_timedelta()`","`pd.to_datetime()`","`pd.to_period()`","`pd.to_category()`"],"a":0,"e":"The lesson uses `pd.to_timedelta()` for duration strings."},{"id":"q26","t":"Timedelta Conversion","q":"When is the `unit=` argument used with `pd.to_timedelta()` in the lesson?","c":["When the input is numeric","When the input is a date string","Only when the input is a Period","Only for missing values"],"a":0,"e":"The note says to specify `unit` for numeric inputs, such as numeric values interpreted as hours."},{"id":"q27","t":"Timedelta Ranges","q":"What does `pd.timedelta_range(start='1 days', end='10 days', freq='2D')` produce?","c":["Durations at 1, 3, 5, 7, and 9 days","Every calendar date from day 1 to day 10","Only business-day timestamps","Quarterly periods"],"a":0,"e":"A frequency of `2D` advances two days at a time, producing the shown odd-day durations."},{"id":"q28","t":"Period Data","q":"What does `pd.Period('2012-1-1', freq='D')` represent?","c":["A one-day period","A one-month period","A timezone-aware timestamp","A timedelta of one day"],"a":0,"e":"The lesson creates a daily Period for 2012-01-01 with frequency `D`."},{"id":"q29","t":"Period Data","q":"What does `Series.to_period()` do in the example?","c":["Converts a DatetimeIndex into a PeriodIndex","Converts values to categorical codes","Converts durations to seconds","Converts a PeriodIndex into strings"],"a":0,"e":"The lesson calls `.to_period()` on a Series indexed by dates and obtains a PeriodIndex."},{"id":"q30","t":"Period Data","q":"What frequency does `pd.period_range(..., freq='Q')` generate?","c":["Quarterly periods","Daily timestamps","Business days","Hourly timedeltas"],"a":0,"e":"The example produces `2017Q1` through `2018Q1`, which are quarterly periods."},{"id":"q31","t":"Frequency Inference","q":"What does `pd.infer_freq()` return for the regular daily index in the lesson?","c":["`D`","`Q`","`B`","`H`"],"a":0,"e":"The lesson infers `D`, indicating daily frequency."},{"id":"q32","t":"Datetime Properties","q":"Which accessor extracts the year from a datetime Series?","c":["`.dt.year`","`.str.year`","`.cat.year`","`.time.year`"],"a":0,"e":"The lesson uses `.dt.year`, along with `.dt.month` and `.dt.day`, for datetime components."},{"id":"q33","t":"ISO Calendar","q":"What does `.dt.isocalendar()` return?","c":["A DataFrame containing ISO year, week, and day","A single month number","A timezone object","A TimedeltaIndex"],"a":0,"e":"The lesson states that `isocalendar()` returns ISO year, week, and day components."},{"id":"q34","t":"Datetime Properties","q":"What numeric convention does `.dt.dayofweek` use?","c":["Monday=0 and Sunday=6","Sunday=0 and Saturday=6","Monday=1 and Sunday=7","It returns month numbers"],"a":0,"e":"The lesson explicitly defines Monday as 0 and Sunday as 6 for `dayofweek` and `weekday`."},{"id":"q35","t":"Datetime Properties","q":"What range can `.dt.quarter` return?","c":["1 through 4","0 through 3","1 through 12","0 through 6"],"a":0,"e":"A calendar year has four quarters, and the lesson documents values from 1 to 4."},{"id":"q36","t":"Datetime Extraction","q":"What type of object does `.dt.date` return for each timestamp?","c":["A `datetime.date` object containing only the date","A `datetime.time` object","A pandas Period","A timezone string"],"a":0,"e":"The example checks the type and shows `datetime.date`; `.dt.time` returns time objects."},{"id":"q37","t":"Datetime Flags","q":"What does `.dt.is_month_end` report?","c":["Whether each date is the last day of its month","Whether each date is the first day of its month","Whether the date is in a leap year","Whether the date is a weekday"],"a":0,"e":"The lesson uses `.dt.is_month_end` to identify dates such as May 31."},{"id":"q38","t":"Datetime Formatting","q":"What does `.dt.strftime('%A, %B %d, %Y')` produce?","c":["Formatted strings containing weekday, month name, day, and year","Datetime values rounded to a day","Only the numeric month","A PeriodIndex"],"a":0,"e":"The example formats timestamps as strings such as `Sunday, January 01, 2023`."},{"id":"q39","t":"Time Rounding","q":"For `08:45:23`, what does `.dt.round('h')` return?","c":["09:00:00","08:00:00","08:45:00","08:46:00"],"a":0,"e":"Rounding to the nearest hour moves 08:45:23 to 09:00:00."},{"id":"q40","t":"Time Rounding","q":"For `08:45:23`, what does `.dt.floor('h')` return?","c":["08:00:00","09:00:00","08:45:00","08:46:00"],"a":0,"e":"Flooring to an hour always rounds down to the start of the current hour."},{"id":"q41","t":"Time Rounding","q":"What does `.dt.normalize()` do?","c":["Sets the time component to midnight","Converts the date to a month name","Rounds to the nearest hour","Removes the date and keeps only time"],"a":0,"e":"The lesson describes normalize as converting times to 00:00:00 while keeping the dates."},{"id":"q42","t":"Timezone Handling","q":"What does `.dt.tz_localize('US/Samoa')` do to timezone-naive datetimes?","c":["Assigns the US/Samoa timezone","Converts already-aware values to UTC","Removes the date portion","Changes the frequency to business days"],"a":0,"e":"`tz_localize` assigns timezone information to timezone-naive datetimes."},{"id":"q43","t":"Timezone Handling","q":"Which method converts an already timezone-aware Series from Asia/Ho_Chi_Minh to Asia/Amman?","c":["`.dt.tz_convert('Asia/Amman')`","`.dt.tz_localize('Asia/Amman')`","`.dt.to_timezone('Asia/Amman')`","`.dt.normalize('Asia/Amman')`"],"a":0,"e":"The lesson uses `tz_convert` for changing the timezone of already-aware timestamps."},{"id":"q44","t":"Timezone Handling","q":"Why does calling `tz_localize()` on an already timezone-aware Series raise an error?","c":["Localization is for timezone-naive values; aware values should be converted","The Series contains too many rows","The frequency is not daily","  + 250) / 2 = 225.0`, as shown in the lesson."}]};

    function load(){try{const x=JSON.parse(localStorage.getItem(key())||"[]");return Array.isArray(x)?x:[]}catch{return[]}}function save(){localStorage.setItem(key(),JSON.stringify(S.history))}function stamp(){const d=new Date(),p=(n,w=2)=>String(n).padStart(w,"0"),base=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;if(!S.history.some(x=>x.time===base))return base;let v=`${base}.${p(d.getMilliseconds(),3)}`,n=2;while(S.history.some(x=>x.time===v))v=`${base}.${p(d.getMilliseconds(),3)}-${n++}`;return v}
    function esc(v){v=String(v);return/[",\r\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v}function csv(){return"\uFEFF"+["Name",...S.history.map(x=>x.time)].map(esc).join(",")+"\r\n"+[S.name,...S.history.map(x=>`${x.correct}/${x.total} (${pct(x.percent)}%) - ${x.label}`)].map(esc).join(",")+"\r\n"}function parseCsv(text){text=text.replace(/^\uFEFF/,"");const rows=[];let row=[],cell="",q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}else if(c==='"')q=true;else if(c===","){row.push(cell);cell=""}else if(c==="\n"){row.push(cell.replace(/\r$/,"") );rows.push(row);row=[];cell=""}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}if(q||rows.length!==2||rows[1][0]!==S.name||rows[0].length!==rows[1].length)throw Error(T.badCsv);return rows[0].slice(1).map((time,i)=>{const m=rows[1][i+1].match(/^(\d+)\/(\d+) \(([\d.]+)%\) - (.+)$/);if(!m)throw Error(T.badCsv);return{time,correct:+m[1],total:+m[2],percent:+m[3],label:m[4]}})}

    function draw(){const c=$("chart");if(!S.history.length)return;const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;const x=c.getContext("2d");x.scale(d,d);const w=r.width,h=r.height,p={l:38,r:15,t:15,b:30};x.font="12px system-ui";x.fillStyle="#718087";x.strokeStyle="#e4dfd5";[0,25,50,75,100].forEach(v=>{const y=p.t+(100-v)/100*(h-p.t-p.b);x.beginPath();x.moveTo(p.l,y);x.lineTo(w-p.r,y);x.stroke();x.fillText(v,7,y+4)});const pts=S.history.map((v,i)=>({x:S.history.length===1?(p.l+w-p.r)/2:p.l+i*(w-p.l-p.r)/(S.history.length-1),y:p.t+(100-v.percent)/100*(h-p.t-p.b)}));if(pts.length>1){x.beginPath();pts.forEach((v,i)=>i?x.lineTo(v.x,v.y):x.moveTo(v.x,v.y));x.strokeStyle="#087e78";x.lineWidth=3;x.stroke()}pts.forEach((v,i)=>{x.beginPath();x.arc(v.x,v.y,5,0,Math.PI*2);x.fillStyle=i===pts.length-1?"#e56b4d":"#087e78";x.fill()})}window.addEventListener("resize",()=>requestAnimationFrame(draw));

    $("back").onclick=()=>{$("result").classList.remove("show");$("dashboard").style.display="block";$("mainActions").style.display="flex";renderDash();scrollTo({top:0})};function download(){if(!S.history.length){$("notice").textContent=T.noExport;return}const u=URL.createObjectURL(new Blob([csv()],{type:"text/csv;charset=utf-8"})),a=document.createElement("a");a.href=u;a.download=`${S.name.replace(/[<>:"/\\|?*]/g,"_")}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$("exportBtn").onclick=$("resultExport").onclick=download;$("importBtn").onclick=()=>$("csvInput").click();$("csvInput").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;try{const imported=parseCsv(await f.text()),m=new Map(S.history.map(x=>[x.time,x]));imported.forEach(x=>m.set(x.time,x));S.history=[...m.values()].sort((a,b)=>a.time.localeCompare(b.time));save();renderDash();$("notice").textContent=T.imported(imported.length,f.name);$("notice").className="notice"}catch(err){$("notice").textContent=err.message;$("notice").className="notice error"}};
