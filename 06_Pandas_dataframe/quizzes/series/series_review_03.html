  <style>
    :root{--ink:#17232b;--muted:#63727b;--paper:#f7f4ed;--card:#fffdf8;--line:#ded9cd;--teal:#087e78;--dark:#055d59;--coral:#e56b4d;--gold:#f2b544;--good:#267a4b;--bad:#b23b3b;--shadow:0 18px 50px #182a2f1f;--r:22px}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 8% 5%,#f2b54447,transparent 25rem),radial-gradient(circle at 90% 15%,#087e7833,transparent 30rem),var(--paper);font:16px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{width:min(1120px,calc(100% - 32px));margin:auto;padding:28px 0 56px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px;font-weight:850}.mark{width:44px;height:44px;display:grid;place-items:center;color:#fff;background:var(--teal);border-radius:14px;box-shadow:0 8px 20px #087e783d}.brand small{display:block;color:var(--muted);font-weight:600;letter-spacing:.06em}.panel{background:#fffdf8eb;border:1px solid #ded9cde6;border-radius:var(--r);box-shadow:var(--shadow)}
    .login{min-height:560px;display:grid;grid-template-columns:1.05fr .95fr;overflow:hidden}.login-copy{padding:clamp(32px,6vw,72px);display:flex;flex-direction:column;justify-content:center}.eyebrow{color:var(--coral);font-weight:850;text-transform:uppercase;letter-spacing:.12em;font-size:.78rem}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(2.35rem,5vw,4.7rem);line-height:.98;letter-spacing:-.055em;margin:10px 0 22px}h1 span{color:var(--teal)}.lede{color:var(--muted);font-size:1.08rem}.pills{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 30px}.pill{padding:8px 12px;border-radius:999px;background:#eef4f1;color:var(--dark);font-weight:750;font-size:.88rem}.login-form{display:grid;gap:10px;max-width:480px}label{font-weight:800}input[type=text]{width:100%;padding:14px 16px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:13px;outline:0}input[type=text]:focus{border-color:var(--teal);box-shadow:0 0 0 4px #087e781f}.btn{border:0;border-radius:13px;padding:13px 18px;font-weight:850;color:#fff;background:var(--teal);transition:.16s}.btn:hover:not(:disabled){background:var(--dark);transform:translateY(-1px)}.btn:focus-visible,.option:focus-visible{outline:3px solid #f2b544cc;outline-offset:3px}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.secondary{color:var(--dark);background:#e9f3f0}.btn.ghost{color:var(--ink);background:transparent;border:1px solid var(--line)}.help{color:var(--muted);font-size:.84rem}
    .art{position:relative;overflow:hidden;min-height:430px;background:linear-gradient(145deg,var(--dark),#0c8b82 64%,#25a69a)}.code{position:absolute;width:min(400px,82%);padding:24px;color:#d7fff8;background:#0a2026d1;border:1px solid #ffffff26;border-radius:18px;box-shadow:0 26px 60px #0003;font:600 .9rem/1.8 ui-monospace,monospace}.code.one{top:14%;left:9%;transform:rotate(-3deg)}.code.two{right:7%;bottom:13%;transform:rotate(4deg)}.key{color:#ffce69}.call{color:#73e6d7}.note{color:#9eb8b8}.orb{position:absolute;border-radius:50%;background:#ffffff14}.orb.a{width:280px;height:280px;top:-100px;right:-70px}.orb.b{width:180px;height:180px;bottom:-60px;left:-50px}
    #app{display:none}.user{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:#dceee9;color:var(--dark);font-weight:900}.hero{padding:28px;margin-bottom:18px;background:linear-gradient(115deg,#073f3f,var(--teal));color:#fff;position:relative;overflow:hidden}.hero:after{content:"?";position:absolute;right:36px;top:-55px;font-weight:900;font-size:11rem;opacity:.08}.hero h2{margin-bottom:7px;font-size:clamp(1.65rem,3vw,2.4rem);letter-spacing:-.035em}.hero p{margin:0;color:#ccece7}.notice{margin-bottom:18px;padding:14px 16px;border-radius:12px;background:#eef7f5;border:1px solid #b8ddd6;color:var(--dark)}.notice.error{background:#ffeded;border-color:#efb0b0;color:#7f2828}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{padding:20px}.stat-label{color:var(--muted);font-weight:750;font-size:.88rem}.stat-value{font-size:clamp(1.65rem,3vw,2.35rem);line-height:1.15;margin-top:8px;font-weight:900}.stat-sub{color:var(--muted);font-size:.83rem;margin-top:6px}.best{background:linear-gradient(150deg,#fff8df,#fffdf8);border-color:#efdba1}.dash-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:16px}.chart-card,.history-card{padding:22px;min-width:0}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.section-head h3{margin:0;font-size:1.05rem}#chart{display:block;width:100%;height:230px}.empty{padding:34px 16px;text-align:center;color:var(--muted)}.history-wrap{max-height:270px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{padding:10px 8px;border-bottom:1px solid #ece7dc;text-align:left;white-space:nowrap}th{color:var(--muted);font-size:.76rem;text-transform:uppercase;letter-spacing:.06em}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0}.actions .spacer{flex:1}
    .quiz{display:none;padding:clamp(22px,5vw,46px)}.quiz.show,.result.show{display:block}.quiz-top{display:flex;justify-content:space-between;gap:14px;margin-bottom:12px}.qcount{font-weight:900;color:var(--dark)}.live{color:var(--muted);font-weight:750}.progress{height:8px;overflow:hidden;border-radius:99px;background:#e6e2d8;margin-bottom:30px}.progress div{height:100%;width:0;background:linear-gradient(90deg,var(--teal),#36ae9e)}.tag{display:inline-block;margin-bottom:12px;padding:5px 10px;border-radius:8px;background:#e9f3f0;color:var(--dark);font-size:.78rem;font-weight:850}.question{font-size:clamp(1.25rem,2.4vw,1.75rem);line-height:1.3;letter-spacing:-.025em;margin-bottom:24px}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{min-height:68px;display:flex;align-items:center;gap:12px;padding:14px 16px;color:var(--ink);text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px}.option:hover:not(:disabled){transform:translateY(-1px);border-color:var(--teal);background:#f4fbf9}.option:disabled{cursor:default;opacity:1}.option.correct{border-color:#57a878;background:#eaf7ee;color:#155e38}.option.wrong{border-color:#da7777;background:#fff0f0;color:#8f2929}.letter{flex:0 0 32px;height:32px;display:grid;place-items:center;border-radius:9px;background:#f0eee8;font-weight:900}.feedback{display:none;margin-top:20px;padding:17px 18px;border-left:4px solid var(--teal);border-radius:10px;background:#eef7f5}.feedback.show{display:block}.feedback strong{display:block;margin-bottom:4px}.quiz-foot{display:flex;justify-content:flex-end;margin-top:22px}.result{display:none;padding:clamp(28px,6vw,60px);text-align:center}.result-emoji{font-size:4.6rem;line-height:1}.result h2{font-size:clamp(2rem,5vw,3.7rem);letter-spacing:-.045em;margin:14px 0 4px}.result-score,.save{color:var(--muted)}.record{display:none;width:fit-content;margin:18px auto 0;padding:9px 14px;border-radius:999px;background:#fff0c5;color:#765412;font-weight:900}.record.show{display:block}.save{margin:18px auto}.result-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.review{margin-top:30px;text-align:left}.review-item{padding:16px 0;border-top:1px solid var(--line)}.review-item p{margin:5px 0}.right{color:var(--good);font-weight:800}
    @media(max-width:820px){.login{grid-template-columns:1fr}.art{min-height:320px}.stats,.dash-grid,.options{grid-template-columns:1fr}}@media(max-width:520px){.shell{width:calc(100% - 20px);padding-top:16px}.brand small,.user>span:not(.avatar){display:none}.login-copy{padding:28px 22px}.hero,.stat,.chart-card,.history-card{padding:18px}.quiz-top{flex-direction:column}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand"><div class="mark">Q</div><div id="brandTitle">Lesson Quiz<small id="brandSub">REVIEW LAB</small></div></div><div class="user" id="user" hidden><span class="avatar" id="avatar">L</span><span id="userName"></span></div></header>
    <section class="panel login" id="login">
      <div class="login-copy"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="lede" id="subtitle"></p><div class="pills"><span class="pill" id="bankPill"></span><span class="pill" id="attemptPill"></span><span class="pill" id="storagePill"></span></div><form class="login-form" id="loginForm"><label for="name" id="nameLabel"></label><input id="name" type="text" autocomplete="name" maxlength="100" required><button class="btn" id="enter" type="submit"></button><div class="help" id="storageHelp"></div><div class="notice error" id="loginError" hidden></div></form></div>
      <div class="art" aria-hidden="true"><div class="orb a"></div><div class="orb b"></div><div class="code one"><span class="key">learn</span>.<span class="call">map</span>(idea =&gt; recall(idea))<br><span class="note">// practice makes progress</span></div><div class="code two"><span class="key">result</span> = <span class="call">challenge</span>(<span class="key">today</span>)</div></div>
    </section>
    <section id="app">
      <div class="panel hero"><h2 id="welcome"></h2><p id="encourage"></p></div><div class="notice" id="notice"></div>
      <div id="dashboard"><div class="stats"><article class="panel stat"><div class="stat-label" id="totalLabel"></div><div class="stat-value" id="total">0</div><div class="stat-sub" id="totalSub"></div></article><article class="panel stat"><div class="stat-label" id="latestLabel"></div><div class="stat-value" id="latest">—</div><div class="stat-sub" id="latestSub"></div></article><article class="panel stat best"><div class="stat-label" id="bestLabel"></div><div class="stat-value" id="best">—</div><div class="stat-sub" id="bestSub"></div></article></div>
        <div class="dash-grid"><article class="panel chart-card"><div class="section-head"><h3 id="trendLabel"></h3><span class="help">%</span></div><div class="empty" id="chartEmpty"></div><canvas id="chart"></canvas></article><article class="panel history-card"><div class="section-head"><h3 id="historyLabel"></h3><span class="help" id="historyCount"></span></div><div class="empty" id="historyEmpty"></div><div class="history-wrap" id="historyWrap" hidden><table><thead><tr><th id="timeHead"></th><th id="scoreHead"></th><th id="levelHead"></th></tr></thead><tbody id="historyBody"></tbody></table></div></article></div>
      </div>
      <div class="actions" id="mainActions"><button class="btn" id="start"></button><button class="btn secondary" id="importBtn"></button><button class="btn ghost" id="exportBtn"></button><input id="csvInput" type="file" accept=".csv,text/csv" hidden><div class="spacer"></div><button class="btn ghost" id="switchUser"></button></div>
      <section class="panel quiz" id="quiz" aria-live="polite"><div class="quiz-top"><div class="qcount" id="qcount"></div><div class="live" id="live"></div></div><div class="progress"><div id="bar"></div></div><span class="tag" id="topic"></span><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback"><strong id="feedbackTitle"></strong><span id="feedbackText"></span></div><div class="quiz-foot"><button class="btn" id="next" disabled></button></div></section>
      <section class="panel result" id="result" aria-live="polite"><div class="result-emoji" id="resultEmoji"></div><h2 id="resultTitle"></h2><div class="result-score" id="resultScore"></div><div class="record" id="record"></div><div class="save" id="save"></div><div class="result-actions"><button class="btn" id="again"></button><button class="btn ghost" id="resultExport"></button><button class="btn ghost" id="back"></button></div><div class="review" id="review"></div></section>
    </section>
  </main>
  <script>
    const QUIZ={"meta":{"id":"pandas-series-review-11-14-en","title":"Pandas Series Review: Exercises 11-14","subtitle":"Apply, transform, aggregate, filter, combine, and string operations","attemptSize":20,"language":"en","bankSize":50},"questions":[{"id":"q01","t":"Apply and Map","q":"What does `Series.apply()` do in the lesson?","c":["It invokes a function on each element or the entire Series","It only sorts the index","It always groups duplicate labels","It converts a Series into a DataFrame"],"a":0,"e":"The lesson describes `apply()` as a versatile method for applying built-in or custom functions element-wise or to the entire Series."},{"id":"q02","t":"Apply and Map","q":"Which expression applies the natural logarithm to every value in `s_nums`?","c":["`s_nums.apply(np.log)`","`s_nums.filter(np.log)`","`s_nums.where(np.log)`","`s_nums.groupby(np.log)`"],"a":0,"e":"The lesson uses `s_nums.apply(np.log)` for element-wise natural logarithms."},{"id":"q03","t":"Apply and Map","q":"In the mixed Series example, what happens to numeric values when the function uppercases strings?","c":["They are left unchanged","They are converted to uppercase text","They are replaced with NaN","They are removed"],"a":0,"e":"The lambda applies `upper()` only when the value is a string; values such as 42 and 3.14 remain unchanged."},{"id":"q04","t":"Apply and Map","q":"What is a key use of `Series.map()` shown in the lesson?","c":["Mapping each value with a dictionary, Series, or function","Creating a MultiIndex from scratch","Calculating a rolling mean","Changing only column names"],"a":0,"e":"`map()` supports dictionaries, Series, and functions for element-wise mappings."},{"id":"q05","t":"Apply and Map","q":"What happens to values not found in a mapping dictionary?","c":["They become NaN","They become zero","They are copied from the previous row","They raise a KeyError in every case"],"a":0,"e":"The lesson explicitly notes that unmapped values become NaN when a dictionary or Series is used."},{"id":"q06","t":"Transform","q":"What shape does `Series.transform()` preserve?","c":["The same length as the input Series","Only the same dtype","Only the same index name","A single scalar"],"a":0,"e":"`transform()` is presented as preserving the input Series shape and length."},{"id":"q07","t":"Transform","q":"What does `s_nums.transform({'x+1': ..., 'x*2': ...})` produce in the lesson?","c":["A table with one column for each named function","A single maximum value","A Boolean mask","A dictionary of unmapped values"],"a":0,"e":"Multiple transform functions create columns named `x+1` and `x*2`, with one result per input row."},{"id":"q08","t":"GroupBy Transform","q":"Why do rows 0 and 4 both become 55 in the grouped transform example?","c":["Both rows belong to the `1st` group","They have identical original values","The index is reset automatically","The transform drops one of the rows"],"a":0,"e":"Rows 0 and 4 share the `Date` value `1st`, so the grouped sum is broadcast to both rows."},{"id":"q09","t":"Aggregation","q":"What can `Series.agg()` return depending on the input and functions?","c":["A scalar, Series, or DataFrame","Only a list","Only a Boolean Series","Only a NumPy array"],"a":0,"e":"The lesson states that aggregation can return a scalar, Series, or DataFrame."},{"id":"q10","t":"Aggregation","q":"Which statistic is calculated by the custom range function in the lesson?","c":["Maximum minus minimum","Mean divided by count","Minimum minus maximum","Maximum multiplied by minimum"],"a":0,"e":"The custom function is `lambda x: x.max() - x.min()`."},{"id":"q11","t":"GroupBy","q":"What is the mean of the Falcon values 390 and 350 after grouping by the index level?","c":["370","350","390","740"],"a":0,"e":"The mean is `(390 + 350) / 2 = 370`, as shown by `groupby(level=0).mean()`."},{"id":"q12","t":"Pipe","q":"What is the main purpose of `Series.pipe()` in the lesson?","c":["To make method chains readable by passing the Series to functions","To rename every index label","To concatenate two Series by position","To force all values to strings"],"a":0,"e":"`pipe()` applies functions within a readable method chain and can pass additional arguments."},{"id":"q13","t":"Filter","q":"What does `Series.filter()` use as its filtering basis?","c":["Index labels","Series values","The dtype only","The Series name only"],"a":0,"e":"The lesson emphasizes that `filter()` subsets by index labels, not by content values."},{"id":"q14","t":"Filter","q":"What does `filter(items=['Bird_1', 'Bird_2'])` select?","c":["The two specified index labels","Values equal to 1 or 2","Labels containing the word `value`","The first two rows after sorting"],"a":0,"e":"The `items` argument selects the listed index labels."},{"id":"q15","t":"Filter","q":"What do `filter(regex='[24]$')` and the sample bird index select?","c":["Labels ending in 2 or 4","Values between 2 and 4","Labels beginning with 2 or 4","Only missing values"],"a":0,"e":"The regular expression `[24]$` matches labels whose final character is 2 or 4."},{"id":"q16","t":"Filter","q":"What does `filter(like='rd_')` match in the bird example?","c":["Index labels containing `rd_`","Values containing `rd_`","Only labels ending in `_rd`","Rows with numeric values"],"a":0,"e":"The `like` argument performs a substring match against index labels."},{"id":"q17","t":"Where","q":"What does `s_nums.where(s_nums <= 3)` do to values greater than 3?","c":["Replaces them with NaN","Deletes their index labels","Replaces them with 3","Sorts them at the end"],"a":0,"e":"`where()` keeps values meeting the condition and uses NaN by default for values that do not."},{"id":"q18","t":"Where","q":"What is the effect of adding `.dropna(ignore_index=True)` after `where()`?","c":["It removes NaN values and resets the resulting index","It keeps NaN values and preserves all labels","It changes every value to a Boolean","It groups values by their original index"],"a":0,"e":"The example first drops NaN values and then resets the remaining index to 0, 1."},{"id":"q19","t":"Where","q":"In `s_nums.where(s_nums <= 3, other=0)`, what replaces values greater than 3?","c":["0","3","NaN","The mean of the Series"],"a":0,"e":"The `other=0` argument supplies 0 wherever the condition is False."},{"id":"q20","t":"Where","q":"In the mixed Series example, which values become `Unknown`?","c":["The integer, float, and None values","Only the strings","Only the first string","All values"],"a":0,"e":"The condition tests whether each value is a string, so non-strings are replaced with `Unknown`."},{"id":"q21","t":"Concat","q":"What happens to the indexes in `pd.concat([s1, s2])` without extra arguments?","c":["They are preserved, so duplicate labels can appear","They are always reset to 0 through 3","They are converted to strings","They are discarded"],"a":0,"e":"The basic example retains both input indexes, producing 0, 1, 0, 1."},{"id":"q22","t":"Concat","q":"What does `ignore_index=True` do in `pd.concat([s1, s2], ignore_index=True)`?","c":["Creates a new sequential index","Keeps duplicate indexes and adds a key level","Sorts values alphabetically","Drops all values from the second Series"],"a":0,"e":"The result receives a fresh sequential index 0, 1, 2, 3."},{"id":"q23","t":"Concat","q":"What structure is created by `pd.concat([s1, s2], keys=['first', 'second'])`?","c":["A MultiIndex with `first` and `second` as outer keys","A dictionary keyed by values","A flat index containing only first and second","A DataFrame with two unrelated columns"],"a":0,"e":"The `keys` argument adds an outer index level around the original Series indexes."},{"id":"q24","t":"Combine","q":"What does `Series.combine()` apply between two aligned Series?","c":["A supplied two-value function element by element","Only a string replacement","A groupby aggregation by default","A row-wise sort"],"a":0,"e":"`combine()` sends corresponding values to the function for each aligned index label."},{"id":"q25","t":"Combine","q":"Why does the lesson use `lambda x, y: x + y` instead of the built-in `sum` in `combine()`?","c":["`combine()` passes two separate values, while `sum` expects an iterable","`sum` only works with strings","Lambdas are required by pandas","`combine()` cannot add numbers"],"a":0,"e":"The function supplied to `combine()` must accept the two values, such as `x` and `y`."},{"id":"q26","t":"Combine","q":"What does `fill_value=0` do when one Series lacks an index label?","c":["It supplies 0 for the missing side before applying the function","It drops the missing label","It fills every existing value with 0","It changes the index label to 0"],"a":0,"e":"For the missing `duck` value in `s1`, `fill_value=0` lets the function compare or combine 0 with the value from `s2`."},{"id":"q27","t":"String Accessor","q":"Why is `.str.upper()` used instead of `.upper()` on a Series?","c":["The `.str` accessor applies string methods element-wise","`.upper()` only works on numbers","`.str` sorts the Series first","`.upper()` always returns a DataFrame"],"a":0,"e":"The Series has no direct `.upper()` method; `.str` provides the vectorized string namespace."},{"id":"q28","t":"String Accessor","q":"What should be done before applying string methods to the numeric Series in the lesson?","c":["Convert it with `.astype(str)`","Call `.groupby()`","Use `ignore_index=True`","Apply `.factorize()`"],"a":0,"e":"The lesson converts the numeric Series to strings before calling `.str.fullmatch()`."},{"id":"q29","t":"String Slicing","q":"For `Tony_Stark`, what does `.str.slice(start=0, stop=4)` return?","c":["`Tony`","`Stark`","`Tony_`","`Tony_Stark`"],"a":0,"e":"The stop position is exclusive, so positions 0 through 3 produce `Tony`."},{"id":"q30","t":"String Slicing","q":"What does `.str.get(20)` return for the hero strings, which are shorter than 21 characters?","c":["NaN","An empty string","The last character","An IndexError for every row"],"a":0,"e":"The lesson notes that `.str.get()` handles out-of-bounds access gracefully by returning NaN."},{"id":"q31","t":"String Transformation","q":"What is the difference between `.str.title()` and `.str.capitalize()` in the example?","c":["`title()` capitalizes each word, while `capitalize()` affects the first character and lowercases the rest","They are identical for every string","`title()` only changes numbers","`capitalize()` reverses letter case"],"a":0,"e":"For example, `pandas is FUN` becomes `Pandas Is Fun` with title case and `Pandas is fun` with capitalize."},{"id":"q32","t":"String Information","q":"What does `.str.len()` return?","c":["The character count of each string","The number of Series rows","The number of unique words","The first character of each string"],"a":0,"e":"The lesson uses `.str.len()` to return the length of every string."},{"id":"q33","t":"String Stripping","q":"Which method removes both leading and trailing whitespace?","c":["`.str.strip()`","`.str.lstrip()`","`.str.rstrip()`","`.str.trim_middle()`"],"a":0,"e":"`strip()` removes whitespace from both ends; `lstrip()` and `rstrip()` remove one side only."},{"id":"q34","t":"String Checks","q":"Which method returns True for `⅕` in the lesson's character checks?","c":["`.str.isnumeric()`","`.str.isdecimal()`","`.str.isdigit()`","`.str.isalpha()`"],"a":0,"e":"The lesson distinguishes numeric characters: `⅕` is numeric but not a decimal digit or digit under those checks."},{"id":"q35","t":"String Checks","q":"How can `NaN` be treated as False in `str.startswith()`?","c":["Pass `na=False`","Pass `missing=False`","Call `.dropna()` automatically","Use `regex=True`"],"a":0,"e":"The example uses `s_start.str.startswith(pat=('b', 'B'), na=False)`."},{"id":"q36","t":"String Contains","q":"What is the effect of `case=False, regex=False, na=False` in the contains example?","c":["It performs case-insensitive literal matching and returns False for NaN","It performs only regex matching and keeps NaN","It converts every string to lowercase permanently","It matches only strings beginning with the pattern"],"a":0,"e":"`case=False` ignores case, `regex=False` makes the pattern literal, and `na=False` maps missing values to False."},{"id":"q37","t":"String Splitting","q":"What does `.str.split('_', expand=True)` produce?","c":["Separate columns for the split parts","One concatenated string","A Boolean Series","Only the first split part"],"a":0,"e":"With `expand=True`, split parts are expanded into separate columns."},{"id":"q38","t":"String Splitting","q":"How does `.str.rsplit('_', n=2)` differ from `.str.split('_', n=2)`?","c":["It limits splits from the right instead of from the left","It removes all underscores","It always returns a scalar","It only works on numeric strings"],"a":0,"e":"The lesson shows `rsplit` preserving the left portion and making up to two splits from the right."},{"id":"q39","t":"String Partition","q":"What does `.str.partition('-')` return by default?","c":["Three columns: before, separator, and after the first separator","A list of all pieces","Only the text after the last separator","A single Boolean column"],"a":0,"e":"`partition()` splits at the first occurrence and returns the part before, the separator, and the remainder."},{"id":"q40","t":"String Joining","q":"What does `s_join.str.join('-')` do to a Series of lists?","c":["Joins each list's elements with `-`","Joins all Series rows into one string","Replaces every hyphen with a space","Splits each list at hyphens"],"a":0,"e":"The method joins the elements within each list using the supplied separator."},{"id":"q41","t":"String Replacement","q":"With `regex=True`, what does `.str.replace(r'\\d', '#')` do to `1234`?","c":["It produces `####`","It produces `#`","It leaves `1234` unchanged","It produces `1234#`"],"a":0,"e":"The pattern `\\d` matches each individual digit, so all four digits are replaced separately."},{"id":"q42","t":"String Replacement","q":"How does `.str.replace(r'\\d+', '#', regex=True)` differ for `1234`?","c":["The whole digit sequence becomes one `#`","Each digit becomes a separate `#`","Only the first digit is removed","The string becomes empty"],"a":0,"e":"The `+` quantifier matches the complete consecutive digit sequence, producing one replacement."},{"id":"q43","t":"Regex Matching","q":"What is the difference between `.str.match()` and `.str.fullmatch()` in the lesson?","c":["`match()` checks the beginning; `fullmatch()` requires the entire string","`match()` requires the entire string; `fullmatch()` checks only the end","They are always identical","Both search only index labels"],"a":0,"e":"The lesson defines `match` as a beginning check and `fullmatch` as an entire-string check."},{"id":"q44","t":"Regex Finding","q":"What does `.str.find('_')` return when `_` is absent from a string?","c":["-1","NaN for every non-match","0","The string itself"],"a":0,"e":"The example shows `.find()` returning -1 when the substring is not present; NaN is reserved for missing input."},{"id":"q45","t":"Regex Extracting","q":"What does `.str.extract(pattern)` return by default when the pattern has one capture group?","c":["A DataFrame with one column","A scalar string","A list per row","A Boolean mask"],"a":0,"e":"`expand=True` is the default, so one capture group produces a one-column DataFrame."},{"id":"q46","t":"Regex Extracting","q":"What does `expand=False` change in the one-group `str.extract()` example?","c":["It returns a Series instead of a one-column DataFrame","It extracts all matches instead of the first","It disables regular expressions","It fills unmatched rows with zero"],"a":0,"e":"The lesson explicitly shows `expand=False` returning a Series for one capture group."},{"id":"q47","t":"String Concatenation","q":"What does `s1.str.cat()` return when `others` is omitted?","c":["One string containing all values","A Series joined element-wise to another Series","A DataFrame of characters","A Boolean mask"],"a":0,"e":"Without `others`, `str.cat()` concatenates all values into one string,     function load(){try{const x=JSON.parse(localStorage.getItem(key())||"[]");return Array.isArray(x)?x:[]}catch{return[]}}function save(){localStorage.setItem(key(),JSON.stringify(S.history))}function stamp(){const d=new Date(),p=(n,w=2)=>String(n).padStart(w,"0"),base=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;if(!S.history.some(x=>x.time===base))return base;let v=`${base}.${p(d.getMilliseconds(),3)}`,n=2;while(S.history.some(x=>x.time===v))v=`${base}.${p(d.getMilliseconds(),3)}-${n++}`;return v}
    function esc(v){v=String(v);return/[",\r\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v}function csv(){return"\uFEFF"+["Name",...S.history.map(x=>x.time)].map(esc).join(",")+"\r\n"+[S.name,...S.history.map(x=>`${x.correct}/${x.total} (${pct(x.percent)}%) - ${x.label}`)].map(esc).join(",")+"\r\n"}function parseCsv(text){text=text.replace(/^\uFEFF/,"");const rows=[];let row=[],cell="",q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}else if(c==='"')q=true;else if(c===","){row.push(cell);cell=""}else if(c==="\n"){row.push(cell.replace(/\r$/,"") );rows.push(row);row=[];cell=""}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}if(q||rows.length!==2||rows[1][0]!==S.name||rows[0].length!==rows[1].length)throw Error(T.badCsv);return rows[0].slice(1).map((time,i)=>{const m=rows[1][i+1].match(/^(\d+)\/(\d+) \(([\d.]+)%\) - (.+)$/);if(!m)throw Error(T.badCsv);return{time,correct:+m[1],total:+m[2],percent:+m[3],label:m[4]}})}

    function draw(){const c=$("chart");if(!S.history.length)return;const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;const x=c.getContext("2d");x.scale(d,d);const w=r.width,h=r.height,p={l:38,r:15,t:15,b:30};x.font="12px system-ui";x.fillStyle="#718087";x.strokeStyle="#e4dfd5";[0,25,50,75,100].forEach(v=>{const y=p.t+(100-v)/100*(h-p.t-p.b);x.beginPath();x.moveTo(p.l,y);x.lineTo(w-p.r,y);x.stroke();x.fillText(v,7,y+4)});const pts=S.history.map((v,i)=>({x:S.history.length===1?(p.l+w-p.r)/2:p.l+i*(w-p.l-p.r)/(S.history.length-1),y:p.t+(100-v.percent)/100*(h-p.t-p.b)}));if(pts.length>1){x.beginPath();pts.forEach((v,i)=>i?x.lineTo(v.x,v.y):x.moveTo(v.x,v.y));x.strokeStyle="#087e78";x.lineWidth=3;x.stroke()}pts.forEach((v,i)=>{x.beginPath();x.arc(v.x,v.y,5,0,Math.PI*2);x.fillStyle=i===pts.length-1?"#e56b4d":"#087e78";x.fill()})}window.addEventListener("resize",()=>requestAnimationFrame(draw));
