  <style>
    :root{--ink:#17232b;--muted:#63727b;--paper:#f7f4ed;--card:#fffdf8;--line:#ded9cd;--teal:#087e78;--dark:#055d59;--coral:#e56b4d;--gold:#f2b544;--good:#267a4b;--bad:#b23b3b;--shadow:0 18px 50px #182a2f1f;--r:22px}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 8% 5%,#f2b54447,transparent 25rem),radial-gradient(circle at 90% 15%,#087e7833,transparent 30rem),var(--paper);font:16px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{width:min(1120px,calc(100% - 32px));margin:auto;padding:28px 0 56px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px;font-weight:850}.mark{width:44px;height:44px;display:grid;place-items:center;color:#fff;background:var(--teal);border-radius:14px;box-shadow:0 8px 20px #087e783d}.brand small{display:block;color:var(--muted);font-weight:600;letter-spacing:.06em}.panel{background:#fffdf8eb;border:1px solid #ded9cde6;border-radius:var(--r);box-shadow:var(--shadow)}
    .login{min-height:560px;display:grid;grid-template-columns:1.05fr .95fr;overflow:hidden}.login-copy{padding:clamp(32px,6vw,72px);display:flex;flex-direction:column;justify-content:center}.eyebrow{color:var(--coral);font-weight:850;text-transform:uppercase;letter-spacing:.12em;font-size:.78rem}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(2.35rem,5vw,4.7rem);line-height:.98;letter-spacing:-.055em;margin:10px 0 22px}h1 span{color:var(--teal)}.lede{color:var(--muted);font-size:1.08rem}.pills{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 30px}.pill{padding:8px 12px;border-radius:999px;background:#eef4f1;color:var(--dark);font-weight:750;font-size:.88rem}.login-form{display:grid;gap:10px;max-width:480px}label{font-weight:800}input[type=text]{width:100%;padding:14px 16px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:13px;outline:0}input[type=text]:focus{border-color:var(--teal);box-shadow:0 0 0 4px #087e781f}.btn{border:0;border-radius:13px;padding:13px 18px;font-weight:850;color:#fff;background:var(--teal);transition:.16s}.btn:hover:not(:disabled){background:var(--dark);transform:translateY(-1px)}.btn:focus-visible,.option:focus-visible{outline:3px solid #f2b544cc;outline-offset:3px}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.secondary{color:var(--dark);background:#e9f3f0}.btn.ghost{color:var(--ink);background:transparent;border:1px solid var(--line)}.help{color:var(--muted);font-size:.84rem}
    .art{position:relative;overflow:hidden;min-height:430px;background:linear-gradient(145deg,var(--dark),#0c8b82 64%,#25a69a)}.code{position:absolute;width:min(400px,82%);padding:24px;color:#d7fff8;background:#0a2026d1;border:1px solid #ffffff26;border-radius:18px;box-shadow:0 26px 60px #0003;font:600 .9rem/1.8 ui-monospace,monospace}.code.one{top:14%;left:9%;transform:rotate(-3deg)}.code.two{right:7%;bottom:13%;transform:rotate(4deg)}.key{color:#ffce69}.call{color:#73e6d7}.note{color:#9eb8b8}.orb{position:absolute;border-radius:50%;background:#ffffff14}.orb.a{width:280px;height:280px;top:-100px;right:-70px}.orb.b{width:180px;height:180px;bottom:-60px;left:-50px}
    #app{display:none}.user{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:#dceee9;color:var(--dark);font-weight:900}.hero{padding:28px;margin-bottom:18px;background:linear-gradient(115deg,#073f3f,var(--teal));color:#fff;position:relative;overflow:hidden}.hero:after{content:"?";position:absolute;right:36px;top:-55px;font-weight:900;font-size:11rem;opacity:.08}.hero h2{margin-bottom:7px;font-size:clamp(1.65rem,3vw,2.4rem);letter-spacing:-.035em}.hero p{margin:0;color:#ccece7}.notice{margin-bottom:18px;padding:14px 16px;border-radius:12px;background:#eef7f5;border:1px solid #b8ddd6;color:var(--dark)}.notice.error{background:#ffeded;border-color:#efb0b0;color:#7f2828}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{padding:20px}.stat-label{color:var(--muted);font-weight:750;font-size:.88rem}.stat-value{font-size:clamp(1.65rem,3vw,2.35rem);line-height:1.15;margin-top:8px;font-weight:900}.stat-sub{color:var(--muted);font-size:.83rem;margin-top:6px}.best{background:linear-gradient(150deg,#fff8df,#fffdf8);border-color:#efdba1}.dash-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:16px}.chart-card,.history-card{padding:22px;min-width:0}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.section-head h3{margin:0;font-size:1.05rem}#chart{display:block;width:100%;height:230px}.empty{padding:34px 16px;text-align:center;color:var(--muted)}.history-wrap{max-height:270px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{padding:10px 8px;border-bottom:1px solid #ece7dc;text-align:left;white-space:nowrap}th{color:var(--muted);font-size:.76rem;text-transform:uppercase;letter-spacing:.06em}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0}.actions .spacer{flex:1}
    .quiz{display:none;padding:clamp(22px,5vw,46px)}.quiz.show,.result.show{display:block}.quiz-top{display:flex;justify-content:space-between;gap:14px;margin-bottom:12px}.qcount{font-weight:900;color:var(--dark)}.live{color:var(--muted);font-weight:750}.progress{height:8px;overflow:hidden;border-radius:99px;background:#e6e2d8;margin-bottom:30px}.progress div{height:100%;width:0;background:linear-gradient(90deg,var(--teal),#36ae9e)}.tag{display:inline-block;margin-bottom:12px;padding:5px 10px;border-radius:8px;background:#e9f3f0;color:var(--dark);font-size:.78rem;font-weight:850}.question{font-size:clamp(1.25rem,2.4vw,1.75rem);line-height:1.3;letter-spacing:-.025em;margin-bottom:24px}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{min-height:68px;display:flex;align-items:center;gap:12px;padding:14px 16px;color:var(--ink);text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px}.option:hover:not(:disabled){transform:translateY(-1px);border-color:var(--teal);background:#f4fbf9}.option:disabled{cursor:default;opacity:1}.option.correct{border-color:#57a878;background:#eaf7ee;color:#155e38}.option.wrong{border-color:#da7777;background:#fff0f0;color:#8f2929}.letter{flex:0 0 32px;height:32px;display:grid;place-items:center;border-radius:9px;background:#f0eee8;font-weight:900}.feedback{display:none;margin-top:20px;padding:17px 18px;border-left:4px solid var(--teal);border-radius:10px;background:#eef7f5}.feedback.show{display:block}.feedback strong{display:block;margin-bottom:4px}.quiz-foot{display:flex;justify-content:flex-end;margin-top:22px}.result{display:none;padding:clamp(28px,6vw,60px);text-align:center}.result-emoji{font-size:4.6rem;line-height:1}.result h2{font-size:clamp(2rem,5vw,3.7rem);letter-spacing:-.045em;margin:14px 0 4px}.result-score,.save{color:var(--muted)}.record{display:none;width:fit-content;margin:18px auto 0;padding:9px 14px;border-radius:999px;background:#fff0c5;color:#765412;font-weight:900}.record.show{display:block}.save{margin:18px auto}.result-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.review{margin-top:30px;text-align:left}.review-item{padding:16px 0;border-top:1px solid var(--line)}.review-item p{margin:5px 0}.right{color:var(--good);font-weight:800}
    @media(max-width:820px){.login{grid-template-columns:1fr}.art{min-height:320px}.stats,.dash-grid,.options{grid-template-columns:1fr}}@media(max-width:520px){.shell{width:calc(100% - 20px);padding-top:16px}.brand small,.user>span:not(.avatar){display:none}.login-copy{padding:28px 22px}.hero,.stat,.chart-card,.history-card{padding:18px}.quiz-top{flex-direction:column}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand"><div class="mark">Q</div><div id="brandTitle">Lesson Quiz<small id="brandSub">REVIEW LAB</small></div></div><div class="user" id="user" hidden><span class="avatar" id="avatar">L</span><span id="userName"></span></div></header>
    <section class="panel login" id="login">
      <div class="login-copy"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="lede" id="subtitle"></p><div class="pills"><span class="pill" id="bankPill"></span><span class="pill" id="attemptPill"></span><span class="pill" id="storagePill"></span></div><form class="login-form" id="loginForm"><label for="name" id="nameLabel"></label><input id="name" type="text" autocomplete="name" maxlength="100" required><button class="btn" id="enter" type="submit"></button><div class="help" id="storageHelp"></div><div class="notice error" id="loginError" hidden></div></form></div>
      <div class="art" aria-hidden="true"><div class="orb a"></div><div class="orb b"></div><div class="code one"><span class="key">learn</span>.<span class="call">map</span>(idea =&gt; recall(idea))<br><span class="note">// practice makes progress</span></div><div class="code two"><span class="key">result</span> = <span class="call">challenge</span>(<span class="key">today</span>)</div></div>
    </section>
    <section id="app">
      <div class="panel hero"><h2 id="welcome"></h2><p id="encourage"></p></div><div class="notice" id="notice"></div>
      <div id="dashboard"><div class="stats"><article class="panel stat"><div class="stat-label" id="totalLabel"></div><div class="stat-value" id="total">0</div><div class="stat-sub" id="totalSub"></div></article><article class="panel stat"><div class="stat-label" id="latestLabel"></div><div class="stat-value" id="latest">—</div><div class="stat-sub" id="latestSub"></div></article><article class="panel stat best"><div class="stat-label" id="bestLabel"></div><div class="stat-value" id="best">—</div><div class="stat-sub" id="bestSub"></div></article></div>
        <div class="dash-grid"><article class="panel chart-card"><div class="section-head"><h3 id="trendLabel"></h3><span class="help">%</span></div><div class="empty" id="chartEmpty"></div><canvas id="chart"></canvas></article><article class="panel history-card"><div class="section-head"><h3 id="historyLabel"></h3><span class="help" id="historyCount"></span></div><div class="empty" id="historyEmpty"></div><div class="history-wrap" id="historyWrap" hidden><table><thead><tr><th id="timeHead"></th><th id="scoreHead"></th><th id="levelHead"></th></tr></thead><tbody id="historyBody"></tbody></table></div></article></div>
      </div>
      <div class="actions" id="mainActions"><button class="btn" id="start"></button><button class="btn secondary" id="importBtn"></button><button class="btn ghost" id="exportBtn"></button><input id="csvInput" type="file" accept=".csv,text/csv" hidden><div class="spacer"></div><button class="btn ghost" id="switchUser"></button></div>
      <section class="panel quiz" id="quiz" aria-live="polite"><div class="quiz-top"><div class="qcount" id="qcount"></div><div class="live" id="live"></div></div><div class="progress"><div id="bar"></div></div><span class="tag" id="topic"></span><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback"><strong id="feedbackTitle"></strong><span id="feedbackText"></span></div><div class="quiz-foot"><button class="btn" id="next" disabled></button></div></section>
      <section class="panel result" id="result" aria-live="polite"><div class="result-emoji" id="resultEmoji"></div><h2 id="resultTitle"></h2><div class="result-score" id="resultScore"></div><div class="record" id="record"></div><div class="save" id="save"></div><div class="result-actions"><button class="btn" id="again"></button><button class="btn ghost" id="resultExport"></button><button class="btn ghost" id="back"></button></div><div class="review" id="review"></div></section>
    </section>
  </main>
  <script>
    const QUIZ={"meta":{"id":"pandas-series-review-01-05-en","title":"Pandas Series Review: Exercises 1-5","subtitle":"Creation, attributes, access, updates, deletion, and type conversion","attemptSize":20,"language":"en","bankSize":50},"questions":[{"id":"q01","t":"Creating Series","q":"What does pandas create automatically when you build `pd.Series([1, 2, 3, 4, 5])` without passing `index`?","c":["A default integer index starting from 0","A string index copied from the values","A MultiIndex with one level per value","No index at all"],"a":0,"e":"The lesson shows that pandas creates default integer labels 0 through 4 when no index is supplied."},{"id":"q02","t":"Creating Series","q":"In `pd.Series(data=[1,2,3], index=['one','two','three'])`, what are `'one'`, `'two'`, and `'three'`?","c":["Index labels","Column names","Data values","Dtype names"],"a":0,"e":"The `index` argument supplies labels used to identify each Series element."},{"id":"q03","t":"Creating Series","q":"When a Series is created from `{'a': 1, 'b': 2}`, what becomes the Series index?","c":["The dictionary keys","The dictionary values","A new random index","The dtype of the values"],"a":0,"e":"For dictionary input, keys are used as index labels and values become the Series data."},{"id":"q04","t":"Creating Series","q":"What is the result of `pd.Series(data=5, index=['a','b','c'])`?","c":["A Series with labels a, b, c and value 5 repeated","A Series with one element labeled 5","A ValueError because scalar data cannot use an index","A Series whose dtype is object by default"],"a":0,"e":"A scalar value is broadcast to every label in the supplied index."},{"id":"q05","t":"MultiIndex","q":"Which pandas object is used in the lesson to create a multi-level indexed Series?","c":["`pd.MultiIndex`","`pd.Categorical`","`pd.Timestamp`","`pd.DataFrameIndex`"],"a":0,"e":"The example builds a multi-level index with `pd.MultiIndex` and then passes it to `pd.Series`."},{"id":"q06","t":"MultiIndex","q":"In the animal example, what do the two MultiIndex levels represent?","c":["Animal names and measurements","Rows and columns of a DataFrame","Dtypes and missing-value markers","Old values and new values"],"a":0,"e":"Level 0 contains animal labels such as llama, cow, and falcon; level 1 contains speed, weight, and length."},{"id":"q07","t":"Copying Series","q":"What method is used in the lesson to copy a Series?","c":["`s.copy()`","`s.clone()`","`pd.copy(s)`","`s.deepcopy()`"],"a":0,"e":"The lesson demonstrates copying with `s_original.copy()`."},{"id":"q08","t":"Copying Series","q":"What does `np.shares_memory(s_original.to_numpy(), s_copy.to_numpy())` return in the lesson after `s_original.copy()`?","c":["False","True","None","It raises KeyError"],"a":0,"e":"The copied Series data does not share NumPy memory with the original in the shown example."},{"id":"q09","t":"Series Basics","q":"Which description best matches a pandas Series?","c":["A one-dimensional labeled array","A two-dimensional table only","A database connection object","A plotting style object"],"a":0,"e":"The lesson defines Series as a one-dimensional labeled array capable of holding many data types."},{"id":"q10","t":"Series Basics","q":"Which comparison from the lesson is accurate for a Series?","c":["It is similar to a spreadsheet or SQL table column","It is always a full SQL table","It has no relation to dictionary-like labels","It must contain only integers"],"a":0,"e":"The lesson compares a Series to a column and also describes it as dictionary-like because values have labels."},{"id":"q11","t":"Dtype","q":"What does `s_nums = pd.Series([1,2,3,4,5]); s_nums.dtype` show in the lesson?","c":["int64","float64","object","category"],"a":0,"e":"A Series of integer literals is inferred as `int64` in the lesson."},{"id":"q12","t":"Dtype","q":"What dtype is shown for `pd.Series(['a','b','c','d','e'])`?","c":["object","str64","category","string_index"],"a":0,"e":"The lesson output for a Series of strings is `object`."},{"id":"q13","t":"Dtype","q":"What dtype is shown for `pd.Series([1, 'a', 3.0])`?","c":["object","float64","int64","bool"],"a":0,"e":"Mixed numeric and string values are represented as `object` in the example."},{"id":"q14","t":"Dtype","q":"What dtype is shown for `pd.Series([1, None, 3.0])`?","c":["float64","object","int64","category"],"a":0,"e":"The lesson shows `None` with numeric values being converted into a float Series."},{"id":"q15","t":"Dtype","q":"What dtype is shown for `pd.Series([1, pd.NA, 3.0])`?","c":["object","float64","int64","datetime64[ns]"],"a":0,"e":"The example with `pd.NA` prints dtype `object`."},{"id":"q16","t":"Attributes","q":"Which attribute returns the index labels of a Series?","c":["`.index`","`.values`","`.shape`","`.ndim`"],"a":0,"e":"`.index` returns the Series labels, such as `Index(['a','b','c','d','e'], dtype='object')`."},{"id":"q17","t":"Attributes","q":"Which attribute returns the Series values as a NumPy array in the lesson?","c":["`.values`","`.index`","`.name`","`.empty`"],"a":0,"e":"The lesson shows `s.values` returning `[1 2 3 4 5]` and its type as `numpy.ndarray`."},{"id":"q18","t":"Attributes","q":"For a five-element Series, what does `.shape` return in the lesson?","c":["`(5,)`","`(5, 1)`","`5`","`(1, 5)`"],"a":0,"e":"A Series is one-dimensional, so its shape is a one-item tuple like `(5,)`."},{"id":"q19","t":"Attributes","q":"What does `.ndim` return for a pandas Series in the lesson?","c":["1","0","2","The number of unique values"],"a":0,"e":"A Series is always one-dimensional, so `.ndim` returns 1."},{"id":"q20","t":"Attributes","q":"Which attribute returns True only when all values in the Series are unique?","c":["`.is_unique`","`.hasnans`","`.empty`","`.size`"],"a":0,"e":"`.is_unique` checks whether all Series elements are unique."},{"id":"q21","t":"Attributes","q":"What does `.hasnans` return for a Series containing `np.nan` or `pd.NA` in the lesson?","c":["True","False","None","The number of missing values"],"a":0,"e":"Both examples with `np.nan` and `pd.NA` print `True` for `.hasnans`."},{"id":"q22","t":"Attributes","q":"Which attribute is True for `pd.Series(dtype='float64')` with no data?","c":["`.empty`","`.hasnans`","`.is_unique`","`.values`"],"a":0,"e":"The empty Series example returns `True` for `.empty`."},{"id":"q23","t":"Name Attribute","q":"Before assigning it, what is the default `name` of the Series in the lesson?","c":["None","'My Series'","'Series'","0"],"a":0,"e":"The lesson prints `None` before setting `s.name = 'My Series'`."},{"id":"q24","t":"Name Attribute","q":"After `s.name = 'My Series'`, where is the name visible when printing the Series?","c":["In the final line before dtype","As a new first data element","As the index name for each label","Only in `s.values`"],"a":0,"e":"The printed Series includes `Name: My Series, dtype: int64`."},{"id":"q25","t":"Selection","q":"What is `.iloc[]` used for?","c":["Integer-position based indexing","Label-only slicing","Changing dtype safely","Creating categorical levels"],"a":0,"e":"The lesson defines `.iloc[]` as integer-location based indexing."},{"id":"q26","t":"Selection","q":"Given `s_index = pd.Series([10,20,30,40,50], index=['a','b','c','d','e'])`, what is `s_index.iloc[0]`?","c":["10","'a'","20","It raises KeyError"],"a":0,"e":"`.iloc[0]` accesses the first value by position, which is 10."},{"id":"q27","t":"Selection","q":"For the same labeled Series, what labels are returned by `s_index.iloc[1:3]`?","c":["b and c","a and b","b, c, and d","c only"],"a":0,"e":"Positional slicing excludes the stop position, so positions 1 and 2 are labels b and c."},{"id":"q28","t":"Selection","q":"What does `s_index.iloc[-1]` return in the lesson's five-element Series?","c":["50","10","The label 'e'","A one-row Series"],"a":0,"e":"Negative position `-1` selects the last value, which is 50."},{"id":"q29","t":"Selection","q":"How do you select labels `'a'`, `'c'`, and `'e'` using dictionary-style access in the lesson?","c":["`s_index[['a', 'c', 'e']]`","`s_index['a', 'c', 'e']`","`s_index.iloc['a', 'c', 'e']`","`s_index.get('a', 'c', 'e')`"],"a":0,"e":"Multiple labels are passed as a list inside the brackets."},{"id":"q30","t":"Selection","q":"What is special about label slicing such as `s_index['b':'e']` in the lesson?","c":["The ending label is included","The ending label is excluded","It always returns positions 1 through 3 only","It changes the original Series"],"a":0,"e":"The lesson notes that label-based ranges are inclusive, so `'e'` is included."},{"id":"q31","t":"Selection","q":"What does `s_index.get('z', 'Not Found')` return when `'z'` is not an index label?","c":["'Not Found'","None","KeyError","0"],"a":0,"e":"`.get()` returns the provided default value when the label is missing."},{"id":"q32","t":"Selection","q":"What does `s_index.get('z')` return without a default when `'z'` is missing?","c":["None","'Not Found'","KeyError","False"],"a":0,"e":"Without a default, `.get()` returns `None` for a missing label."},{"id":"q33","t":"Selection","q":"Why do `s_no_index.iloc[0]` and `s_no_index[0]` return the same value for a default-index Series?","c":["The default labels happen to match integer positions","`[]` always means position in pandas","`.iloc` uses labels when labels are integers","Both methods ignore the index"],"a":0,"e":"The lesson emphasizes that this is a coincidence because default labels start at 0."},{"id":"q34","t":"Selection","q":"What does pandas warn about when using an integer key like `s_index[0]` on a custom-index Series?","c":["Integer keys will be treated as labels in future versions","Integer keys will always be converted to strings","The Series will automatically sort itself","The index will be reset"],"a":0,"e":"The lesson shows a FutureWarning and recommends using `ser.iloc[pos]` for positional access."},{"id":"q35","t":"Selection","q":"What do `.head(n)` and `.tail(n)` return?","c":["The first n and last n elements","The smallest n and largest n values","The labels and values as separate arrays","Only scalar Python values"],"a":0,"e":"The lesson defines `.head(n)` as first n elements and `.tail(n)` as last n elements."},{"id":"q36","t":"Selection","q":"When does pandas Series `.item()` work according to the lesson?","c":["Only when the Series has exactly one element","Whenever an index argument is supplied","Only for object dtype Series","Only on a Series with default integer index"],"a":0,"e":"`.item()` extracts a native Python scalar only from a length-one Series."},{"id":"q37","t":"Updating Series","q":"Which statement updates the first element by position in the lesson?","c":["`s_new.iloc[0] = 100`","`s_new.index[0] = 100`","`s_new.get(0) = 100`","`s_new.dtype = 100`"],"a":0,"e":"`.iloc[0]` targets the first position for assignment."},{"id":"q38","t":"Updating Series","q":"For a labeled Series indexed `a` through `e`, what does `s_new_index['b':'d'] = [200, 300, 400]` update?","c":["Labels b, c, and d","Labels b and c only","Positions b through d are ignored","Only label d"],"a":0,"e":"Label slicing is inclusive, so b, c, and d are updated."},{"id":"q39","t":"Updating Series","q":"How does `s_update.update(pd.Series(data=[300, 500], index=[2, 4]))` match replacements?","c":["By index labels 2 and 4","By the order of values only","By dtype name","By Series length"],"a":0,"e":"The lesson shows values replacing the entries at indexes 2 and 4."},{"id":"q40","t":"Adding Series Elements","q":"What happens after `s_new[5] = 60` on a default-index Series with labels 0 through 4?","c":["A new element with index 5 is added","The value at position 4 is overwritten","The Series is reindexed from 1","A KeyError is raised"],"a":0,"e":"Assigning a new single label adds that element to the Series."},{"id":"q41","t":"Adding Series Elements","q":"What does the lesson say about assigning multiple new labels at once, such as `s_new[[7,8]] = [700,800]`?","c":["It raises an error","It silently appends both labels","It converts     function load(){try{const x=JSON.parse(localStorage.getItem(key())||"[]");return Array.isArray(x)?x:[]}catch{return[]}}function save(){localStorage.setItem(key(),JSON.stringify(S.history))}function stamp(){const d=new Date(),p=(n,w=2)=>String(n).padStart(w,"0"),base=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;if(!S.history.some(x=>x.time===base))return base;let v=`${base}.${p(d.getMilliseconds(),3)}`,n=2;while(S.history.some(x=>x.time===v))v=`${base}.${p(d.getMilliseconds(),3)}-${n++}`;return v}
    function esc(v){v=String(v);return/[",\r\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v}function csv(){return"\uFEFF"+["Name",...S.history.map(x=>x.time)].map(esc).join(",")+"\r\n"+[S.name,...S.history.map(x=>`${x.correct}/${x.total} (${pct(x.percent)}%) - ${x.label}`)].map(esc).join(",")+"\r\n"}function parseCsv(text){text=text.replace(/^\uFEFF/,"");const rows=[];let row=[],cell="",q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}else if(c==='"')q=true;else if(c===","){row.push(cell);cell=""}else if(c==="\n"){row.push(cell.replace(/\r$/,"") );rows.push(row);row=[];cell=""}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}if(q||rows.length!==2||rows[1][0]!==S.name||rows[0].length!==rows[1].length)throw Error(T.badCsv);return rows[0].slice(1).map((time,i)=>{const m=rows[1][i+1].match(/^(\d+)\/(\d+) \(([\d.]+)%\) - (.+)$/);if(!m)throw Error(T.badCsv);return{time,correct:+m[1],total:+m[2],percent:+m[3],label:m[4]}})}

    function draw(){const c=$("chart");if(!S.history.length)return;const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;const x=c.getContext("2d");x.scale(d,d);const w=r.width,h=r.height,p={l:38,r:15,t:15,b:30};x.font="12px system-ui";x.fillStyle="#718087";x.strokeStyle="#e4dfd5";[0,25,50,75,100].forEach(v=>{const y=p.t+(100-v)/100*(h-p.t-p.b);x.beginPath();x.moveTo(p.l,y);x.lineTo(w-p.r,y);x.stroke();x.fillText(v,7,y+4)});const pts=S.history.map((v,i)=>({x:S.history.length===1?(p.l+w-p.r)/2:p.l+i*(w-p.l-p.r)/(S.history.length-1),y:p.t+(100-v.percent)/100*(h-p.t-p.b)}));if(pts.length>1){x.beginPath();pts.forEach((v,i)=>i?x.lineTo(v.x,v.y):x.moveTo(v.x,v.y));x.strokeStyle="#087e78";x.lineWidth=3;x.stroke()}pts.forEach((v,i)=>{x.beginPath();x.arc(v.x,v.y,5,0,Math.PI*2);x.fillStyle=i===pts.length-1?"#e56b4d":"#087e78";x.fill()})}window.addEventListener("resize",()=>requestAnimationFrame(draw));
