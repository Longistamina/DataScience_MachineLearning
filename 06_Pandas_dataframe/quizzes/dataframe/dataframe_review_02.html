<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Self-contained lesson review quiz">
  <title>Lesson Review Quiz</title>
  <style>
    :root{--ink:#17232b;--muted:#63727b;--paper:#f7f4ed;--card:#fffdf8;--line:#ded9cd;--teal:#087e78;--dark:#055d59;--coral:#e56b4d;--gold:#f2b544;--good:#267a4b;--bad:#b23b3b;--shadow:0 18px 50px #182a2f1f;--r:22px}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 8% 5%,#f2b54447,transparent 25rem),radial-gradient(circle at 90% 15%,#087e7833,transparent 30rem),var(--paper);font:16px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{width:min(1120px,calc(100% - 32px));margin:auto;padding:28px 0 56px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px;font-weight:850}.mark{width:44px;height:44px;display:grid;place-items:center;color:#fff;background:var(--teal);border-radius:14px;box-shadow:0 8px 20px #087e783d}.brand small{display:block;color:var(--muted);font-weight:600;letter-spacing:.06em}.panel{background:#fffdf8eb;border:1px solid #ded9cde6;border-radius:var(--r);box-shadow:var(--shadow)}
    .login{min-height:560px;display:grid;grid-template-columns:1.05fr .95fr;overflow:hidden}.login-copy{padding:clamp(32px,6vw,72px);display:flex;flex-direction:column;justify-content:center}.eyebrow{color:var(--coral);font-weight:850;text-transform:uppercase;letter-spacing:.12em;font-size:.78rem}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(2.35rem,5vw,4.7rem);line-height:.98;letter-spacing:-.055em;margin:10px 0 22px}h1 span{color:var(--teal)}.lede{color:var(--muted);font-size:1.08rem}.pills{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 30px}.pill{padding:8px 12px;border-radius:999px;background:#eef4f1;color:var(--dark);font-weight:750;font-size:.88rem}.login-form{display:grid;gap:10px;max-width:480px}label{font-weight:800}input[type=text]{width:100%;padding:14px 16px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:13px;outline:0}input[type=text]:focus{border-color:var(--teal);box-shadow:0 0 0 4px #087e781f}.btn{border:0;border-radius:13px;padding:13px 18px;font-weight:850;color:#fff;background:var(--teal);transition:.16s}.btn:hover:not(:disabled){background:var(--dark);transform:translateY(-1px)}.btn:focus-visible,.option:focus-visible{outline:3px solid #f2b544cc;outline-offset:3px}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.secondary{color:var(--dark);background:#e9f3f0}.btn.ghost{color:var(--ink);background:transparent;border:1px solid var(--line)}.help{color:var(--muted);font-size:.84rem}
    .art{position:relative;overflow:hidden;min-height:430px;background:linear-gradient(145deg,var(--dark),#0c8b82 64%,#25a69a)}.code{position:absolute;width:min(400px,82%);padding:24px;color:#d7fff8;background:#0a2026d1;border:1px solid #ffffff26;border-radius:18px;box-shadow:0 26px 60px #0003;font:600 .9rem/1.8 ui-monospace,monospace}.code.one{top:14%;left:9%;transform:rotate(-3deg)}.code.two{right:7%;bottom:13%;transform:rotate(4deg)}.key{color:#ffce69}.call{color:#73e6d7}.note{color:#9eb8b8}.orb{position:absolute;border-radius:50%;background:#ffffff14}.orb.a{width:280px;height:280px;top:-100px;right:-70px}.orb.b{width:180px;height:180px;bottom:-60px;left:-50px}
    #app{display:none}.user{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:#dceee9;color:var(--dark);font-weight:900}.hero{padding:28px;margin-bottom:18px;background:linear-gradient(115deg,#073f3f,var(--teal));color:#fff;position:relative;overflow:hidden}.hero:after{content:"?";position:absolute;right:36px;top:-55px;font-weight:900;font-size:11rem;opacity:.08}.hero h2{margin-bottom:7px;font-size:clamp(1.65rem,3vw,2.4rem);letter-spacing:-.035em}.hero p{margin:0;color:#ccece7}.notice{margin-bottom:18px;padding:14px 16px;border-radius:12px;background:#eef7f5;border:1px solid #b8ddd6;color:var(--dark)}.notice.error{background:#ffeded;border-color:#efb0b0;color:#7f2828}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{padding:20px}.stat-label{color:var(--muted);font-weight:750;font-size:.88rem}.stat-value{font-size:clamp(1.65rem,3vw,2.35rem);line-height:1.15;margin-top:8px;font-weight:900}.stat-sub{color:var(--muted);font-size:.83rem;margin-top:6px}.best{background:linear-gradient(150deg,#fff8df,#fffdf8);border-color:#efdba1}.dash-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:16px}.chart-card,.history-card{padding:22px;min-width:0}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.section-head h3{margin:0;font-size:1.05rem}#chart{display:block;width:100%;height:230px}.empty{padding:34px 16px;text-align:center;color:var(--muted)}.history-wrap{max-height:270px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{padding:10px 8px;border-bottom:1px solid #ece7dc;text-align:left;white-space:nowrap}th{color:var(--muted);font-size:.76rem;text-transform:uppercase;letter-spacing:.06em}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0}.actions .spacer{flex:1}
    .quiz{display:none;padding:clamp(22px,5vw,46px)}.quiz.show,.result.show{display:block}.quiz-top{display:flex;justify-content:space-between;gap:14px;margin-bottom:12px}.qcount{font-weight:900;color:var(--dark)}.live{color:var(--muted);font-weight:750}.progress{height:8px;overflow:hidden;border-radius:99px;background:#e6e2d8;margin-bottom:30px}.progress div{height:100%;width:0;background:linear-gradient(90deg,var(--teal),#36ae9e)}.tag{display:inline-block;margin-bottom:12px;padding:5px 10px;border-radius:8px;background:#e9f3f0;color:var(--dark);font-size:.78rem;font-weight:850}.question{font-size:clamp(1.25rem,2.4vw,1.75rem);line-height:1.3;letter-spacing:-.025em;margin-bottom:16px}.hint-wrap{margin-bottom:18px}.hint{margin-top:10px;padding:12px 14px;border-left:4px solid var(--gold);border-radius:8px;background:#fff8df;color:#654b15}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{min-height:68px;display:flex;align-items:center;gap:12px;padding:14px 16px;color:var(--ink);text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px}.option:hover:not(:disabled){transform:translateY(-1px);border-color:var(--teal);background:#f4fbf9}.option:disabled{cursor:default;opacity:1}.option.correct{border-color:#57a878;background:#eaf7ee;color:#155e38}.option.wrong{border-color:#da7777;background:#fff0f0;color:#8f2929}.letter{flex:0 0 32px;height:32px;display:grid;place-items:center;border-radius:9px;background:#f0eee8;font-weight:900}.fill-form{grid-column:1/-1;display:flex;gap:10px;align-items:stretch}.fill-input{min-width:0;flex:1;padding:15px 16px;border:1.5px solid var(--line);border-radius:13px;outline:0;font:700 1rem/1.4 ui-monospace,monospace}.fill-input:focus{border-color:var(--teal);box-shadow:0 0 0 4px #087e781f}.fill-input.correct{border-color:#57a878;background:#eaf7ee}.fill-input.wrong{border-color:#da7777;background:#fff0f0}.feedback{display:none;margin-top:20px;padding:17px 18px;border-left:4px solid var(--teal);border-radius:10px;background:#eef7f5}.feedback.show{display:block}.feedback strong{display:block;margin-bottom:4px}.quiz-foot{display:flex;justify-content:flex-end;margin-top:22px}.result{display:none;padding:clamp(28px,6vw,60px);text-align:center}.result-emoji{font-size:4.6rem;line-height:1}.result h2{font-size:clamp(2rem,5vw,3.7rem);letter-spacing:-.045em;margin:14px 0 4px}.result-score,.save{color:var(--muted)}.record{display:none;width:fit-content;margin:18px auto 0;padding:9px 14px;border-radius:999px;background:#fff0c5;color:#765412;font-weight:900}.record.show{display:block}.save{margin:18px auto}.result-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.review{margin-top:30px;text-align:left}.review-item{padding:16px 0;border-top:1px solid var(--line)}.review-item p{margin:5px 0}.right{color:var(--good);font-weight:800}
    html[data-theme="winter"]{--ink:#14263d;--muted:#53687e;--paper:#edf6fb;--card:#fff;--line:#bfd3e2;--teal:#167d8d;--dark:#163c66;--coral:#a7354a;--gold:#d29a20;--good:#23704a;--bad:#a7354a;--shadow:0 18px 50px #163c661c}html[data-theme="winter"] body{background:linear-gradient(180deg,#e5f2f9 0,#f7fbfd 45%,#edf6fb 100%)}html[data-theme="winter"] .panel{background:#ffffffed;border-color:#bfd3e2}html[data-theme="winter"] .art{background:linear-gradient(145deg,#163c66,#167d8d 68%,#9ecbda)}html[data-theme="winter"] .orb{display:none}html[data-theme="winter"] .hero{background:linear-gradient(115deg,#163c66,#167d8d)}html[data-theme="winter"] .notice,html[data-theme="winter"] .feedback{background:#e7f4f7;border-color:#a9d1d8}html[data-theme="winter"] .hint{background:#fff7dc;color:#5b481c}html[data-theme="winter"] .best{background:#fff8e5;border-color:#e4c777}html[data-theme="winter"] th,html[data-theme="winter"] td{border-color:#d9e6ee}
    @media(max-width:820px){.login{grid-template-columns:1fr}.art{min-height:320px}.stats,.dash-grid,.options{grid-template-columns:1fr}}@media(max-width:520px){.shell{width:calc(100% - 20px);padding-top:16px}.brand small,.user>span:not(.avatar){display:none}.login-copy{padding:28px 22px}.hero,.stat,.chart-card,.history-card{padding:18px}.quiz-top{flex-direction:column}.fill-form{flex-direction:column}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand"><div class="mark">Q</div><div id="brandTitle">Lesson Quiz<small id="brandSub">REVIEW LAB</small></div></div><div class="user" id="user" hidden><span class="avatar" id="avatar">L</span><span id="userName"></span></div></header>
    <section class="panel login" id="login">
      <div class="login-copy"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="lede" id="subtitle"></p><div class="pills"><span class="pill" id="bankPill"></span><span class="pill" id="attemptPill"></span><span class="pill" id="storagePill"></span></div><form class="login-form" id="loginForm"><label for="name" id="nameLabel"></label><input id="name" type="text" autocomplete="name" maxlength="100" required><button class="btn" id="enter" type="submit"></button><div class="help" id="storageHelp"></div><div class="notice error" id="loginError" hidden></div></form></div>
      <div class="art" aria-hidden="true"><div class="orb a"></div><div class="orb b"></div><div class="code one"><span class="key">learn</span>.<span class="call">map</span>(idea =&gt; recall(idea))<br><span class="note">// practice makes progress</span></div><div class="code two"><span class="key">result</span> = <span class="call">challenge</span>(<span class="key">today</span>)</div></div>
    </section>
    <section id="app">
      <div class="panel hero"><h2 id="welcome"></h2><p id="encourage"></p></div><div class="notice" id="notice"></div>
      <div id="dashboard"><div class="stats"><article class="panel stat"><div class="stat-label" id="totalLabel"></div><div class="stat-value" id="total">0</div><div class="stat-sub" id="totalSub"></div></article><article class="panel stat"><div class="stat-label" id="latestLabel"></div><div class="stat-value" id="latest">—</div><div class="stat-sub" id="latestSub"></div></article><article class="panel stat best"><div class="stat-label" id="bestLabel"></div><div class="stat-value" id="best">—</div><div class="stat-sub" id="bestSub"></div></article></div>
        <div class="dash-grid"><article class="panel chart-card"><div class="section-head"><h3 id="trendLabel"></h3><span class="help">%</span></div><div class="empty" id="chartEmpty"></div><canvas id="chart"></canvas></article><article class="panel history-card"><div class="section-head"><h3 id="historyLabel"></h3><span class="help" id="historyCount"></span></div><div class="empty" id="historyEmpty"></div><div class="history-wrap" id="historyWrap" hidden><table><thead><tr><th id="timeHead"></th><th id="scoreHead"></th><th id="levelHead"></th></tr></thead><tbody id="historyBody"></tbody></table></div></article></div>
      </div>
      <div class="actions" id="mainActions"><button class="btn" id="start"></button><button class="btn secondary" id="importBtn"></button><button class="btn ghost" id="exportBtn"></button><input id="csvInput" type="file" accept=".csv,text/csv" hidden><div class="spacer"></div><button class="btn ghost" id="switchUser"></button></div>
      <section class="panel quiz" id="quiz" aria-live="polite"><div class="quiz-top"><div class="qcount" id="qcount"></div><div class="live" id="live"></div></div><div class="progress"><div id="bar"></div></div><span class="tag" id="topic"></span><h2 class="question" id="question"></h2><div class="hint-wrap" id="hintWrap"><button class="btn ghost" id="hintBtn" type="button"></button><div class="hint" id="hint" hidden></div></div><div class="options" id="options"></div><div class="feedback" id="feedback"><strong id="feedbackTitle"></strong><span id="feedbackText"></span></div><div class="quiz-foot"><button class="btn" id="next" disabled></button></div></section>
      <section class="panel result" id="result" aria-live="polite"><div class="result-emoji" id="resultEmoji"></div><h2 id="resultTitle"></h2><div class="result-score" id="resultScore"></div><div class="record" id="record"></div><div class="save" id="save"></div><div class="result-actions"><button class="btn" id="again"></button><button class="btn ghost" id="resultExport"></button><button class="btn ghost" id="back"></button></div><div class="review" id="review"></div></section>
    </section>
  </main>
  <script>
    const QUIZ={"meta":{"id":"pandas-dataframe-review-05-09","title":"Winter DataFrame Training Camp","subtitle":"50 beginner-friendly questions on column names, feature selection, dtypes, dropping, indexing, and squeeze. Each attempt draws 20 balanced questions.","attemptSize":20,"language":"en","theme":"winter","bankSize":50},"questions":[{"id":"q01","t":"05 · Rename columns","q":"Your health dataset has a column named `Life expectancy `. Which lesson pattern renames only that column without touching the others?","h":"Think small and surgical: old name on the left, new name on the right.","c":["df.rename(columns={\"Life expectancy \": \"life_expectancy\"})","df.add_prefix(\"life_\")","df.set_axis([\"life_expectancy\"], axis=1)","df.columns.map(str.lower)"],"a":0,"e":"`rename(columns={old: new})` targets selected labels. It is the calm, precise option when most column names are already fine."},{"id":"q02","t":"05 · Rename columns","q":"Which pattern cleans every column by trimming edges, lowercasing, and replacing runs of whitespace with underscores?","h":"This job needs a function applied to each column label.","c":["df.rename(columns=lambda col: re.sub(r\"\\s+\", \"_\", col.strip().lower()))","df.rename(columns={\" \": \"_\"})","df.add_suffix(\"_clean\")","df.drop(columns=\"spaces\")"],"a":0,"e":"The callable passed to `rename` receives each label. `strip()` trims the edges, `lower()` normalizes case, and `re.sub` handles one or many spaces. Three tiny chores, one tidy coat rack."},{"id":"q03","t":"05 · Rename columns","q":"What does `df_emp.add_prefix(\"pre_\")` do in the lesson?","h":"The values stay put; look at the labels above them.","c":["Adds `pre_` to every column name","Adds `pre_` to every cell value","Adds a new row named `pre_`","Changes only the first column name"],"a":0,"e":"`add_prefix` returns a DataFrame whose column labels all begin with `pre_`, such as `pre_id` and `pre_salary`. The underlying employee values are unchanged."},{"id":"q04","t":"05 · Rename columns","q":"In `df.set_axis(new_names, axis=1)`, what does `axis=1` identify?","h":"DataFrames have rows on one axis and columns on the other.","c":["Columns","Rows","Cell values","Data types"],"a":0,"e":"`axis=1` means the column axis, so the supplied labels become column names. `axis=0` is the row index. You are doing well: axes become less mysterious after a few reps."},{"id":"q05","t":"05 · Rename columns","q":"Before running `df_new_cols.columns = new_colnames`, why does the lesson first use `df_lifexp.copy()`?","h":"Imagine wanting a cleaned version while keeping the raw table nearby.","c":["To rename a separate DataFrame without changing the original object","To convert every column to text","To sort the rows","To remove duplicate columns"],"a":0,"e":"The copy creates a separate DataFrame for the direct column assignment. That lets the original remain available, which is useful when learning or comparing cleaning steps."},{"id":"q06","t":"05 · Rename columns","q":"Why does `[f\"col_{i+1}\" for i in range(df.shape[1])]` produce the right number of generated column names?","h":"`shape` reports two dimensions: rows first, columns second.","c":["`df.shape[1]` is the number of columns","`df.shape[1]` is the number of rows","`range` reads the existing column text","`i+1` counts the rows"],"a":0,"e":"`df.shape[1]` gives the column count, so the comprehension creates one label per column. `i+1` simply starts the visible numbering at 1 instead of 0."},{"id":"q07","t":"05 · Rename columns","q":"What is the role of `.pipe(lambda df: df.set_axis(...))` in the cleaning example?","h":"Picture a multi-step data-preparation conveyor belt.","c":["It keeps the rename operation inside a method chain","It turns the DataFrame into a Python list","It selects numeric columns only","It saves the DataFrame to a file"],"a":0,"e":"`pipe` passes the current DataFrame into the function, so the label-cleaning step can live neatly inside a chain. Same pandas work, smoother reading."},{"id":"q08","t":"05 · Rename columns","q":"You want every employee column to end in `_suf`. Which method matches the lesson?","h":"The method name says exactly where the text goes.","c":["df_emp.add_suffix(\"_suf\")","df_emp.add_prefix(\"_suf\")","df_emp.rename(index=\"_suf\")","df_emp.columns.strip(\"_suf\")"],"a":0,"e":"`add_suffix('_suf')` appends the suffix to every column label, producing names such as `id_suf` and `dept_suf`. Pleasantly literal API names are a gift."},{"id":"q09","t":"05 · Rename columns","type":"fill","q":"Fill the missing string method: `df.columns.str.___().str.replace(r\"\\s+\", \"_\", regex=True)`","h":"It removes whitespace at the beginning and end of a label.","answers":["strip"],"e":"`strip()` removes leading and trailing whitespace before the regex replaces internal whitespace. This prevents a sneaky leading underscore from appearing."},{"id":"q10","t":"05 · Rename columns","type":"fill","q":"Fill the missing DataFrame method: `df.___(columns={\"Adult Mortality\": \"adult_mortality\"})`","h":"The method accepts a `columns` dictionary.","answers":["rename"],"e":"`rename` accepts a mapping from old labels to new labels. It is the most readable pattern when you know exactly which columns need new names."},{"id":"q11","t":"06 · Select & reorder","q":"What column order does `df_emp[[\"salary\", \"id\", \"dept\"]]` return?","h":"Pandas follows the order inside the list, not the old order.","c":["salary, id, dept","id, salary, dept","dept, id, salary","All original columns"],"a":0,"e":"Double-bracket selection uses the exact listed order. This lets you select and reorder in one step, handy when arranging candidate features for inspection."},{"id":"q12","t":"06 · Select & reorder","q":"Which lesson expression is the `reindex` version of selecting `salary`, then `id`, then `dept`?","h":"The desired list belongs to the `columns` parameter.","c":["df_emp.reindex(columns=[\"salary\", \"id\", \"dept\"])","df_emp.reindex(index=[\"salary\", \"id\", \"dept\"])","df_emp.rename(columns=[\"salary\", \"id\", \"dept\"])","df_emp.select_dtypes(include=[\"salary\", \"id\", \"dept\"])"],"a":0,"e":"`reindex(columns=[...])` returns columns in the supplied order. In the lesson, it produces the same visible result as the double-bracket form."},{"id":"q13","t":"06 · Select & reorder","q":"Starting with five employee columns, what happens to unlisted columns when selecting `df_emp[[\"salary\", \"id\", \"dept\"]]`?","h":"Selection keeps what you name.","c":["They are omitted from the result","They move to the end","They become the row index","They are converted to missing values"],"a":0,"e":"Only the named columns appear in the selected DataFrame. `name` and `start_date` are not included in that result; the original DataFrame is still available."},{"id":"q14","t":"06 · Select & reorder","q":"In the lesson outputs, what happens to the employee rows after columns are reordered?","h":"The operation focuses on the horizontal labels.","c":["The row order stays the same","Rows are sorted by salary","Only the first three rows remain","Rows become columns"],"a":0,"e":"Both demonstrated methods rearrange columns while preserving the row order and values. The table gets a new horizontal layout, not a new employee ranking."},{"id":"q15","t":"06 · Select & reorder","q":"What type of pandas object is returned by `df_emp[[\"salary\"]]`?","h":"Count the square-bracket layers.","c":["DataFrame","Series","Python float","Index"],"a":0,"e":"A list of column names inside double brackets returns a DataFrame, even when the list has one name. One-column DataFrames are still DataFrames."},{"id":"q16","t":"06 · Select & reorder","q":"What does `df_emp.reindex(columns=[\"dept\", \"name\", \"salary\", \"id\", \"start_date\"])` place first?","h":"Read the first item of the requested list.","c":["dept","id","name","start_date"],"a":0,"e":"`dept` is first because `reindex(columns=...)` follows the requested sequence exactly. Pandas is obedient here, which is reassuring before coffee."},{"id":"q17","t":"06 · Select & reorder","q":"Which expression both selects three existing columns and puts `dept` before `name` and `salary`?","h":"Write the desired final order directly.","c":["df_emp[[\"dept\", \"name\", \"salary\"]]","df_emp[[\"name\", \"salary\", \"dept\"]]","df_emp.drop(columns=[\"dept\", \"name\", \"salary\"])","df_emp.select_dtypes(include=\"dept\")"],"a":0,"e":"The order in the list is the order in the result. This compact pattern is excellent when the desired columns are already known."},{"id":"q18","t":"06 · Select & reorder","q":"Which pair of techniques is explicitly taught for selecting and reordering columns?","h":"One uses brackets; the other uses a method with `columns=`.","c":["Double-bracket selection and `reindex(columns=...)`","`at` and `iat`","`add_prefix` and `add_suffix`","`head` and `tail`"],"a":0,"e":"Lesson 06 demonstrates `df[[...]]` and `df.reindex(columns=[...])`. Both make the target order visible in code, reducing the mental juggling act."},{"id":"q19","t":"06 · Select & reorder","type":"fill","q":"Fill the method name: `df_emp.___(columns=[\"salary\", \"id\", \"dept\"])`","h":"Its name begins with `re` and rebuilds the requested axis order.","answers":["reindex"],"e":"`reindex` is the method used in the lesson. With `columns=`, it selects and arranges the column axis."},{"id":"q20","t":"06 · Select & reorder","type":"fill","q":"Fill the parameter name: `df_emp.reindex(___=[\"dept\", \"name\", \"salary\"])`","h":"You are changing the horizontal labels, not the row index.","answers":["columns"],"e":"The `columns` parameter tells `reindex` to work on the column axis. Small keyword, big clarity."},{"id":"q21","t":"07 · Select by dtype","q":"With the lesson's employee DataFrame, which columns are returned by `select_dtypes(include=\"number\")`?","h":"Look for the integer ID and floating salary.","c":["id and salary","name and comments","start_date only","dept and raise"],"a":0,"e":"`id` is `int64` and `salary` is `float64`, so both are numeric. This is a quick first pass when gathering numeric candidate features."},{"id":"q22","t":"07 · Select by dtype","q":"Which columns are selected by `include=\"object\"` in the prepared employee example?","h":"These are the ordinary text columns, not the categorical one.","c":["name and comments","name and dept","salary and id","start_date and raise"],"a":0,"e":"`name` and `comments` are `object`. `dept` was explicitly loaded as `category`, so it is not part of the object selection."},{"id":"q23","t":"07 · Select by dtype","q":"Which column is returned by `select_dtypes(include=\"category\")`?","h":"The CSV loader assigned one column the category dtype.","c":["dept","name","salary","comments"],"a":0,"e":"The lesson loads `dept` with `dtype={'dept': 'category'}`, so category selection returns that column."},{"id":"q24","t":"07 · Select by dtype","q":"Why does `select_dtypes(include=\"datetime\")` return `start_date` in the lesson?","h":"Check how the CSV was read.","c":["`start_date` was parsed with `parse_dates`","Its name contains the word date","All object columns are automatically dates","It contains hyphens"],"a":0,"e":"`parse_dates=['start_date']` converts the column to a datetime dtype during import. Pandas selects by actual dtype, not by a hopeful column name."},{"id":"q25","t":"07 · Select by dtype","q":"Which column appears for `select_dtypes(include=\"bool\")`?","h":"It contains alternating `True` and `False` values.","c":["raise","salary","dept","comments"],"a":0,"e":"`raise` was created from Boolean values, so its dtype is `bool`. The selector returns it and leaves other dtypes out."},{"id":"q26","t":"07 · Select by dtype","q":"What does `select_dtypes(include=[\"number\", \"datetime\"])` return in the lesson?","h":"Combine the two numeric columns with the parsed date column.","c":["id, salary, and start_date","name, comments, and dept","salary and raise only","All columns"],"a":0,"e":"The include list accepts multiple dtype groups, yielding numeric `id` and `salary` plus datetime `start_date`. One call, three compatible columns."},{"id":"q27","t":"07 · Select by dtype","q":"Which columns remain after `select_dtypes(exclude=[\"object\", \"category\"])`?","h":"Remove text-like object columns and the categorical department.","c":["id, salary, start_date, and raise","name, comments, and dept","id and salary only","start_date only"],"a":0,"e":"Excluding object and category leaves the numeric, datetime, and Boolean columns: `id`, `salary`, `start_date`, and `raise`."},{"id":"q28","t":"07 · Select by dtype","q":"What remains after `select_dtypes(include=\"number\", exclude=\"int64\")` in the lesson?","h":"Start with `id` and `salary`, then remove the integer one.","c":["salary","id","salary and id","No columns"],"a":0,"e":"The numeric set is `id` plus `salary`; excluding `int64` removes `id`, leaving the floating-point `salary` column."},{"id":"q29","t":"07 · Select by dtype","type":"fill","q":"Fill the method name: `df_emp.___(include=[\"number\", \"datetime\"])`","h":"The method selects columns according to their dtype.","answers":["select_dtypes"],"e":"`select_dtypes` filters columns by actual pandas dtypes. At least one of `include` or `exclude` must be supplied."},{"id":"q30","t":"07 · Select by dtype","type":"fill","q":"Fill the dtype selector used for all numeric columns: `df_emp.select_dtypes(include=\"___\")`","h":"It is a broad family name, not `int64` or `float64`.","answers":["number"],"e":"`'number'` selects numeric dtype families, which includes both the integer `id` and floating `salary` in this lesson."},{"id":"q31","t":"08 · Drop columns","q":"Which expression most directly drops `id` and `start_date` by naming the column axis?","h":"The clearest keyword literally says `columns`.","c":["df_emp.drop(columns=[\"id\", \"start_date\"], inplace=False)","df_emp.drop(index=[\"id\", \"start_date\"])","df_emp.reindex(columns=[\"id\", \"start_date\"])","df_emp.rename(columns=[\"id\", \"start_date\"])"],"a":0,"e":"`drop(columns=[...])` directly states that labels should be removed from the column axis. Clear code saves future-you a small detective story."},{"id":"q32","t":"08 · Drop columns","q":"Which lesson expression drops `start_date` and `dept` using `labels` plus an axis number?","h":"For columns, the axis number is 1.","c":["df_emp.drop(labels=[\"start_date\", \"dept\"], axis=1, inplace=False)","df_emp.drop(labels=[\"start_date\", \"dept\"], axis=0, inplace=False)","df_emp.drop(columns=1)","df_emp.drop(index=[\"start_date\", \"dept\"])"],"a":0,"e":"With the generic `labels` argument, `axis=1` tells pandas those labels are columns. `axis=0` would point to rows instead."},{"id":"q33","t":"08 · Drop columns","q":"What does `inplace=False` mean in the lesson's `drop` examples?","h":"The result is assigned to `df_dropped`.","c":["Return a new DataFrame and leave `df_emp` unchanged","Modify `df_emp` and return nothing","Delete the CSV file","Temporarily hide columns only while printing"],"a":0,"e":"With `inplace=False`, `drop` returns a new DataFrame. The original `df_emp` remains unchanged, giving you a safe checkpoint while learning."},{"id":"q34","t":"08 · Drop columns","q":"After dropping `start_date` and `dept`, which columns remain?","h":"Begin with `id`, `name`, `salary`, `start_date`, `dept`.","c":["id, name, salary","name, salary, dept","id, start_date, dept","salary only"],"a":0,"e":"Removing `start_date` and `dept` leaves `id`, `name`, and `salary`, exactly as shown in the lesson output."},{"id":"q35","t":"08 · Drop columns","q":"After `df_emp.drop(columns=[\"id\", \"start_date\"], inplace=False)`, which columns remain?","h":"Cross out the two named labels from the original five.","c":["name, salary, dept","id, name, salary","salary and start_date","dept only"],"a":0,"e":"The result contains `name`, `salary`, and `dept`. The row data stays aligned; only the two requested columns are removed."},{"id":"q36","t":"08 · Drop columns","q":"In `.drop(labels=..., axis=1)`, what does `axis=1` protect you from accidentally targeting?","h":"The other axis contains observations.","c":["Rows","Column names","Data types","Cell values"],"a":0,"e":"`axis=1` explicitly directs `drop` to columns rather than rows. When possible, `columns=...` can make that intention even easier to read."},{"id":"q37","t":"08 · Drop columns","q":"Which two drop styles are presented as alternatives in lesson 08?","h":"One uses `labels` with an axis; one names the axis directly.","c":["`drop(labels=..., axis=1)` and `drop(columns=...)`","`drop(index=...)` and `squeeze()`","`rename()` and `reindex()`","`loc` and `iloc`"],"a":0,"e":"The lesson teaches the generic `labels` plus `axis=1` form and the explicit `columns=` form. Both remove columns when used as shown."},{"id":"q38","t":"08 · Drop columns","q":"In the lesson, how are multiple column labels supplied to `drop`?","h":"Look at the punctuation around the names.","c":["As a Python list of strings","As a single comma-separated string","As integer row positions","As a dtype selector"],"a":0,"e":"Multiple labels are passed as a list, such as `['id', 'start_date']`. Each string is one exact column label."},{"id":"q39","t":"08 · Drop columns","type":"fill","q":"Fill the method name: `df_emp.___(columns=[\"id\", \"start_date\"], inplace=False)`","h":"This method removes labels from an axis.","answers":["drop"],"e":"`drop` removes the requested columns and, with `inplace=False`, returns the reduced DataFrame."},{"id":"q40","t":"08 · Drop columns","type":"fill","q":"Fill the Boolean value that keeps the original object unchanged: `df_emp.drop(columns=\"id\", inplace=___)`","h":"You want a returned copy, not an in-place mutation.","answers":["False"],"e":"`inplace=False` returns a new DataFrame rather than modifying the original. The checker ignores letter case, so the important idea is the Boolean value."},{"id":"q41","t":"09 · Indexing & squeeze","q":"What does `df_emp[\"name\"]` return?","h":"Single brackets plus one column label have a special return type.","c":["A Series","A one-column DataFrame","A scalar string","A row Index"],"a":0,"e":"Selecting one column with a single string returns a Series. This shape distinction matters when later code expects one-dimensional input."},{"id":"q42","t":"09 · Indexing & squeeze","q":"What does `df_emp[[\"name\", \"salary\"]]` return?","h":"A list of column labels asks for a table-shaped result.","c":["A DataFrame","A Series","A tuple","A scalar"],"a":0,"e":"Double brackets contain a list, so pandas returns a DataFrame with the requested columns. The two-dimensional structure is preserved."},{"id":"q43","t":"09 · Indexing & squeeze","q":"When is attribute-style access such as `df_emp.dept` supported by the lesson?","h":"Ask whether the column name could also be a normal Python variable name.","c":["When the column name is a valid Python identifier","For every possible column name","Only for numeric columns","Only after `set_index`"],"a":0,"e":"Attribute style needs a valid Python identifier: no spaces, no leading number, and similar rules. Bracket access is the sturdier general habit."},{"id":"q44","t":"09 · Indexing & squeeze","q":"Which original row positions are returned by `df_emp[2:5]`?","h":"Ordinary positional slices include the start and exclude the stop.","c":["2, 3, and 4","2, 3, 4, and 5","3, 4, and 5","Only 2 and 5"],"a":0,"e":"The slice starts at position 2 and stops before position 5, so positions 2, 3, and 4 are returned. The stop sign is visible but not invited inside."},{"id":"q45","t":"09 · Indexing & squeeze","q":"How does `df_emp.loc[2:5]` differ from `df_emp.iloc[2:5]` in the lesson's default index?","h":"One label slice includes its ending label; the position slice does not.","c":["`loc` includes label 5; `iloc` excludes position 5","`iloc` includes 5; `loc` excludes 5","Both exclude 5","Both always select exactly two rows"],"a":0,"e":"`loc` is label-based and its label slice includes the ending label. `iloc` is position-based and follows Python's stop-exclusive slicing rule."},{"id":"q46","t":"09 · Indexing & squeeze","q":"Which pairing correctly describes scalar access?","h":"The letter `i` points toward integer position.","c":["`at` uses labels; `iat` uses integer positions","`at` uses positions; `iat` uses labels","Both always return multiple rows","Both select columns by dtype"],"a":0,"e":"Use `at[row_label, column_label]` for one label-addressed value and `iat[row_position, column_position]` for one position-addressed value."},{"id":"q47","t":"09 · Indexing & squeeze","q":"Which expression selects only IT employees and returns just `name` and `salary`?","h":"The condition belongs in the row slot, before the comma.","c":["df_emp.loc[df_emp[\"dept\"] == \"IT\", [\"name\", \"salary\"]]","df_emp.iloc[df_emp[\"dept\"] == \"IT\", [\"name\", \"salary\"]]","df_emp.at[\"IT\", [\"name\", \"salary\"]]","df_emp.select_dtypes(include=\"IT\")"],"a":0,"e":"`loc` accepts a Boolean condition for rows and label names for columns. Read it as: rows where department is IT, columns name and salary."},{"id":"q48","t":"09 · Indexing & squeeze","q":"What is the result type of `df_emp[[\"name\"]].squeeze()` in the lesson?","h":"The input is a one-column DataFrame, and squeeze removes a size-one dimension.","c":["Series","DataFrame","Python list","Scalar string"],"a":0,"e":"`df_emp[['name']]` is a one-column DataFrame; `squeeze()` converts that size-one dimension to a Series. It is a shape change, not a value change."},{"id":"q49","t":"09 · Indexing & squeeze","type":"fill","q":"Fill the label-based indexer: `df_emp.___[df_emp[\"salary\"] > 700, [\"name\", \"salary\"]]`","h":"It accepts a Boolean row condition and column labels.","answers":["loc"],"e":"`loc` handles label-based column selection and Boolean row filtering in one readable expression."},{"id":"q50","t":"09 · Indexing & squeeze","type":"fill","q":"Fill the integer-position indexer: `df_emp.___[:, [1, 4]]`","h":"The selected columns are specified by positions 1 and 4.","answers":["iloc"],"e":"`iloc` selects by integer position. The colon means all rows, while `[1, 4]` picks the second and fifth columns by position."}]};

    function load(){try{const x=JSON.parse(localStorage.getItem(key())||"[]");return Array.isArray(x)?x:[]}catch{return[]}}function save(){localStorage.setItem(key(),JSON.stringify(S.history))}function stamp(){const d=new Date(),p=(n,w=2)=>String(n).padStart(w,"0"),base=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;if(!S.history.some(x=>x.time===base))return base;let v=`${base}.${p(d.getMilliseconds(),3)}`,n=2;while(S.history.some(x=>x.time===v))v=`${base}.${p(d.getMilliseconds(),3)}-${n++}`;return v}
    function esc(v){v=String(v);return/[",\r\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v}function csv(){return"\uFEFF"+["Name",...S.history.map(x=>x.time)].map(esc).join(",")+"\r\n"+[S.name,...S.history.map(x=>`${x.correct}/${x.total} (${pct(x.percent)}%) - ${x.label}`)].map(esc).join(",")+"\r\n"}function parseCsv(text){text=text.replace(/^\uFEFF/,"");const rows=[];let row=[],cell="",q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}else if(c==='"')q=true;else if(c===","){row.push(cell);cell=""}else if(c==="\n"){row.push(cell.replace(/\r$/,"") );rows.push(row);row=[];cell=""}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}if(q||rows.length!==2||rows[1][0]!==S.name||rows[0].length!==rows[1].length)throw Error(T.badCsv);return rows[0].slice(1).map((time,i)=>{const m=rows[1][i+1].match(/^(\d+)\/(\d+) \(([\d.]+)%\) - (.+)$/);if(!m)throw Error(T.badCsv);return{time,correct:+m[1],total:+m[2],percent:+m[3],label:m[4]}})}
    $("loginForm").addEventListener("submit",e=>{e.preventDefault();S.name=$("name").value.trim();if(!S.name)return;S.history=load();$("login").style.display="none";$("app").style.display="block";$("user").hidden=false;$("userName").textContent=S.name;$("avatar").textContent=S.name[0].toUpperCase();$("welcome").textContent=T.welcome(S.name);$("encourage").textContent=T.encourage;$("notice").textContent=T.notice;renderDash()});$("switchUser").onclick=()=>location.reload();
    function renderDash(){const h=S.history;$("total").textContent=h.length;$("historyCount").textContent=`${h.length}`;if(!h.length){$("latest").textContent=$("best").textContent="—";$("latestSub").textContent=T.noData;$("bestSub").textContent=T.firstMilestone;$("chart").style.display="none";$("chartEmpty").style.display="block";$("historyWrap").hidden=true;$("historyEmpty").style.display="block";return}const last=h.at(-1),best=h.reduce((a,b)=>b.percent>a.percent?b:a);$("latest").textContent=`${last.correct}/${last.total}`;$("latestSub").textContent=`${pct(last.percent)}% · ${last.label}`;$("best").textContent=`${best.correct}/${best.total}`;$("bestSub").textContent=`${pct(best.percent)}% · ${best.label}`;$("historyBody").replaceChildren(...[...h].reverse().map(x=>{const tr=document.createElement("tr");[x.time,`${x.correct}/${x.total} · ${pct(x.percent)}%`,x.label].forEach(v=>{const td=document.createElement("td");td.textContent=v;tr.append(td)});return tr}));$("chartEmpty").style.display="none";$("chart").style.display="block";$("historyEmpty").style.display="none";$("historyWrap").hidden=false;requestAnimationFrame(draw)}
    function draw(){const c=$("chart");if(!S.history.length)return;const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;const x=c.getContext("2d");x.scale(d,d);const w=r.width,h=r.height,p={l:38,r:15,t:15,b:30};x.font="12px system-ui";x.fillStyle="#718087";x.strokeStyle="#e4dfd5";[0,25,50,75,100].forEach(v=>{const y=p.t+(100-v)/100*(h-p.t-p.b);x.beginPath();x.moveTo(p.l,y);x.lineTo(w-p.r,y);x.stroke();x.fillText(v,7,y+4)});const pts=S.history.map((v,i)=>({x:S.history.length===1?(p.l+w-p.r)/2:p.l+i*(w-p.l-p.r)/(S.history.length-1),y:p.t+(100-v.percent)/100*(h-p.t-p.b)}));if(pts.length>1){x.beginPath();pts.forEach((v,i)=>i?x.lineTo(v.x,v.y):x.moveTo(v.x,v.y));x.strokeStyle="#087e78";x.lineWidth=3;x.stroke()}pts.forEach((v,i)=>{x.beginPath();x.arc(v.x,v.y,5,0,Math.PI*2);x.fillStyle=i===pts.length-1?"#e56b4d":"#087e78";x.fill()})}window.addEventListener("resize",()=>requestAnimationFrame(draw));
    function select(){const groups=[...new Set(QUIZ.questions.map(q=>q.t))].map(t=>shuffle(QUIZ.questions.filter(q=>q.t===t))),out=[];while(out.length<QUIZ.meta.attemptSize){let added=false;for(const g of shuffle(groups)){if(g.length&&out.length<QUIZ.meta.attemptSize){const q=g.pop(),opts=q.type==="fill"?null:shuffle(q.c.map((text,i)=>({text,ok:i===q.a})));out.push({...q,opts});added=true}}if(!added)break}return shuffle(out)}
    function start(){S.quiz=select();S.index=S.correct=0;S.answers=[];$("dashboard").style.display="none";$("mainActions").style.display="none";$("result").classList.remove("show");$("quiz").classList.add("show");renderQ();scrollTo({top:0})}$("start").onclick=$("again").onclick=start;
    function renderQ(){const q=S.quiz[S.index];S.locked=false;$("qcount").textContent=T.question(S.index+1,S.quiz.length);$("live").textContent=T.correct(S.correct);$("bar").style.width=`${S.index/S.quiz.length*100}%`;$("topic").textContent=q.t;$("question").textContent=q.q;$("hintWrap").hidden=!q.h;$("hint").hidden=true;$("hint").textContent=q.h||"";$("hintBtn").textContent=T.hint;$("feedback").classList.remove("show");$("next").disabled=true;$("next").textContent=S.index===S.quiz.length-1?T.results:T.next;if(q.type==="fill"){const form=document.createElement("form"),input=document.createElement("input"),button=document.createElement("button");form.className="fill-form";input.className="fill-input";input.type="text";input.placeholder=T.fillPh;input.autocomplete="off";input.required=true;button.className="btn";button.type="submit";button.textContent=T.check;form.onsubmit=e=>{e.preventDefault();answerFill(input.value,input,button)};form.append(input,button);$("options").replaceChildren(form);requestAnimationFrame(()=>input.focus())}else $("options").replaceChildren(...q.opts.map((o,i)=>{const b=document.createElement("button");b.className="option";b.type="button";b.dataset.ok=o.ok;b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span>`;b.append(document.createTextNode(o.text));b.onclick=()=>answer(o,b);return b}))}$("hintBtn").onclick=()=>{const h=$("hint");h.hidden=!h.hidden;$("hintBtn").textContent=h.hidden?T.hint:T.hideHint};
    function showFeedback(ok,q,picked,correct){if(ok)S.correct++;S.answers.push({q:q.q,picked,answer:correct,e:q.e,ok});$("live").textContent=T.correct(S.correct);$("feedbackTitle").textContent=ok?T.yes:T.no;$("feedbackText").textContent=q.e;$("feedback").classList.add("show");$("next").disabled=false;$("next").focus()}
    function answer(o,chosen){if(S.locked)return;S.locked=true;const q=S.quiz[S.index];[...$("options").children].forEach(b=>{b.disabled=true;if(b.dataset.ok==="true")b.classList.add("correct")});if(!o.ok)chosen.classList.add("wrong");showFeedback(o.ok,q,o.text,q.c[q.a])}
    function answerFill(value,input,button){if(S.locked)return;const picked=value.trim();if(!picked){input.focus();return}S.locked=true;const clean=v=>String(v).trim().replace(/^`|`$/g,"").replace(/\s+/g," ").toLocaleLowerCase(),q=S.quiz[S.index],ok=q.answers.some(a=>clean(a)===clean(picked));input.disabled=button.disabled=true;input.classList.add(ok?"correct":"wrong");showFeedback(ok,q,picked,q.answers[0])}$("next").onclick=()=>{if(!S.locked)return;if(++S.index<S.quiz.length)renderQ();else finish()};
    function finish(){const percent=S.correct/S.quiz.length*100,l=level(percent),old=S.history.length?Math.max(...S.history.map(x=>x.percent)):-1;S.history.push({time:stamp(),correct:S.correct,total:S.quiz.length,percent,label:`${l.emoji} ${l.title}`});try{save();$("save").textContent=T.saved}catch{$("save").textContent=T.storageHelp}$("quiz").classList.remove("show");$("result").classList.add("show");$("resultEmoji").textContent=l.emoji;$("resultTitle").textContent=l.title;$("resultScore").textContent=T.result(S.correct,S.quiz.length,pct(percent));$("record").textContent=T.record;$("record").classList.toggle("show",percent>=old);const wrong=S.answers.filter(x=>!x.ok);$("review").replaceChildren();const h=document.createElement("h3");h.textContent=wrong.length?T.review(wrong.length):T.perfect;$("review").append(h);wrong.forEach((x,i)=>{const d=document.createElement("div");d.className="review-item";const q=document.createElement("strong"),p=document.createElement("p"),a=document.createElement("p"),e=document.createElement("p");q.textContent=`${i+1}. ${x.q}`;p.textContent=`${T.picked}: ${x.picked}`;a.textContent=`${T.answer}: ${x.answer}`;a.className="right";e.textContent=x.e;d.append(q,p,a,e);$("review").append(d)});scrollTo({top:0})}
    $("back").onclick=()=>{$("result").classList.remove("show");$("dashboard").style.display="block";$("mainActions").style.display="flex";renderDash();scrollTo({top:0})};function download(){if(!S.history.length){$("notice").textContent=T.noExport;return}const u=URL.createObjectURL(new Blob([csv()],{type:"text/csv;charset=utf-8"})),a=document.createElement("a");a.href=u;a.download=`${S.name.replace(/[<>:"/\\|?*]/g,"_")}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$("exportBtn").onclick=$("resultExport").onclick=download;$("importBtn").onclick=()=>$("csvInput").click();$("csvInput").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;try{const imported=parseCsv(await f.text()),m=new Map(S.history.map(x=>[x.time,x]));imported.forEach(x=>m.set(x.time,x));S.history=[...m.values()].sort((a,b)=>a.time.localeCompare(b.time));save();renderDash();$("notice").textContent=T.imported(imported.length,f.name);$("notice").className="notice"}catch(err){$("notice").textContent=err.message;$("notice").className="notice error"}};
  </script>
