  <style>

    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 8% 5%,#f2b54447,transparent 25rem),radial-gradient(circle at 90% 15%,#087e7833,transparent 30rem),var(--paper);font:16px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{width:min(1120px,calc(100% - 32px));margin:auto;padding:28px 0 56px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px;font-weight:850}.mark{width:44px;height:44px;display:grid;place-items:center;color:#fff;background:var(--teal);border-radius:14px;box-shadow:0 8px 20px #087e783d}.brand small{display:block;color:var(--muted);font-weight:600;letter-spacing:.06em}.panel{background:#fffdf8eb;border:1px solid #ded9cde6;border-radius:var(--r);box-shadow:var(--shadow)}

    .art{position:relative;overflow:hidden;min-height:430px;background:linear-gradient(145deg,var(--dark),#0c8b82 64%,#25a69a)}.code{position:absolute;width:min(400px,82%);padding:24px;color:#d7fff8;background:#0a2026d1;border:1px solid #ffffff26;border-radius:18px;box-shadow:0 26px 60px #0003;font:600 .9rem/1.8 ui-monospace,monospace}.code.one{top:14%;left:9%;transform:rotate(-3deg)}.code.two{right:7%;bottom:13%;transform:rotate(4deg)}.key{color:#ffce69}.call{color:#73e6d7}.note{color:#9eb8b8}.orb{position:absolute;border-radius:50%;background:#ffffff14}.orb.a{width:280px;height:280px;top:-100px;right:-70px}.orb.b{width:180px;height:180px;bottom:-60px;left:-50px}
    #app{display:none}.user{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:#dceee9;color:var(--dark);font-weight:900}.hero{padding:28px;margin-bottom:18px;background:linear-gradient(115deg,#073f3f,var(--teal));color:#fff;position:relative;overflow:hidden}.hero:after{content:"?";position:absolute;right:36px;top:-55px;font-weight:900;font-size:11rem;opacity:.08}.hero h2{margin-bottom:7px;font-size:clamp(1.65rem,3vw,2.4rem);letter-spacing:-.035em}.hero p{margin:0;color:#ccece7}.notice{margin-bottom:18px;padding:14px 16px;border-radius:12px;background:#eef7f5;border:1px solid #b8ddd6;color:var(--dark)}.notice.error{background:#ffeded;border-color:#efb0b0;color:#7f2828}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{padding:20px}.stat-label{color:var(--muted);font-weight:750;font-size:.88rem}.stat-value{font-size:clamp(1.65rem,3vw,2.35rem);line-height:1.15;margin-top:8px;font-weight:900}.stat-sub{color:var(--muted);font-size:.83rem;margin-top:6px}.best{background:linear-gradient(150deg,#fff8df,#fffdf8);border-color:#efdba1}.dash-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:16px}.chart-card,.history-card{padding:22px;min-width:0}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.section-head h3{margin:0;font-size:1.05rem}#chart{display:block;width:100%;height:230px}.empty{padding:34px 16px;text-align:center;color:var(--muted)}.history-wrap{max-height:270px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{padding:10px 8px;border-bottom:1px solid #ece7dc;text-align:left;white-space:nowrap}th{color:var(--muted);font-size:.76rem;text-transform:uppercase;letter-spacing:.06em}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0}.actions .spacer{flex:1}
    .quiz{display:none;padding:clamp(22px,5vw,46px)}.quiz.show,.result.show{display:block}.quiz-top{display:flex;justify-content:space-between;gap:14px;margin-bottom:12px}.qcount{font-weight:900;color:var(--dark)}.live{color:var(--muted);font-weight:750}.progress{height:8px;overflow:hidden;border-radius:99px;background:#e6e2d8;margin-bottom:30px}.progress div{height:100%;width:0;background:linear-gradient(90deg,var(--teal),#36ae9e)}.tag{display:inline-block;margin-bottom:12px;padding:5px 10px;border-radius:8px;background:#e9f3f0;color:var(--dark);font-size:.78rem;font-weight:850}.question{font-size:clamp(1.25rem,2.4vw,1.75rem);line-height:1.3;letter-spacing:-.025em;margin-bottom:16px}.hint-wrap{margin-bottom:18px}.hint{margin-top:10px;padding:12px 14px;border-left:4px solid var(--gold);border-radius:8px;background:#fff8df;color:#654b15}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{min-height:68px;display:flex;align-items:center;gap:12px;padding:14px 16px;color:var(--ink);text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px}.option:hover:not(:disabled){transform:translateY(-1px);border-color:var(--teal);background:#f4fbf9}.option:disabled{cursor:default;opacity:1}.option.correct{border-color:#57a878;background:#eaf7ee;color:#155e38}.option.wrong{border-color:#da7777;background:#fff0f0;color:#8f2929}.letter{flex:0 0 32px;height:32px;display:grid;place-items:center;border-radius:9px;background:#f0eee8;font-weight:900}.fill-form{grid-column:1/-1;display:flex;gap:10px;align-items:stretch}.fill-input{min-width:0;flex:1;padding:15px 16px;border:1.5px solid var(--line);border-radius:13px;outline:0;font:700 1rem/1.4 ui-monospace,monospace}.fill-input:focus{border-color:var(--teal);box-shadow:0 0 0 4px #087e781f}.fill-input.correct{border-color:#57a878;background:#eaf7ee}.fill-input.wrong{border-color:#da7777;background:#fff0f0}.feedback{display:none;margin-top:20px;padding:17px 18px;border-left:4px solid var(--teal);border-radius:10px;background:#eef7f5}.feedback.show{display:block}.feedback strong{display:block;margin-bottom:4px}.quiz-foot{display:flex;justify-content:flex-end;margin-top:22px}.result{display:none;padding:clamp(28px,6vw,60px);text-align:center}.result-emoji{font-size:4.6rem;line-height:1}.result h2{font-size:clamp(2rem,5vw,3.7rem);letter-spacing:-.045em;margin:14px 0 4px}.result-score,.save{color:var(--muted)}.record{display:none;width:fit-content;margin:18px auto 0;padding:9px 14px;border-radius:999px;background:#fff0c5;color:#765412;font-weight:900}.record.show{display:block}.save{margin:18px auto}.result-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.review{margin-top:30px;text-align:left}.review-item{padding:16px 0;border-top:1px solid var(--line)}.review-item p{margin:5px 0}.right{color:var(--good);font-weight:800}
    html[data-theme="purple"]{--ink:#2a2140;--muted:#6a5d7b;--paper:#f5f0fa;--card:#fff;--line:#cdbce0;--teal:#7650a3;--dark:#513174;--coral:#b13d68;--gold:#d39a2e;--good:#2d7253;--bad:#a7354a;--shadow:0 18px 50px #51317420;--bg-a:#eee6f7;--bg-b:#fbf9fd;--soft:#f0e9f8;--soft-line:#d6c3e8;--art:#a681c3;--hint-bg:#fff6d9;--best-bg:#fff5dd;--best-line:#dfc06d}
    html[data-theme="green"]{--ink:#17352f;--muted:#587269;--paper:#eef7f2;--card:#fff;--line:#b8d3c8;--teal:#3a8068;--dark:#245b49;--coral:#a63f59;--gold:#c99825;--good:#216b49;--bad:#a63f59;--shadow:0 18px 50px #245b491f;--bg-a:#e4f2e9;--bg-b:#f8fcf9;--soft:#e6f3ec;--soft-line:#b7d8c9;--art:#82b79d;--hint-bg:#fff6d9;--best-bg:#fff4df;--best-line:#dfbd69}
    html[data-theme="winter"]{--ink:#14263d;--muted:#53687e;--paper:#edf6fb;--card:#fff;--line:#bfd3e2;--teal:#167d8d;--dark:#163c66;--coral:#a7354a;--gold:#d29a20;--good:#23704a;--bad:#a7354a;--shadow:0 18px 50px #163c661c;--bg-a:#e5f2f9;--bg-b:#f7fbfd;--soft:#e7f4f7;--soft-line:#a9d1d8;--art:#9ecbda;--hint-bg:#fff7dc;--best-bg:#fff8e5;--best-line:#e4c777}
    html[data-theme="yellow"]{--ink:#263247;--muted:#687386;--paper:#fffaf0;--card:#fff;--line:#ddc77f;--teal:#9b7517;--dark:#324c69;--coral:#a73d59;--gold:#d5a51f;--good:#347052;--bad:#a73d59;--shadow:0 18px 50px #7155121f;--bg-a:#fff1bd;--bg-b:#fffdf6;--soft:#fff4cd;--soft-line:#dfc56d;--art:#d4af48;--hint-bg:#eef6f8;--best-bg:#e9f4f7;--best-line:#8ab9c7}
    html[data-theme]:not([data-theme="default"]) body{background:linear-gradient(180deg,var(--bg-a) 0,var(--bg-b) 45%,var(--paper) 100%)}html[data-theme]:not([data-theme="default"]) .panel{background:#ffffffed;border-color:var(--line)}html[data-theme]:not([data-theme="default"]) .art{background:linear-gradient(145deg,var(--dark),var(--teal) 68%,var(--art))}html[data-theme]:not([data-theme="default"]) .orb{display:none}html[data-theme]:not([data-theme="default"]) .hero{background:linear-gradient(115deg,var(--dark),var(--teal))}html[data-theme]:not([data-theme="default"]) .notice,html[data-theme]:not([data-theme="default"]) .feedback{background:var(--soft);border-color:var(--soft-line)}html[data-theme]:not([data-theme="default"]) .hint{background:var(--hint-bg);color:var(--ink)}html[data-theme]:not([data-theme="default"]) .best{background:var(--best-bg);border-color:var(--best-line)}html[data-theme]:not([data-theme="default"]) th,html[data-theme]:not([data-theme="default"]) td{border-color:var(--line)}
    @media(max-width:820px){.login{grid-template-columns:1fr}.art{min-height:320px}.stats,.dash-grid,.options{grid-template-columns:1fr}}@media(max-width:520px){.shell{width:calc(100% - 20px);padding-top:16px}.brand small,.user>span:not(.avatar){display:none}.login-copy{padding:28px 22px}.hero,.stat,.chart-card,.history-card{padding:18px}.quiz-top{flex-direction:column}.fill-form{flex-direction:column}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

<body>
  <main class="shell">
    <header class="top"><div class="brand"><div class="mark">Q</div><div id="brandTitle">Lesson Quiz<small id="brandSub">REVIEW LAB</small></div></div><div class="user" id="user" hidden><span class="avatar" id="avatar">L</span><span id="userName"></span></div></header>
    <section class="panel login" id="login">
      <div class="login-copy"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="lede" id="subtitle"></p><div class="pills"><span class="pill" id="bankPill"></span><span class="pill" id="attemptPill"></span><span class="pill" id="storagePill"></span></div><form class="login-form" id="loginForm"><label for="name" id="nameLabel"></label><input id="name" type="text" autocomplete="name" maxlength="100" required><button class="btn" id="enter" type="submit"></button><div class="help" id="storageHelp"></div><div class="notice error" id="loginError" hidden></div></form></div>
      <div class="art" aria-hidden="true"><div class="orb a"></div><div class="orb b"></div><div class="code one"><span class="key">learn</span>.<span class="call">map</span>(idea =&gt; recall(idea))<br><span class="note">// practice makes progress</span></div><div class="code two"><span class="key">result</span> = <span class="call">challenge</span>(<span class="key">today</span>)</div></div>
    </section>
    <section id="app">
      <div class="panel hero"><h2 id="welcome"></h2><p id="encourage"></p></div><div class="notice" id="notice"></div>
      <div id="dashboard"><div class="stats"><article class="panel stat"><div class="stat-label" id="totalLabel"></div><div class="stat-value" id="total">0</div><div class="stat-sub" id="totalSub"></div></article><article class="panel stat"><div class="stat-label" id="latestLabel"></div><div class="stat-value" id="latest">—</div><div class="stat-sub" id="latestSub"></div></article><article class="panel stat best"><div class="stat-label" id="bestLabel"></div><div class="stat-value" id="best">—</div><div class="stat-sub" id="bestSub"></div></article></div>
        <div class="dash-grid"><article class="panel chart-card"><div class="section-head"><h3 id="trendLabel"></h3><span class="help">%</span></div><div class="empty" id="chartEmpty"></div><canvas id="chart"></canvas></article><article class="panel history-card"><div class="section-head"><h3 id="historyLabel"></h3><span class="help" id="historyCount"></span></div><div class="empty" id="historyEmpty"></div><div class="history-wrap" id="historyWrap" hidden><table><thead><tr><th id="timeHead"></th><th id="scoreHead"></th><th id="levelHead"></th></tr></thead><tbody id="historyBody"></tbody></table></div></article></div>
      </div>
      <div class="actions" id="mainActions"><button class="btn" id="start"></button><button class="btn secondary" id="importBtn"></button><button class="btn ghost" id="exportBtn"></button><input id="csvInput" type="file" accept=".csv,text/csv" hidden><div class="spacer"></div><button class="btn ghost" id="switchUser"></button></div>
      <section class="panel quiz" id="quiz" aria-live="polite"><div class="quiz-top"><div class="qcount" id="qcount"></div><div class="live" id="live"></div></div><div class="progress"><div id="bar"></div></div><span class="tag" id="topic"></span><h2 class="question" id="question"></h2><div class="hint-wrap" id="hintWrap"><button class="btn ghost" id="hintBtn" type="button"></button><div class="hint" id="hint" hidden></div></div><div class="options" id="options"></div><div class="feedback" id="feedback"><strong id="feedbackTitle"></strong><span id="feedbackText"></span></div><div class="quiz-foot"><button class="btn" id="next" disabled></button></div></section>
      <section class="panel result" id="result" aria-live="polite"><div class="result-emoji" id="resultEmoji"></div><h2 id="resultTitle"></h2><div class="result-score" id="resultScore"></div><div class="record" id="record"></div><div class="save" id="save"></div><div class="result-actions"><button class="btn" id="again"></button><button class="btn ghost" id="resultExport"></button><button class="btn ghost" id="back"></button></div><div class="review" id="review"></div></section>
    </section>
  </main>
  <script>
    const QUIZ={"meta":{"id":"pandas-groupby-describe-missing-20-23-en","title":"Pandas: Team Up, Spot Gaps, Save the Data!","subtitle":"Grouping, summaries, describe and missing-value repairs","attemptSize":20,"language":"en","theme":"yellow","bankSize":50},"questions":[{"id":"q01","t":"20 - Creating and inspecting groups","q":"What does df.groupby('Type_1') initially create?","h":"Separate the grouping plan from the calculation. No mean, sum or other aggregation has been requested yet.","c":["A GroupBy object describing groups","A DataFrame containing group means","A Boolean mask","A copy sorted by HP"],"a":0,"e":"groupby creates a GroupBy object organized by Type_1. You still need an operation such as agg, apply or get_group to calculate or retrieve something. It does not automatically compute means. Captain Panda has assigned the teams—not collected their report cards yet!"},{"id":"q02","t":"20 - Creating and inspecting groups","type":"fill","q":"Fill in the method: df.___(['Type_1','Type_2']) groups by pairs of type labels.","h":"Pass the two column names as one list. You are defining groups, not selecting output columns.","answers":["groupby"],"e":"groupby(['Type_1','Type_2']) defines a group for each relevant pair of keys. Grouping by Type_1 alone would merge different Type_2 values within each Type_1. Two badges identify a team more precisely than one!"},{"id":"q03","t":"20 - Creating and inspecting groups","q":"Which expression groups by the Series df['Type_1'], as demonstrated in the lesson?","h":"The by argument can receive column names or a Series supplying row grouping labels.","c":["df.describe(by=df['Type_1'])","df.groupby().indices('Type_1')","df.groupby(by=df['Type_1'])","df.get_group(by='Type_1')"],"a":2,"e":"The by parameter accepts the Series df['Type_1'] as grouping labels. In this direct-from-the-same-table example it gives the intended Type_1 grouping. get_group retrieves from an existing GroupBy; indices is an attribute, not the group-creation method. Choose the tool before opening the toolbox!"},{"id":"q04","t":"20 - Creating and inspecting groups","q":"df has index ['r10','r20','r30'] and Team=['A','B','A']. What does df.groupby('Team').groups['A'] contain?","h":"groups maps keys to original index labels. Read the name tags rather than counting zero-based seats.","c":["[0,2]","['A','A']","[1,3]","['r10','r30']"],"a":3,"e":"groups maps each group key to the row labels belonging to it. Team A includes rows labeled r10 and r30. The positions [0,2] instead belong to indices. Labels and positions may coincide in a default RangeIndex, so custom labels help reveal the difference. Name tags are not seat numbers!"},{"id":"q05","t":"20 - Creating and inspecting groups","q":"Using index ['r10','r20','r30'] and Team=['A','B','A'], what does df.groupby('Team').indices['A'] contain?","h":"indices uses integer positions in the current table. Start counting rows at zero.","c":["[0,2]","['r10','r30']","[1,3]","['A']"],"a":0,"e":"indices returns row positions as integer arrays, so the first and third rows are positions 0 and 2. groups returns their labels instead. Sorting or rearranging the table changes positions, while labels still name rows. Panda checks the seating chart before handing out snacks!"},{"id":"q06","t":"20 - Creating and inspecting groups","type":"fill","q":"Fill in the attribute: grouped.___ gives the number of groups.","h":"You want a count of teams, not a dictionary of their members. The name begins with n.","answers":["ngroups"],"e":"ngroups reports the number of groups represented by the GroupBy configuration. It is an attribute, so use grouped.ngroups without parentheses. It is not the number of input rows or the size of one group. Count teams, not individual superheroes!"},{"id":"q07","t":"20 - Creating and inspecting groups","q":"In for name, group in df.groupby('Team'), what is group?","h":"Each loop iteration provides the group key and its associated subset of the input.","c":["Only the group's index labels","Always one scalar mean","The DataFrame subset for that group","The number of groups"],"a":2,"e":"For this DataFrameGroupBy, name is the key and group is the group's DataFrame. You can inspect group.head() or calculate from its columns. Iteration does not secretly aggregate it. Each team walks into the room with its own folder!"},{"id":"q08","t":"20 - Creating and inspecting groups","q":"When iterating df.groupby(['Type_1','Type_2']), what form does the key name take?","h":"There are two grouping columns, so the key must preserve both values and their order.","c":["Only the string 'Water'","Always an integer row position","A Series of column means","A tuple such as ('Water','Flying')"],"a":3,"e":"A multi-key group is identified by a tuple in grouping-column order. ('Water','Flying') means Type_1=Water and Type_2=Flying. Reversing those values identifies a different pair. Two badges, one ordered team identity!"},{"id":"q09","t":"20 - Creating and inspecting groups","type":"fill","q":"Fill in the method: df.groupby('Type_1').___('Fire') retrieves the Fire group.","h":"The groups already exist. Use the retrieval method rather than rebuilding a Boolean mask.","answers":["get_group"],"e":"get_group('Fire') returns the rows belonging to Fire from a GroupBy created with the scalar key 'Type_1'. This retrieves observations rather than computing a summary. In contrast, groups['Fire'] contains row labels, not the entire group's DataFrame. Get the team, not just its attendance list!"},{"id":"q10","t":"20 - Creating and inspecting groups","q":"For g=df.groupby(['Type_1','Type_2']), how do you retrieve Water/Flying?","h":"get_group takes one group-key argument. For two keys, that argument is an ordered tuple.","c":["g.groups.get_group('Water')","g.get_group(('Water','Flying'))","g.get_group('Water','Flying')","g.get_group(['Water','Flying'])"],"a":1,"e":"Pass ('Water','Flying') as one tuple matching Type_1 then Type_2. Separate arguments do not represent this multi-key group. A list is also not the required hashable group identity. Put both badges in one envelope!"},{"id":"q11","t":"21 - Group summaries and time grouping","q":"Team=['A','A','B'], HP=[10,30,90]. What mean HP does groupby('Team').agg(avg_HP=('HP','mean')) give A?","h":"Split first: Team A has 10 and 30. Compute its mean without borrowing B's score.","c":["40","90","20","130/3"],"a":2,"e":"Group A contains HP 10 and 30, so its mean is (10+30)/2=20. The whole-table mean mixes teams and answers a different question; 40 is A's sum. Grouping keeps the correct teammates in each calculation. Doctor Oops cannot borrow Team B's power!"},{"id":"q12","t":"21 - Group summaries and time grouping","q":"A group has HP=[10,NaN,30]. What does named aggregation n=('HP','size') return?","h":"size counts entries in the group, including the row whose HP is missing.","c":["2","20","NaN","3"],"a":3,"e":"size counts all three rows, including the missing HP entry. It is not a count of known HP values; that would be 2. The output name n is just a label and does not alter the function's behavior. A teammate with an unknown score still attended!"},{"id":"q13","t":"21 - Group summaries and time grouping","type":"fill","q":"Fill in the method: grouped.agg(avg_HP=('HP','mean')).___() turns group-key index levels into columns.","h":"The grouped result stores its keys in the index by default. You want those keys as ordinary columns.","answers":["reset_index"],"e":"reset_index() moves the group-key index into ordinary columns and creates a default index. It does not recompute group statistics or restore all original observations. Do not use drop=True if you want to retain the group-key values. Bring the team badge into the report!"},{"id":"q14","t":"21 - Group summaries and time grouping","q":"String keys occur in order ['Water','Fire','Water','Grass']. With groupby('Type',sort=False), what order do the observed groups follow?","h":"Use this noncategorical example. sort=False keeps encounter order instead of alphabetizing group keys.","c":["Water, Water, Fire, Grass","Water, Fire, Grass","Fire, Grass, Water","Grass, Fire, Water"],"a":1,"e":"With these ordinary string keys and sort=False, observed groups follow their first appearance: Water, Fire, Grass. The repeated Water contributes another row to its existing group. This does not sort observations by HP or create duplicate groups. First arrival earns the first team slot!"},{"id":"q15","t":"21 - Group summaries and time grouping","q":"What does groupby(..., sort=True) primarily sort?","h":"Look at the grouping keys, not a numeric measurement inside each group.","c":["All columns independently","Only the original index labels","Group keys in the result/iteration","HP values within every group"],"a":2,"e":"sort=True sorts group keys. It does not sort HP within each group or independently reorder every column. If you need HP ordering, use a separate value-sorting step. Alphabetizing team folders does not rank the players inside them!"},{"id":"q16","t":"21 - Group summaries and time grouping","q":"Team is categorical with categories ['A','B','C'], but rows contain only A and B. Why use observed=False in the lesson's grouped aggregation?","h":"Distinguish declared categories from categories actually seen in rows.","c":["To delete missing values from HP","To convert every category to numeric","To make each row a separate group","To include unobserved category C in the aggregation output"],"a":3,"e":"For categorical grouping, observed=False includes unobserved categories in the aggregation output. With multiple categorical keys, it can produce unobserved combinations too. Empty combinations may have no measurement summary; they are not evidence of extra observations. An empty team folder is still a folder!"},{"id":"q17","t":"21 - Group summaries and time grouping","q":"What does groupby(['Type_1','Type_2'],dropna=True) do to rows missing a grouping key?","h":"This dropna belongs to groupby. It decides membership by the keys, before any aggregation result exists.","c":["Excludes those rows from the grouped calculation","Fills their HP with zero","Deletes every result column","Keeps missing keys as a regular group automatically"],"a":0,"e":"dropna=True excludes rows with missing grouping-key values. It does not mean every missing measurement is removed from every group, and it does not fill data. This is a key-membership rule. A missing team badge differs from a missing score!"},{"id":"q18","t":"21 - Group summaries and time grouping","q":"How does groupby(...,dropna=True).agg(...).dropna() use two different missing-value operations?","h":"Read the timeline: grouping first, summary table second, then a DataFrame cleanup.","c":["The final dropna changes categorical labels to strings","The first controls missing keys; the second drops missing rows from the summary","Both always remove exactly the same original rows","The first fills keys; the second fills measurements"],"a":1,"e":"The groupby argument controls whether missing keys form part of grouping. The later DataFrame.dropna() removes summary rows containing NA by its default rule. With unobserved category combinations, some summary rows may contain NA even without missing measurement values in actual groups. Check which table exists at each step!"},{"id":"q19","t":"21 - Group summaries and time grouping","q":"atk_stats(group) reads group['Attack'] and returns a Series with min_ATK,max_ATK,mean_ATK. What does grouped.apply(atk_stats,include_groups=False) do?","h":"The callable receives each group's data and returns that group's report. Do not confuse it with one call on the full table.","c":["Only renames Attack","Selects the group with maximum Attack","Runs atk_stats separately for each group and combines the results","Runs atk_stats once for the whole table"],"a":2,"e":"GroupBy.apply calls the function for each group and combines returned results. Here each result is a three-statistic Series, yielding a report by group. include_groups=False affects what columns enter the callable, not whether each team gets a turn. Every team receives its own inspection!"},{"id":"q20","t":"21 - Group summaries and time grouping","q":"What does include_groups=False mean in GroupBy.apply on a supporting Pandas version?","h":"Inspect the input given to the callable. Output index control is a different concern.","c":["Group keys are automatically removed from the result index","Only groups with missing keys are processed","The function is not applied to any group","Grouping columns are excluded from the DataFrame passed to the function"],"a":3,"e":"include_groups=False excludes grouping columns from the function's input. It does not automatically remove group keys from the result index; the lesson uses reset_index() afterward to turn keys into columns. The function still has access to measurement columns such as Attack. Input ingredients and report labels are different things!"},{"id":"q21","t":"21 - Group summaries and time grouping","type":"fill","q":"Fill in the Pandas helper: pd.___(key='date',freq='5D') creates five-day grouping bins.","h":"This capitalized helper goes inside groupby. Its key identifies the datetime column and freq defines the time interval.","answers":["Grouper"],"e":"pd.Grouper(key='date',freq='5D') supplies time-bin grouping instructions. It can be combined with another key such as country. It does not request five rows per group or compute the mean by itself. Five days is a calendar-sized bucket, not a five-person team!"},{"id":"q22","t":"21 - Group summaries and time grouping","q":"df.groupby([pd.Grouper(key='date',freq='5D'),'country']).agg({'value':'mean'}) requires what preparation?","h":"The time-binning key must contain actual datetimes, not just date-looking text.","c":["Use a datetime index and remove the date column in every case","Convert date to datetime, then group by time bin and country","Rename every country to a date","Convert value to category"],"a":1,"e":"With key='date', Grouper reads a datetime column; convert it with pd.to_datetime first. country adds a second grouping key, so each report entry corresponds to a bin/country combination. A datetime index is not compulsory when using this key argument. Give the calendar a real clock, not a text costume!"},{"id":"q23","t":"22 - Reading describe summaries","q":"A mixed DataFrame has numeric HP, categorical Type and text Name. Which columns does df.describe() summarize by default in this lesson?","h":"No include argument was supplied. Match the default output shown for the mixed Pokemon table.","c":["Every column using one identical statistic set","Only index labels","Numeric columns such as HP","Only categorical columns"],"a":2,"e":"For this mixed table, default describe summarizes numeric columns. Text and categorical summaries require an appropriate include setting. The default is not a promise to show every dtype. Panda starts with the numeric report, not the entire library!"},{"id":"q24","t":"22 - Reading describe summaries","q":"Numeric HP=[10,NaN,30]. What count appears in its describe summary?","h":"count means known observations, not the total number of rows. Check which entries are non-missing.","c":["3","20","1","2"],"a":3,"e":"describe's count excludes missing entries, so only 10 and 30 contribute and count=2. The input still has three rows. This differs from a group's size, which counts every member. Unknown scores do not become known just because the roll call is complete!"},{"id":"q25","t":"22 - Reading describe summaries","type":"fill","q":"Fill in the exact include value: df.describe(include='___') requests all column types.","h":"Use a single string meaning every type. It is not a list combining dtype names with this word.","answers":["all"],"e":"include='all' requests summaries for all column types. Each dtype has its applicable statistics, so the combined result can contain NaN where a statistic does not apply. This is not the same as include=['object','category']. Bring all departments, but give each the right report form!"},{"id":"q26","t":"22 - Reading describe summaries","q":"For category values ['Fire','Water','Water',None], what are count,unique,top,freq?","h":"Ignore the missing entry for count. Count distinct known labels, then find the most frequent label and its frequency.","c":["count=2, unique=3, top=Water, freq=3","count=3, unique=2, top=Water, freq=2","count=4, unique=3, top=Water, freq=2","count=3, unique=2, top=Fire, freq=1"],"a":1,"e":"There are three non-missing values and two distinct labels. Water occurs twice, making it top with freq=2. The missing entry is not an extra category in this summary. Four chairs, three guests, two badge designs—count the right thing!"},{"id":"q27","t":"22 - Reading describe summaries","q":"What does the 50% row mean in a numeric describe output?","h":"It is a percentile label, not a missingness rate or half the mean.","c":["50 percent of the mean","The percentage of missing entries","The median (50th percentile)","Half of the maximum"],"a":2,"e":"The 50% row is the median, or 50th percentile. It is calculated from the observed numeric values, not by halving the maximum or mean. It also does not measure missingness. A familiar percent sign can wear different uniforms—read its label!"},{"id":"q28","t":"22 - Reading describe summaries","q":"Why can include='all' show NaN for the mean of a text column?","h":"Ask whether mean is meaningful for that dtype before assuming data are missing.","c":["The text column must be entirely missing","All text values equal zero","describe deleted the column","That statistic is not applicable to the text column"],"a":3,"e":"Combining different dtype summaries produces rows that are not applicable to every column. A text column can have count/top/freq while mean is NaN. That NaN alone does not prove missing input values. A blank shoe-size field on a robot's form is not a missing robot!"},{"id":"q29","t":"22 - Reading describe summaries","q":"Which call requests the lesson's text/object and categorical summaries?","h":"Pass the dtype names in include. The string 'all' instead requests every type.","c":["df.describe(include=['object','category'])","df.describe(include=['all','category'])","df.describe(exclude='all')","df.describe(axis=1)"],"a":0,"e":"include=['object','category'] selects those dtypes for this summary. It differs from include='all', which includes numeric and other types too. Match dtype selection to the question being asked. Choose the report departments before printing the forms!"},{"id":"q30","t":"22 - Reading describe summaries","q":"df has object Name, category Type, bool Legendary and numeric HP. What does describe(exclude=['category','bool']) include?","h":"Exclude removes the listed dtypes; it does not mean numeric-only. Check the surviving object column too.","c":["No columns","Name and HP","Only HP","Type and Legendary"],"a":1,"e":"Excluding category and bool leaves object Name and numeric HP. Their relevant summary rows are combined, which may produce inapplicable NaN cells. Do not silently reinterpret exclude as 'show only numbers'. The guest list keeps everyone who was not excluded!"},{"id":"q31","t":"23 - Missing values and aligned filling","type":"fill","q":"Fill in the method: df.___() returns True where values are missing.","h":"Start with detection, not deletion. The result is a Boolean table with the same shape.","answers":["isna"],"e":"isna() marks missing values True and observed values False. isnull() is its alias in this lesson. It does not delete, fill or count anything until another operation is applied. First spot the holes; only then choose a repair!"},{"id":"q32","t":"23 - Missing values and aligned filling","q":"For a DataFrame, what does df.isna().sum() return by default?","h":"isna turns each cell into True/False. sum then counts True down each column.","c":["A count of all rows with any missing value","A missingness percentage automatically","The total number of groups","A missing-value count for each column"],"a":3,"e":"With default axis=0, summing the Boolean mask counts missing cells separately in each column. It is not a row-level any-missing count and is not yet a percentage. Two holes in one row can contribute to two column totals. Count holes, not just leaky buckets!"},{"id":"q33","t":"23 - Missing values and aligned filling","q":"A 5-row column has 2 missing values. What does notna().sum() return for it?","h":"notna is True for known entries, the opposite of isna. Subtract missing from total.","c":["3","2","5","0.4"],"a":0,"e":"Five rows minus two missing values leaves three non-missing values. notna().sum() counts those known entries; notnull() is the demonstrated alias. A missingness ratio would require division by five. Check which side of the attendance list you are counting!"},{"id":"q34","t":"23 - Missing values and aligned filling","q":"What does df.info() help inspect in the missing-data lesson?","h":"The lesson uses it as an overview, including dtype and non-null counts—not as a filling method.","c":["Automatic interpolation values","Column dtypes and non-null counts","A filled copy of every column","Only the most frequent value"],"a":1,"e":"info displays a structural summary with column types and non-null counts in the lesson's table. Comparing counts with total rows helps identify incomplete columns. It does not impute missing values. Panda's inspection clipboard is useful, but it is not a magic repair wand!"},{"id":"q35","t":"23 - Missing values and aligned filling","q":"What does df.dropna(axis=1,how='any') remove?","h":"axis=1 tells you which objects are removed: columns. how='any' triggers removal on even one missing entry.","c":["Only columns whose every entry is missing","Only missing cells, leaving ragged columns","Columns containing at least one missing value","Rows containing at least one missing value"],"a":2,"e":"axis=1 removes columns; how='any' removes a column if any entry is missing. With how='all', every entry would need to be missing instead. dropna removes whole rows or columns, not individual cells from a rectangular table. Do not send the whole department home when you meant one row!"},{"id":"q36","t":"23 - Missing values and aligned filling","q":"What does df.dropna(axis=0,how='all') remove?","h":"axis=0 means rows. all demands that every value in the inspected row be missing.","c":["Every row with at least one missing value","All columns with missing values","All rows with zero values","Rows where all values are missing"],"a":3,"e":"This removes entirely missing rows. A row with even one known value survives the all rule; how='any' is stricter and removes rows with any missing entry. Numeric zero is a known value, not automatically missing. One real teammate still keeps the team on the attendance sheet!"},{"id":"q37","t":"23 - Missing values and aligned filling","q":"A column has 6 entries, 4 non-missing. Does dropna(axis=1,thresh=4) keep it?","h":"thresh counts required NON-missing values. 'At least' includes equality.","c":["Yes, it meets the minimum of 4 known values","No, thresh counts missing values","No, it must have more than 4 known values","Only if the known values are all zero"],"a":0,"e":"thresh=4 requires at least four non-missing entries, so this column survives. It does not mean four missing values are allowed or demand strictly more than four known entries. Use an integer threshold for a clear rule. Four valid tickets satisfy a four-ticket minimum!"},{"id":"q38","t":"23 - Missing values and aligned filling","q":"What does df.dropna(subset=['A','B']) check with the default row-wise behavior?","h":"subset limits the columns used to decide whether each row should be removed. It does not select output columns.","c":["It deletes columns A and B","Missingness in A or B; surviving rows retain the other columns","Missingness in every column and returns only A/B","Only rows where both A and B are missing"],"a":1,"e":"With default how='any', a row is dropped if A or B is missing. Other columns are not checked by this subset rule, but they remain in the output. Use how='all' for a different condition if needed. subset chooses the referees, not who stays on the scoreboard!"},{"id":"q39","t":"23 - Missing values and aligned filling","q":"For s=[1,NaN,3], what does s.fillna(0) return?","h":"Replace only the missing position. Observed values are not rewritten.","c":["[1,3]","[1,2,3]","[1,0,3]","[0,0,0]"],"a":2,"e":"fillna(0) substitutes zero only where a value is missing. It preserves 1 and 3 and does not remove a row or interpolate 2. Zero is a chosen fill value, not a universally correct missing-data assumption. A spare part must fit the repair, not just be nearby!"},{"id":"q40","t":"23 - Missing values and aligned filling","q":"What does df.fillna({'A':0,'B':99}) do?","h":"A dictionary assigns a separate replacement rule to each named column.","c":["Replaces every A and B value","Drops rows where A=0 or B=99","Fills all columns with the same average","Fills missing A with 0 and missing B with 99"],"a":3,"e":"The dictionary maps column names to their fill values. Only missing entries in A and B are replaced; existing values and unlisted columns are not changed by these rules. Different columns can need different repair parts. Doctor Oops's one-size-fits-all plug is not required!"},{"id":"q41","t":"23 - Missing values and aligned filling","q":"A numeric column is [2,NaN,6]. What value replaces its NA in df_num.fillna(df_num.mean())?","h":"Compute that column's mean from known values first. The mean Series is matched to columns by labels.","c":["4","8/3","0","8"],"a":0,"e":"The mean of known values 2 and 6 is 4, so 4 fills the missing entry. It is a per-column mean, not one mean across all units, and the missing entry does not enter the denominator as zero. Repair each column using its own ruler!"},{"id":"q42","t":"23 - Missing values and aligned filling","type":"fill","q":"Fill in the method: s.___() carries the previous observed value forward into later gaps.","h":"Think 'forward fill'. It looks backward for an available value, then carries that value forward.","answers":["ffill"],"e":"ffill propagates the most recent preceding known value. For [1,NaN,NaN,4], it gives [1,1,1,4]. A leading gap with no prior value cannot be filled this way alone. The messenger carries the last message forward; it cannot invent an earlier one!"},{"id":"q43","t":"23 - Missing values and aligned filling","q":"What is pd.Series([1,NaN,NaN,4]).bfill() ?","h":"Backward fill uses the next observed value to fill earlier gaps.","c":["[1,2,3,4]","[0,0,0,4]","[1,4,4,4]","[1,1,1,4]"],"a":2,"e":"bfill copies the next available value backward. The next known value after both gaps is 4, so both become 4. ffill would copy 1; linear interpolation would give 2 and 3. Similar-looking repairs make different assumptions—choose before hammering!"},{"id":"q44","t":"23 - Missing values and aligned filling","q":"For s=[0,NaN,NaN,6] with an ordinary equally spaced index, what does linear interpolate produce?","h":"Split the distance from 0 to 6 into three equal steps. This is not forward or backward copying.","c":["[0,0,0,6]","[0,6,6,6]","[0,3,3,6]","[0,2,4,6]"],"a":3,"e":"The endpoints are three equally spaced steps apart, so each step adds 2. The interior gaps become 2 and 4. ffill and bfill would copy an endpoint instead. Linear interpolation draws a bridge, not a photocopy!"},{"id":"q45","t":"23 - Missing values and aligned filling","type":"fill","q":"Fill in the index type word: interpolate(method='time') requires a ___ index.","h":"A column containing date-looking strings is not enough. The method needs a time-aware index to measure spacing.","answers":["datetime"],"e":"The lesson creates a DatetimeIndex by converting/creating dates and calling set_index('date'). Time interpolation uses time spacing between observations. A date column that is not the index does not meet this setup. Give the bridge builder a real calendar, not a paper clock!"},{"id":"q46","t":"23 - Missing values and aligned filling","q":"Why does the lesson drop the column with only one known value before order=2 polynomial/spline interpolation?","h":"A quadratic fit cannot be identified from one known point. The order and available data must be compatible.","c":["order=2 means exactly two rows must remain","It lacks enough known points for a second-order fit","One known point always produces the perfect quadratic","All numeric columns must be removed"],"a":1,"e":"Second-order fitting needs more information than one non-missing point. The lesson removes that very sparse column before trying these methods. Polynomial/spline options can require SciPy and suitable input geometry too. A single dot cannot tell the whole curve's life story!"},{"id":"q47","t":"23 - Missing values and aligned filling","q":"The lesson's polynomial and nearest interpolation examples leave boundary NAs despite limit_direction='both'. What should you conclude?","h":"The selected method controls where estimates are available. A direction option does not promise universal extrapolation.","c":["Boundary NAs mean the original data were deleted","limit_direction is a replacement value","Inspect remaining NAs; 'both' does not guarantee every method fills all gaps","All interpolation methods always eliminate every NA"],"a":2,"e":"These examples fill eligible interior gaps while boundary gaps remain. limit_direction='both' does not force methods such as polynomial/nearest to extrapolate beyond their usable support. The lesson's spline example behaves differently on its data; avoid a blanket guarantee. Always inspect the repaired bridge before crossing!"},{"id":"q48","t":"23 - Missing values and aligned filling","q":"In np.where(df_num.isna(), df_num.mean(), df_num), which branch is used where the mask is True?","h":"np.where(condition, value_if_true, value_if_false). True here means the original cell is missing.","c":["The original missing value","The column name","The Boolean True itself","The corresponding column mean"],"a":3,"e":"True locations receive the corresponding column mean; False locations keep their observed values. np.where returns an array, so wrapping it as a DataFrame restores labels you supply. If retaining a custom index, pass index=df_num.index too. A repaired table should keep its address labels!"},{"id":"q49","t":"23 - Missing values and aligned filling","q":"What is the key benefit of df.groupby('week')['x'].transform('mean') for filling missing x?","h":"Compare a one-row-per-group summary with a value mapped back to each input row.","c":["It broadcasts each group's mean back to its original rows/index","It returns only one row for each week","It removes every original observation","It fills missing group keys with zero"],"a":0,"e":"transform('mean') returns a same-indexed result, repeating each week group's mean for its members. That alignment makes x.fillna(...) work row by row. agg('mean') instead produces a group summary and is not a drop-in row-aligned fill table. Send the right team statistic back to each teammate!"},{"id":"q50","t":"23 - Missing values and aligned filling","q":"Why can group-mean filling leave NaNs after fillna(groupby(...).transform('mean'))?","h":"Ask what mean can be computed when a group's entire measurement column is missing.","c":["The method always fills with a global zero","An all-missing group has no known mean to supply","transform always ignores every group","fillna never accepts a Series or DataFrame"],"a":1,"e":"If a group has no observed values for a column, its mean remains missing. transform broadcasts that missing result, leaving nothing usable for fillna. The lesson shows this in some week groups. Group-aware repair cannot conjure evidence; choose a separate justified fallback if needed. Empty snack boxes cannot feed the team!"}]};

    const T=I18N[QUIZ.meta.language]||I18N.en,$=id=>document.getElementById(id),S={name:"",history:[],quiz:[],index:0,correct:0,answers:[],locked:false};
    document.documentElement.lang=QUIZ.meta.language||"en";document.documentElement.dataset.theme=QUIZ.meta.theme||"default";document.title=QUIZ.meta.title;$("brandTitle").childNodes[0].nodeValue=QUIZ.meta.title;$("title").textContent=QUIZ.meta.title;$("subtitle").textContent=QUIZ.meta.subtitle;$("eyebrow").textContent=T.eyebrow;$("nameLabel").textContent=T.name;$("name").placeholder=T.namePh;$("enter").textContent=T.enter;$("bankPill").textContent=T.bank(QUIZ.meta.bankSize);$("attemptPill").textContent=T.attempt(QUIZ.meta.attemptSize);$("storagePill").textContent=T.storage;$("storageHelp").textContent=T.storageHelp;
    [["totalLabel",T.total],["latestLabel",T.latest],["bestLabel",T.best],["trendLabel",T.trend],["historyLabel",T.history],["timeHead",T.time],["scoreHead",T.score],["levelHead",T.level],["start",T.start(QUIZ.meta.attemptSize)],["importBtn",T.import],["exportBtn",T.export],["switchUser",T.switchUser],["again",T.again],["resultExport",T.export],["back",T.back]].forEach(([id,v])=>$(id).textContent=v);$("totalSub").textContent=T.attemptDone(QUIZ.meta.attemptSize);$("chartEmpty").textContent=T.chartEmpty;$("historyEmpty").textContent=T.historyEmpty;
    const shuffle=a=>{a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},pct=n=>Number.isInteger(n)?String(n):n.toFixed(2).replace(/0+$/,"").replace(/\.$/,""),level=p=>T.levels.find(x=>p>=x.min),key=()=>`lesson-quiz::${QUIZ.meta.id}::${S.name.normalize("NFC").toLocaleLowerCase()}`;
    function load(){try{const x=JSON.parse(localStorage.getItem(key())||"[]");return Array.isArray(x)?x:[]}catch{return[]}}function save(){localStorage.setItem(key(),JSON.stringify(S.history))}function stamp(){const d=new Date(),p=(n,w=2)=>String(n).padStart(w,"0"),base=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;if(!S.history.some(x=>x.time===base))return base;let v=`${base}.${p(d.getMilliseconds(),3)}`,n=2;while(S.history.some(x=>x.time===v))v=`${base}.${p(d.getMilliseconds(),3)}-${n++}`;return v}
    function esc(v){v=String(v);return/[",\r\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v}function csv(){return"\uFEFF"+["Name",...S.history.map(x=>x.time)].map(esc).join(",")+"\r\n"+[S.name,...S.history.map(x=>`${x.correct}/${x.total} (${pct(x.percent)}%) - ${x.label}`)].map(esc).join(",")+"\r\n"}function parseCsv(text){text=text.replace(/^\uFEFF/,"");const rows=[];let row=[],cell="",q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}else if(c==='"')q=true;else if(c===","){row.push(cell);cell=""}else if(c==="\n"){row.push(cell.replace(/\r$/,"") );rows.push(row);row=[];cell=""}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}if(q||rows.length!==2||rows[1][0]!==S.name||rows[0].length!==rows[1].length)throw Error(T.badCsv);return rows[0].slice(1).map((time,i)=>{const m=rows[1][i+1].match(/^(\d+)\/(\d+) \(([\d.]+)%\) - (.+)$/);if(!m)throw Error(T.badCsv);return{time,correct:+m[1],total:+m[2],percent:+m[3],label:m[4]}})}
    $("loginForm").addEventListener("submit",e=>{e.preventDefault();S.name=$("name").value.trim();if(!S.name)return;S.history=load();$("login").style.display="none";$("app").style.display="block";$("user").hidden=false;$("userName").textContent=S.name;$("avatar").textContent=S.name[0].toUpperCase();$("welcome").textContent=T.welcome(S.name);$("encourage").textContent=T.encourage;$("notice").textContent=T.notice;renderDash()});$("switchUser").onclick=()=>location.reload();
    function renderDash(){const h=S.history;$("total").textContent=h.length;$("historyCount").textContent=`${h.length}`;if(!h.length){$("latest").textContent=$("best").textContent="—";$("latestSub").textContent=T.noData;$("bestSub").textContent=T.firstMilestone;$("chart").style.display="none";$("chartEmpty").style.display="block";$("historyWrap").hidden=true;$("historyEmpty").style.display="block";return}const last=h.at(-1),best=h.reduce((a,b)=>b.percent>a.percent?b:a);$("latest").textContent=`${last.correct}/${last.total}`;$("latestSub").textContent=`${pct(last.percent)}% · ${last.label}`;$("best").textContent=`${best.correct}/${best.total}`;$("bestSub").textContent=`${pct(best.percent)}% · ${best.label}`;$("historyBody").replaceChildren(...[...h].reverse().map(x=>{const tr=document.createElement("tr");[x.time,`${x.correct}/${x.total} · ${pct(x.percent)}%`,x.label].forEach(v=>{const td=document.createElement("td");td.textContent=v;tr.append(td)});return tr}));$("chartEmpty").style.display="none";$("chart").style.display="block";$("historyEmpty").style.display="none";$("historyWrap").hidden=false;requestAnimationFrame(draw)}
    function draw(){const c=$("chart");if(!S.history.length)return;const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;const x=c.getContext("2d");x.scale(d,d);const w=r.width,h=r.height,p={l:38,r:15,t:15,b:30};x.font="12px system-ui";x.fillStyle="#718087";x.strokeStyle="#e4dfd5";[0,25,50,75,100].forEach(v=>{const y=p.t+(100-v)/100*(h-p.t-p.b);x.beginPath();x.moveTo(p.l,y);x.lineTo(w-p.r,y);x.stroke();x.fillText(v,7,y+4)});const pts=S.history.map((v,i)=>({x:S.history.length===1?(p.l+w-p.r)/2:p.l+i*(w-p.l-p.r)/(S.history.length-1),y:p.t+(100-v.percent)/100*(h-p.t-p.b)}));if(pts.length>1){x.beginPath();pts.forEach((v,i)=>i?x.lineTo(v.x,v.y):x.moveTo(v.x,v.y));x.strokeStyle="#087e78";x.lineWidth=3;x.stroke()}pts.forEach((v,i)=>{x.beginPath();x.arc(v.x,v.y,5,0,Math.PI*2);x.fillStyle=i===pts.length-1?"#e56b4d":"#087e78";x.fill()})}window.addEventListener("resize",()=>requestAnimationFrame(draw));
    function select(){const groups=[...new Set(QUIZ.questions.map(q=>q.t))].map(t=>shuffle(QUIZ.questions.filter(q=>q.t===t))),out=[];while(out.length<QUIZ.meta.attemptSize){let added=false;for(const g of shuffle(groups)){if(g.length&&out.length<QUIZ.meta.attemptSize){const q=g.pop(),opts=q.type==="fill"?null:shuffle(q.c.map((text,i)=>({text,ok:i===q.a})));out.push({...q,opts});added=true}}if(!added)break}return shuffle(out)}
    function start(){S.quiz=select();S.index=S.correct=0;S.answers=[];$("dashboard").style.display="none";$("mainActions").style.display="none";$("result").classList.remove("show");$("quiz").classList.add("show");renderQ();scrollTo({top:0})}$("start").onclick=$("again").onclick=start;
    function renderQ(){const q=S.quiz[S.index];S.locked=false;$("qcount").textContent=T.question(S.index+1,S.quiz.length);$("live").textContent=T.correct(S.correct);$("bar").style.width=`${S.index/S.quiz.length*100}%`;$("topic").textContent=q.t;$("question").textContent=q.q;$("hintWrap").hidden=!q.h;$("hint").hidden=true;$("hint").textContent=q.h||"";$("hintBtn").textContent=T.hint;$("feedback").classList.remove("show");$("next").disabled=true;$("next").textContent=S.index===S.quiz.length-1?T.results:T.next;if(q.type==="fill"){const form=document.createElement("form"),input=document.createElement("input"),button=document.createElement("button");form.className="fill-form";input.className="fill-input";input.type="text";input.placeholder=T.fillPh;input.autocomplete="off";input.required=true;button.className="btn";button.type="submit";button.textContent=T.check;form.onsubmit=e=>{e.preventDefault();answerFill(input.value,input,button)};form.append(input,button);$("options").replaceChildren(form);requestAnimationFrame(()=>input.focus())}else $("options").replaceChildren(...q.opts.map((o,i)=>{const b=document.createElement("button");b.className="option";b.type="button";b.dataset.ok=o.ok;b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span>`;b.append(document.createTextNode(o.text));b.onclick=()=>answer(o,b);return b}))}$("hintBtn").onclick=()=>{const h=$("hint");h.hidden=!h.hidden;$("hintBtn").textContent=h.hidden?T.hint:T.hideHint};

    function answer(o,chosen){if(S.locked)return;S.locked=true;const q=S.quiz[S.index];[...$("options").children].forEach(b=>{b.disabled=true;if(b.dataset.ok==="true")b.classList.add("correct")});if(!o.ok)chosen.classList.add("wrong");showFeedback(o.ok,q,o.text,q.c[q.a])}
    function answerFill(value,input,button){if(S.locked)return;const picked=value.trim();if(!picked){input.focus();return}S.locked=true;const clean=v=>String(v).trim().replace(/^`|`$/g,"").replace(/\s+/g," ").toLocaleLowerCase(),q=S.quiz[S.index],ok=q.answers.some(a=>clean(a)===clean(picked));input.disabled=button.disabled=true;input.classList.add(ok?"correct":"wrong");showFeedback(ok,q,picked,q.answers[0])}$("next").onclick=()=>{if(!S.locked)return;if(++S.index<S.quiz.length)renderQ();else finish()};
    function finish(){const percent=S.correct/S.quiz.length*100,l=level(percent),old=S.history.length?Math.max(...S.history.map(x=>x.percent)):-1;S.history.push({time:stamp(),correct:S.correct,total:S.quiz.length,percent,label:`${l.emoji} ${l.title}`});try{save();$("save").textContent=T.saved}catch{$("save").textContent=T.storageHelp}$("quiz").classList.remove("show");$("result").classList.add("show");$("resultEmoji").textContent=l.emoji;$("resultTitle").textContent=l.title;$("resultScore").textContent=T.result(S.correct,S.quiz.length,pct(percent));$("record").textContent=T.record;$("record").classList.toggle("show",percent>=old);const wrong=S.answers.filter(x=>!x.ok);$("review").replaceChildren();const h=document.createElement("h3");h.textContent=wrong.length?T.review(wrong.length):T.perfect;$("review").append(h);wrong.forEach((x,i)=>{const d=document.createElement("div");d.className="review-item";const q=document.createElement("strong"),p=document.createElement("p"),a=document.createElement("p"),e=document.createElement("p");q.textContent=`${i+1}. ${x.q}`;p.textContent=`${T.picked}: ${x.picked}`;a.textContent=`${T.answer}: ${x.answer}`;a.className="right";e.textContent=x.e;d.append(q,p,a,e);$("review").append(d)});scrollTo({top:0})}
    $("back").onclick=()=>{$("result").classList.remove("show");$("dashboard").style.display="block";$("mainActions").style.display="flex";renderDash();scrollTo({top:0})};function download(){if(!S.history.length){$("notice").textContent=T.noExport;return}const u=URL.createObjectURL(new Blob([csv()],{type:"text/csv;charset=utf-8"})),a=document.createElement("a");a.href=u;a.download=`${S.name.replace(/[<>:"/\\|?*]/g,"_")}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$("exportBtn").onclick=$("resultExport").onclick=download;$("importBtn").onclick=()=>$("csvInput").click();$("csvInput").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;try{const imported=parseCsv(await f.text()),m=new Map(S.history.map(x=>[x.time,x]));imported.forEach(x=>m.set(x.time,x));S.history=[...m.values()].sort((a,b)=>a.time.localeCompare(b.time));save();renderDash();$("notice").textContent=T.imported(imported.length,f.name);$("notice").className="notice"}catch(err){$("notice").textContent=err.message;$("notice").className="notice error"}};
