  <style>
    :root{--ink:#17232b;--muted:#63727b;--paper:#f7f4ed;--card:#fffdf8;--line:#ded9cd;--teal:#087e78;--dark:#055d59;--coral:#e56b4d;--gold:#f2b544;--good:#267a4b;--bad:#b23b3b;--shadow:0 18px 50px #182a2f1f;--r:22px}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 8% 5%,#f2b54447,transparent 25rem),radial-gradient(circle at 90% 15%,#087e7833,transparent 30rem),var(--paper);font:16px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{width:min(1120px,calc(100% - 32px));margin:auto;padding:28px 0 56px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px;font-weight:850}.mark{width:44px;height:44px;display:grid;place-items:center;color:#fff;background:var(--teal);border-radius:14px;box-shadow:0 8px 20px #087e783d}.brand small{display:block;color:var(--muted);font-weight:600;letter-spacing:.06em}.panel{background:#fffdf8eb;border:1px solid #ded9cde6;border-radius:var(--r);box-shadow:var(--shadow)}
    .login{min-height:560px;display:grid;grid-template-columns:1.05fr .95fr;overflow:hidden}.login-copy{padding:clamp(32px,6vw,72px);display:flex;flex-direction:column;justify-content:center}.eyebrow{color:var(--coral);font-weight:850;text-transform:uppercase;letter-spacing:.12em;font-size:.78rem}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(2.35rem,5vw,4.7rem);line-height:.98;letter-spacing:-.055em;margin:10px 0 22px}h1 span{color:var(--teal)}.lede{color:var(--muted);font-size:1.08rem}.pills{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 30px}.pill{padding:8px 12px;border-radius:999px;background:#eef4f1;color:var(--dark);font-weight:750;font-size:.88rem}.login-form{display:grid;gap:10px;max-width:480px}label{font-weight:800}input[type=text]{width:100%;padding:14px 16px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:13px;outline:0}input[type=text]:focus{border-color:var(--teal);box-shadow:0 0 0 4px #087e781f}.btn{border:0;border-radius:13px;padding:13px 18px;font-weight:850;color:#fff;background:var(--teal);transition:.16s}.btn:hover:not(:disabled){background:var(--dark);transform:translateY(-1px)}.btn:focus-visible,.option:focus-visible{outline:3px solid #f2b544cc;outline-offset:3px}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.secondary{color:var(--dark);background:#e9f3f0}.btn.ghost{color:var(--ink);background:transparent;border:1px solid var(--line)}.help{color:var(--muted);font-size:.84rem}
    .art{position:relative;overflow:hidden;min-height:430px;background:linear-gradient(145deg,var(--dark),#0c8b82 64%,#25a69a)}.code{position:absolute;width:min(400px,82%);padding:24px;color:#d7fff8;background:#0a2026d1;border:1px solid #ffffff26;border-radius:18px;box-shadow:0 26px 60px #0003;font:600 .9rem/1.8 ui-monospace,monospace}.code.one{top:14%;left:9%;transform:rotate(-3deg)}.code.two{right:7%;bottom:13%;transform:rotate(4deg)}.key{color:#ffce69}.call{color:#73e6d7}.note{color:#9eb8b8}.orb{position:absolute;border-radius:50%;background:#ffffff14}.orb.a{width:280px;height:280px;top:-100px;right:-70px}.orb.b{width:180px;height:180px;bottom:-60px;left:-50px}
    #app{display:none}.user{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:#dceee9;color:var(--dark);font-weight:900}.hero{padding:28px;margin-bottom:18px;background:linear-gradient(115deg,#073f3f,var(--teal));color:#fff;position:relative;overflow:hidden}.hero:after{content:"?";position:absolute;right:36px;top:-55px;font-weight:900;font-size:11rem;opacity:.08}.hero h2{margin-bottom:7px;font-size:clamp(1.65rem,3vw,2.4rem);letter-spacing:-.035em}.hero p{margin:0;color:#ccece7}.notice{margin-bottom:18px;padding:14px 16px;border-radius:12px;background:#eef7f5;border:1px solid #b8ddd6;color:var(--dark)}.notice.error{background:#ffeded;border-color:#efb0b0;color:#7f2828}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{padding:20px}.stat-label{color:var(--muted);font-weight:750;font-size:.88rem}.stat-value{font-size:clamp(1.65rem,3vw,2.35rem);line-height:1.15;margin-top:8px;font-weight:900}.stat-sub{color:var(--muted);font-size:.83rem;margin-top:6px}.best{background:linear-gradient(150deg,#fff8df,#fffdf8);border-color:#efdba1}.dash-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:16px}.chart-card,.history-card{padding:22px;min-width:0}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.section-head h3{margin:0;font-size:1.05rem}#chart{display:block;width:100%;height:230px}.empty{padding:34px 16px;text-align:center;color:var(--muted)}.history-wrap{max-height:270px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{padding:10px 8px;border-bottom:1px solid #ece7dc;text-align:left;white-space:nowrap}th{color:var(--muted);font-size:.76rem;text-transform:uppercase;letter-spacing:.06em}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0}.actions .spacer{flex:1}
    .quiz{display:none;padding:clamp(22px,5vw,46px)}.quiz.show,.result.show{display:block}.quiz-top{display:flex;justify-content:space-between;gap:14px;margin-bottom:12px}.qcount{font-weight:900;color:var(--dark)}.live{color:var(--muted);font-weight:750}.progress{height:8px;overflow:hidden;border-radius:99px;background:#e6e2d8;margin-bottom:30px}.progress div{height:100%;width:0;background:linear-gradient(90deg,var(--teal),#36ae9e)}.tag{display:inline-block;margin-bottom:12px;padding:5px 10px;border-radius:8px;background:#e9f3f0;color:var(--dark);font-size:.78rem;font-weight:850}.question{font-size:clamp(1.25rem,2.4vw,1.75rem);line-height:1.3;letter-spacing:-.025em;margin-bottom:16px}.hint-wrap{margin-bottom:18px}.hint{margin-top:10px;padding:12px 14px;border-left:4px solid var(--gold);border-radius:8px;background:#fff8df;color:#654b15}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{min-height:68px;display:flex;align-items:center;gap:12px;padding:14px 16px;color:var(--ink);text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px}.option:hover:not(:disabled){transform:translateY(-1px);border-color:var(--teal);background:#f4fbf9}.option:disabled{cursor:default;opacity:1}.option.correct{border-color:#57a878;background:#eaf7ee;color:#155e38}.option.wrong{border-color:#da7777;background:#fff0f0;color:#8f2929}.letter{flex:0 0 32px;height:32px;display:grid;place-items:center;border-radius:9px;background:#f0eee8;font-weight:900}.fill-form{grid-column:1/-1;display:flex;gap:10px;align-items:stretch}.fill-input{min-width:0;flex:1;padding:15px 16px;border:1.5px solid var(--line);border-radius:13px;outline:0;font:700 1rem/1.4 ui-monospace,monospace}.fill-input:focus{border-color:var(--teal);box-shadow:0 0 0 4px #087e781f}.fill-input.correct{border-color:#57a878;background:#eaf7ee}.fill-input.wrong{border-color:#da7777;background:#fff0f0}.feedback{display:none;margin-top:20px;padding:17px 18px;border-left:4px solid var(--teal);border-radius:10px;background:#eef7f5}.feedback.show{display:block}.feedback strong{display:block;margin-bottom:4px}.quiz-foot{display:flex;justify-content:flex-end;margin-top:22px}.result{display:none;padding:clamp(28px,6vw,60px);text-align:center}.result-emoji{font-size:4.6rem;line-height:1}.result h2{font-size:clamp(2rem,5vw,3.7rem);letter-spacing:-.045em;margin:14px 0 4px}.result-score,.save{color:var(--muted)}.record{display:none;width:fit-content;margin:18px auto 0;padding:9px 14px;border-radius:999px;background:#fff0c5;color:#765412;font-weight:900}.record.show{display:block}.save{margin:18px auto}.result-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.review{margin-top:30px;text-align:left}.review-item{padding:16px 0;border-top:1px solid var(--line)}.review-item p{margin:5px 0}.right{color:var(--good);font-weight:800}
    html[data-theme="purple"]{--ink:#2a2140;--muted:#6a5d7b;--paper:#f5f0fa;--card:#fff;--line:#cdbce0;--teal:#7650a3;--dark:#513174;--coral:#b13d68;--gold:#d39a2e;--good:#2d7253;--bad:#a7354a;--shadow:0 18px 50px #51317420;--bg-a:#eee6f7;--bg-b:#fbf9fd;--soft:#f0e9f8;--soft-line:#d6c3e8;--art:#a681c3;--hint-bg:#fff6d9;--best-bg:#fff5dd;--best-line:#dfc06d}
    html[data-theme="green"]{--ink:#17352f;--muted:#587269;--paper:#eef7f2;--card:#fff;--line:#b8d3c8;--teal:#3a8068;--dark:#245b49;--coral:#a63f59;--gold:#c99825;--good:#216b49;--bad:#a63f59;--shadow:0 18px 50px #245b491f;--bg-a:#e4f2e9;--bg-b:#f8fcf9;--soft:#e6f3ec;--soft-line:#b7d8c9;--art:#82b79d;--hint-bg:#fff6d9;--best-bg:#fff4df;--best-line:#dfbd69}
    html[data-theme="winter"]{--ink:#14263d;--muted:#53687e;--paper:#edf6fb;--card:#fff;--line:#bfd3e2;--teal:#167d8d;--dark:#163c66;--coral:#a7354a;--gold:#d29a20;--good:#23704a;--bad:#a7354a;--shadow:0 18px 50px #163c661c;--bg-a:#e5f2f9;--bg-b:#f7fbfd;--soft:#e7f4f7;--soft-line:#a9d1d8;--art:#9ecbda;--hint-bg:#fff7dc;--best-bg:#fff8e5;--best-line:#e4c777}
    html[data-theme="yellow"]{--ink:#263247;--muted:#687386;--paper:#fffaf0;--card:#fff;--line:#ddc77f;--teal:#9b7517;--dark:#324c69;--coral:#a73d59;--gold:#d5a51f;--good:#347052;--bad:#a73d59;--shadow:0 18px 50px #7155121f;--bg-a:#fff1bd;--bg-b:#fffdf6;--soft:#fff4cd;--soft-line:#dfc56d;--art:#d4af48;--hint-bg:#eef6f8;--best-bg:#e9f4f7;--best-line:#8ab9c7}
    html[data-theme]:not([data-theme="default"]) body{background:linear-gradient(180deg,var(--bg-a) 0,var(--bg-b) 45%,var(--paper) 100%)}html[data-theme]:not([data-theme="default"]) .panel{background:#ffffffed;border-color:var(--line)}html[data-theme]:not([data-theme="default"]) .art{background:linear-gradient(145deg,var(--dark),var(--teal) 68%,var(--art))}html[data-theme]:not([data-theme="default"]) .orb{display:none}html[data-theme]:not([data-theme="default"]) .hero{background:linear-gradient(115deg,var(--dark),var(--teal))}html[data-theme]:not([data-theme="default"]) .notice,html[data-theme]:not([data-theme="default"]) .feedback{background:var(--soft);border-color:var(--soft-line)}html[data-theme]:not([data-theme="default"]) .hint{background:var(--hint-bg);color:var(--ink)}html[data-theme]:not([data-theme="default"]) .best{background:var(--best-bg);border-color:var(--best-line)}html[data-theme]:not([data-theme="default"]) th,html[data-theme]:not([data-theme="default"]) td{border-color:var(--line)}
    @media(max-width:820px){.login{grid-template-columns:1fr}.art{min-height:320px}.stats,.dash-grid,.options{grid-template-columns:1fr}}@media(max-width:520px){.shell{width:calc(100% - 20px);padding-top:16px}.brand small,.user>span:not(.avatar){display:none}.login-copy{padding:28px 22px}.hero,.stat,.chart-card,.history-card{padding:18px}.quiz-top{flex-direction:column}.fill-form{flex-direction:column}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>

<body>
  <main class="shell">
    <header class="top"><div class="brand"><div class="mark">Q</div><div id="brandTitle">Lesson Quiz<small id="brandSub">REVIEW LAB</small></div></div><div class="user" id="user" hidden><span class="avatar" id="avatar">L</span><span id="userName"></span></div></header>
    <section class="panel login" id="login">
      <div class="login-copy"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="lede" id="subtitle"></p><div class="pills"><span class="pill" id="bankPill"></span><span class="pill" id="attemptPill"></span><span class="pill" id="storagePill"></span></div><form class="login-form" id="loginForm"><label for="name" id="nameLabel"></label><input id="name" type="text" autocomplete="name" maxlength="100" required><button class="btn" id="enter" type="submit"></button><div class="help" id="storageHelp"></div><div class="notice error" id="loginError" hidden></div></form></div>
      <div class="art" aria-hidden="true"><div class="orb a"></div><div class="orb b"></div><div class="code one"><span class="key">learn</span>.<span class="call">map</span>(idea =&gt; recall(idea))<br><span class="note">// practice makes progress</span></div><div class="code two"><span class="key">result</span> = <span class="call">challenge</span>(<span class="key">today</span>)</div></div>
    </section>
    <section id="app">
      <div class="panel hero"><h2 id="welcome"></h2><p id="encourage"></p></div><div class="notice" id="notice"></div>
      <div id="dashboard"><div class="stats"><article class="panel stat"><div class="stat-label" id="totalLabel"></div><div class="stat-value" id="total">0</div><div class="stat-sub" id="totalSub"></div></article><article class="panel stat"><div class="stat-label" id="latestLabel"></div><div class="stat-value" id="latest">—</div><div class="stat-sub" id="latestSub"></div></article><article class="panel stat best"><div class="stat-label" id="bestLabel"></div><div class="stat-value" id="best">—</div><div class="stat-sub" id="bestSub"></div></article></div>
        <div class="dash-grid"><article class="panel chart-card"><div class="section-head"><h3 id="trendLabel"></h3><span class="help">%</span></div><div class="empty" id="chartEmpty"></div><canvas id="chart"></canvas></article><article class="panel history-card"><div class="section-head"><h3 id="historyLabel"></h3><span class="help" id="historyCount"></span></div><div class="empty" id="historyEmpty"></div><div class="history-wrap" id="historyWrap" hidden><table><thead><tr><th id="timeHead"></th><th id="scoreHead"></th><th id="levelHead"></th></tr></thead><tbody id="historyBody"></tbody></table></div></article></div>
      </div>
      <div class="actions" id="mainActions"><button class="btn" id="start"></button><button class="btn secondary" id="importBtn"></button><button class="btn ghost" id="exportBtn"></button><input id="csvInput" type="file" accept=".csv,text/csv" hidden><div class="spacer"></div><button class="btn ghost" id="switchUser"></button></div>
      <section class="panel quiz" id="quiz" aria-live="polite"><div class="quiz-top"><div class="qcount" id="qcount"></div><div class="live" id="live"></div></div><div class="progress"><div id="bar"></div></div><span class="tag" id="topic"></span><h2 class="question" id="question"></h2><div class="hint-wrap" id="hintWrap"><button class="btn ghost" id="hintBtn" type="button"></button><div class="hint" id="hint" hidden></div></div><div class="options" id="options"></div><div class="feedback" id="feedback"><strong id="feedbackTitle"></strong><span id="feedbackText"></span></div><div class="quiz-foot"><button class="btn" id="next" disabled></button></div></section>
      <section class="panel result" id="result" aria-live="polite"><div class="result-emoji" id="resultEmoji"></div><h2 id="resultTitle"></h2><div class="result-score" id="resultScore"></div><div class="record" id="record"></div><div class="save" id="save"></div><div class="result-actions"><button class="btn" id="again"></button><button class="btn ghost" id="resultExport"></button><button class="btn ghost" id="back"></button></div><div class="review" id="review"></div></section>
    </section>
  </main>
  <script>
    const QUIZ={"meta":{"id":"pandas-sort-agg-reframe-transform-16-19-en","title":"Pandas: The Table Rescue Squad!","subtitle":"Sorting, ranking, aggregation, reframing and across-column transformations","attemptSize":20,"language":"en","theme":"winter","bankSize":50},"questions":[{"id":"q01","t":"16 - Sorting and ranking","q":"Captain Panda wants the highest scores first. Which command works for column score?","h":"First choose sorting by values, not index labels. Ascending puts low scores first; reverse that direction.","c":["df.sort_values(by='score', ascending=False)","df.sort_values(by='score', ascending=True)","df.sort_index(ascending=False)","df['score'].rank(ascending=True)"],"a":0,"e":"sort_values(by='score', ascending=False) orders whole rows by decreasing score: 95 comes before 92. ascending=True puts low scores first; sort_index uses labels; rank assigns places rather than rearranging rows. Doctor Oops may sort backwards to look like a winner, but the scores are not fooled!"},{"id":"q02","t":"16 - Sorting and ranking","q":"For (name,score): (Alice,85), (Bob,92), (Alice,78), what order results from sort_values(by=['name','score'], ascending=[False,True])?","h":"Sort names first: Bob comes before Alice in descending order. Only inside an equal-name group do scores get sorted ascending.","c":["Alice 85 → Bob 92 → Alice 78","Bob 92 → Alice 78 → Alice 85","Alice 78 → Alice 85 → Bob 92","Bob 92 → Alice 85 → Alice 78"],"a":1,"e":"by and ascending match position by position: name descending, then score ascending. Bob comes before both Alice rows; within Alice, 78 precedes 85. This is not a global score sort. Two keys mean two levels of priority—do not let the second floor drive the elevator!"},{"id":"q03","t":"16 - Sorting and ranking","type":"fill","q":"Fill in the method: df.___(axis=0, ascending=True) sorts row labels.","h":"The method name identifies what is sorted: the index. axis=0 selects the row axis.","answers":["sort_index"],"e":"sort_index(axis=0) sorts row labels while carrying each row's data along. It does not independently sort column values or compute ranks. sort_values instead sorts by specified values. Read the name tag before sending someone onto the podium!"},{"id":"q04","t":"16 - Sorting and ranking","q":"The initial index is [100,29,234,1,150]. What labels result from sort_index(axis=0)?","h":"The default is ascending. These are integers: compare numbers, not the strings '100' and '29'.","c":["[100,29,234,1,150]","[0,1,2,3,4]","[234,150,100,29,1]","[1,29,100,150,234]"],"a":3,"e":"The default ascending=True orders numeric labels from small to large. The existing labels remain; they are not replaced with 0..4. Each row travels with its label. Sorting house numbers does not issue new addresses!"},{"id":"q05","t":"16 - Sorting and ranking","q":"df has columns ['Numbers','Letters']. What does sort_index(axis=1, ascending=True) do?","h":"axis=1 chooses the column axis. The method looks at column names, not the values in Numbers.","c":["Reorders columns to ['Letters','Numbers']","Sorts rows by Numbers ascending","Resets the index to 0,1,2,...","Replaces all values with ranks"],"a":0,"e":"sort_index(axis=1) sorts column labels, so Letters precedes Numbers. It does not use cell values or reorder the rows. axis=0 would sort row labels. Same method, different axis—pick the right department!"},{"id":"q06","t":"16 - Sorting and ranking","q":"Scores are [85,92,85,88,90,66,66,66]. After score.rank(method='average'), which row remains physically first?","h":"rank returns a place associated with each existing row; it does not call sort_values for you.","c":["Rows are sorted alphabetically by name","The first row is still the one with score 85","A score-66 row automatically moves first","The score-92 row automatically moves first"],"a":1,"e":"rank computes ranks while preserving row order. The first item still corresponds to score 85, even though its ascending average rank is 4.5. To reorder rows, sort separately. Handing out medals does not rearrange the seats!"},{"id":"q07","t":"16 - Sorting and ranking","q":"Scores are [85,92,85,88,90,66,66,66]. With rank(method='average', ascending=True), what rank does each 66 receive?","h":"Three tied lowest values occupy positions 1,2,3. Average the positions, not the score values.","c":["3.0","66.0","2.0","1.0"],"a":2,"e":"The three 66s occupy ranks 1,2,3; average assigns (1+2+3)/3=2.0 to each. This is the average of occupied rank positions, not the average score or the minimum position. Three teammates share one number-2 podium!"},{"id":"q08","t":"16 - Sorting and ranking","q":"For [85,92,85,88,90,66,66,66], what ascending average rank do the two 85s receive?","h":"The three 66s occupy positions 1..3. The two 85s occupy positions 4 and 5.","c":["2.0","4.0","5.0","4.5"],"a":3,"e":"After the three 66s, the two 85s occupy positions 4 and 5. method='average' gives both (4+5)/2=4.5. min would give 4; max would give 5. A fractional rank is no emergency—Pandas is sharing the podium!"},{"id":"q09","t":"16 - Sorting and ranking","type":"fill","q":"Fill in method: score.rank(method='___') gives tied values the lowest rank position their group occupies.","h":"If a tied group occupies positions 4 and 5, you want both to get 4. The method name means smallest.","answers":["min"],"e":"method='min' chooses the smallest occupied rank position in a tie group. For the two 85s at positions 4 and 5, both receive 4. It does not return the smallest score; every row still gets a rank. Choose the front seat, not fewer passengers!"},{"id":"q10","t":"16 - Sorting and ranking","type":"fill","q":"Fill in method: score.rank(method='___') makes three tied lowest scores occupying positions 1,2,3 all receive rank 3.","h":"Choose the largest occupied position in the group. Distinguish choosing a rank position from choosing a score.","answers":["max"],"e":"method='max' assigns the highest rank position occupied by the group: max(1,2,3)=3. All three rows remain. This is not a maximum-score calculation. Picking the last seat in a tie group does not make the lowest scores champions!"},{"id":"q11","t":"16 - Sorting and ranking","q":"For [85,92,85,88,90,66,66,66], what rank does 85 receive with rank(method='dense', ascending=True)?","h":"List distinct score groups in order: 66,85,88,90,92. dense counts groups without leaving rank gaps for tied members.","c":["4.5","5.0","2.0","4.0"],"a":2,"e":"There are five value groups: 66 is group 1, 85 group 2, and 88 group 3. Dense ranks increase by one between groups. min leaves gaps because three rows share 66. Dense numbers the rooms consecutively instead of reserving rooms for duplicate guests!"},{"id":"q12","t":"16 - Sorting and ranking","q":"Three 66s appear as Freddy, George, Hannah in that order. Which ranks does rank(method='first', ascending=True) assign to them?","h":"first breaks ties by appearance order, not by alphabetical names.","c":["All three = 1","All three = 2","Freddy=3, George=2, Hannah=1","Freddy=1, George=2, Hannah=3"],"a":3,"e":"method='first' breaks the tie using existing row order: Freddy gets 1, George 2, Hannah 3. average gives all three 2; min gives all three 1. Reordering tied rows beforehand can change which one receives which first rank. Queue discipline still matters!"},{"id":"q13","t":"16 - Sorting and ranking","q":"If every score is distinct, how do average/min/max/dense/first compare with the same ascending setting?","h":"There are no ties to resolve. Each value occupies exactly one rank position.","c":["All methods produce the same ranks","Only dense differs from the other methods","average always produces ranks ending in .5","first discards later rows"],"a":0,"e":"With no tied values, each group has one row and one rank position. Its min, max and average are identical; dense and first also agree. These methods differ in how they handle ties. No ties, less work for the referee!"},{"id":"q14","t":"16 - Sorting and ranking","q":"Eight scores are distinct. A student has rank 4. What does rank(method='average', pct=True) return?","h":"For these eight valid values, divide rank by 8. The result is a proportion, not yet multiplied by 100.","c":["0.04","0.5","4.0","50.0"],"a":1,"e":"pct=True expresses the rank as a proportion: 4/8=0.5. To display 50%, format it as a percentage or multiply by 100 for a numeric percentage scale. Do not mistake 0.5 for half an exam point—it is a ranking scale!"},{"id":"q15","t":"16 - Sorting and ranking","q":"For scores [85,92,85,88,90,66,66,66], what does rank(method='dense', pct=True) return for 85?","h":"There are five distinct groups and 85 belongs to group 2. The dense denominator here is the group count, not the row count.","c":["0.5","0.5625","0.4","0.25"],"a":2,"e":"The dense rank of 85 is 2. With five distinct groups, its proportion is 2/5=0.4. Do not use 2/8: dense pct normalizes by the number of groups. 0.5625 is instead average rank 4.5 divided by 8. Same pct badge, different method rules!"},{"id":"q16","t":"16 - Sorting and ranking","q":"df_num contains numeric columns only. In which direction does df_num.rank(axis=0) rank values?","h":"axis=0 works down the rows within each column. Every column runs its own contest.","c":["Within each row, comparing columns","Only by comparing column names","By sorting index labels ascending","Within each column, comparing values between rows"],"a":3,"e":"rank(axis=0) compares values down each column separately. It does not compare column A with column B within a single row. This is the direction used in the lesson. DataFrame axis=1 is a different valid direction, not a universally forbidden option. Every contest needs the right playing field!"},{"id":"q17","t":"16 - Sorting and ranking","type":"fill","q":"Fill in True/False: score.rank(ascending=___) gives the largest score rank 1.","h":"Ascending ranks put the smallest value first by default. Reverse the direction for a high-score leaderboard.","answers":["False"],"e":"ascending=False puts the highest values at the start of the ranking scale. An untied highest score receives rank 1. ascending=True gives the lowest value the smallest rank. Whether a rank is good depends on what the values mean—not simply on a bigger rank number!"},{"id":"q18","t":"16 - Sorting and ranking","q":"out = df.sort_values('score', inplace=False). Which statement is correct?","h":"The result is received in out. Check whether the command requests an in-place update.","c":["out is a Series of ranks","out is sorted; this command does not modify df","df is sorted in place and out is None","Both df and out contain only score"],"a":1,"e":"inplace=False returns the sorted DataFrame to out, leaving df's order unchanged. With inplace=True, the method updates df and returns None, so do not write df = ...inplace=True. Put the result in the right box to avoid turning your DataFrame into None!"},{"id":"q19","t":"17 - Aggregation with agg","q":"df has numeric columns Height and Weight. What does df[['Height','Weight']].agg('mean') return?","h":"One reducing function produces one number per column. Two columns need two means, not every original row.","c":["A DataFrame retaining every original row","The two columns sorted ascending","A Series containing the mean of Height and the mean of Weight","One shared mean across both columns"],"a":2,"e":"DataFrame.agg('mean') summarizes each column by default, returning a Series indexed by Height and Weight. It does not mix centimeters and kilograms into one shared mean or retain every input row. The captain asked for a report, not the entire warehouse!"},{"id":"q20","t":"17 - Aggregation with agg","q":"s = pd.Series([2,4,6]). What is s.agg('mean')?","h":"Add the three values and divide by their count. A Series with one reducing mean function returns one number.","c":["12.0","3.0","[2,4,6]","4.0"],"a":3,"e":"The mean is (2+4+6)/3=4.0. Twelve is the sum; three is the count; the unchanged list is not a mean reduction. A Series with this single reducing function returns a scalar. Three ingredients, one tidy answer!"},{"id":"q21","t":"17 - Aggregation with agg","type":"fill","q":"Fill in the method: df[['Height','Weight']].___(['mean','median','std']) applies multiple aggregation functions.","h":"Use the short form of aggregation. A list of functions goes into this method; sorting does not calculate these statistics.","answers":["agg"],"e":"agg accepts the function list and returns rows mean, median and std with columns Height and Weight. Each cell contains that function's result for the corresponding column. It does not attach three summaries to every original observation. A statistics buffet: one dish per row!"},{"id":"q22","t":"17 - Aggregation with agg","q":"df_num has 2 numeric columns. What is the shape of df_num.agg(['min','max','mean'])?","h":"Three functions become three rows; the two input columns remain the report's two columns.","c":["Always the same shape as df_num","(3,2)","(2,3)","(1,6)"],"a":1,"e":"Three reducing functions applied to two columns produce 3 rows and 2 columns. Function names label rows; data-column names label columns. Do not mistake function count for column count. Predicting shape before running is a handy compass!"},{"id":"q23","t":"17 - Aggregation with agg","q":"How does df.agg({'Height':['min','max'], 'Weight':['mean']}) assign functions?","h":"A dictionary pairs each column name with its own functions. Do not automatically apply every function to every column.","c":["It only renames Height to min","It filters out rows with low Height","Height gets min/max; Weight gets mean","Every column gets min/max/mean"],"a":2,"e":"Each dictionary key names a column and its value specifies the requested function or functions. Height gets min/max; Weight gets only mean. The combined report uses the union of function names as rows. Give each department its own assignment!"},{"id":"q24","t":"17 - Aggregation with agg","q":"In agg({'Height':['min','max'],'Weight':['mean']}), cell row 'min', column 'Weight' is NaN. Must the original Weight data be missing?","h":"Check whether min was requested for Weight. A report cell can be empty because that calculation was not requested.","c":["Yes; every original Weight value is NaN","Yes; Weight must contain negative values","NaN means the minimum Weight equals zero","No; min was not requested for Weight"],"a":3,"e":"Only mean was requested for Weight. The min row exists because Height requested min, so min/Weight has no computed result and displays NaN. That does not prove the input contains missing values. An empty report box does not mean the warehouse is empty!"},{"id":"q25","t":"17 - Aggregation with agg","q":"Which command names the mean-of-Height result row mean_height, as in the lesson?","h":"Named aggregation puts the new label on the left and a (column, function) tuple on the right.","c":["df.agg(mean_height=('Height','mean'))","df.agg({'mean_height':'Height'})","df.sort_values('mean_height')","df.agg(mean_height=('mean','Height'))"],"a":0,"e":"df.agg(mean_height=('Height','mean')) specifies both the source column and function while naming the result row. Reversing the tuple confuses column and function. The new name improves report readability; it does not create a new value on every original row. Clear labels save exam-time brainpower!"},{"id":"q26","t":"17 - Aggregation with agg","q":"For s=[1,3,9], what is the median?","h":"Sort the three values and take the middle, rather than adding and dividing as for the mean.","c":["1","3","13/3","9"],"a":1,"e":"In sorted [1,3,9], the middle value is 3, so median=3. The mean is 13/3, max=9 and min=1. The lesson passes np.median into agg. Median is the person in the middle of the queue, not everyone splitting the bill!"},{"id":"q27","t":"17 - Aggregation with agg","q":"df_num has 2 columns. What results from agg(lambda col: np.quantile(col,q=[0.25,0.5,0.75,1])) followed by set_axis(['Q1','Q2','Q3','Q4'],axis=0)?","h":"Each column returns four quantiles. A function need not return only one scalar: count its output vector.","c":["A 2-row, 4-column table because it transposes automatically","Four copies of every original row","A table with 4 quantile rows and 2 columns","One scalar for the whole table"],"a":2,"e":"The quantile function returns four values for each column. Combining two such vectors gives a 4×2 table; set_axis(axis=0) labels the four rows. agg does not always return just one number. Four dishes need four places on the table!"},{"id":"q28","t":"17 - Aggregation with agg","q":"What is the key difference between agg('mean') and sort_values(...)?","h":"One reduces data into summaries; the other keeps observations and changes their order.","c":["Both only sort the index","agg always keeps all original rows; sort_values deletes rows","sort_values computes means automatically","agg computes statistics; sort_values orders rows"],"a":3,"e":"agg('mean') reduces selected columns to statistics. sort_values reorders rows by keys without aggregating them. Their output shapes and meanings therefore differ. Ask whether you need a lineup or a short report before choosing. Doctor Oops keeps mixing those jobs up!"},{"id":"q29","t":"18 - Reframing and result tables","q":"How is 'reframe' mainly implemented in the lesson?","h":"It names a technique for building output tables. Look for apply/pipe/DataFrame rather than inventing a new method.","c":["Using apply or pipe with a function returning results or a new table","Calling df.reframe() as a built-in Pandas method","Calling sort_index to change shape arbitrarily","Only renaming columns with rename"],"a":0,"e":"The lesson demonstrates reframing using columnwise apply or pipe combined with pd.DataFrame. It does not introduce a built-in df.reframe() method. The result may contain a different number of rows from the input. A technique's name is not always a library button!"},{"id":"q30","t":"18 - Reframing and result tables","type":"fill","q":"Fill in the number: df[['rm','lstat','medv']].apply(stats.shapiro, axis=___) processes each column.","h":"Each call receives a whole column spanning the rows. The lesson uses the columnwise axis=0 direction.","answers":["0"],"e":"axis=0 passes each column Series into the function. With the three selected columns, Shapiro is applied separately to rm, lstat and medv. It is not one call on the entire DataFrame or one call per row. Each column gets its own inspection!"},{"id":"q31","t":"18 - Reframing and result tables","q":"Each stats.shapiro call returns W and p-value. What shape does columnwise apply over 3 columns produce in the example?","h":"Two function results become two rows; the three source columns remain three columns. Count returned results before input observations.","c":["(3,2)","(1,1)","(2,3)","(506,3)"],"a":2,"e":"In the example, Shapiro returns two components and apply(axis=0) combines them for each source column. The resulting table has 2 rows and 3 columns. It is a test-results report, not the original observations table. Two numbers per column make a much tidier report!"},{"id":"q32","t":"18 - Reframing and result tables","type":"fill","q":"Fill in the method: result.___(['W-statistic','p-value'], axis=0) labels the two result rows.","h":"The two rows already exist; attach two labels to the row axis. Do not use set_index, which promotes a column to the index.","answers":["set_axis"],"e":"set_axis(axis=0) replaces the row labels with the supplied list. Two rows require two labels; values and shape stay unchanged. set_index promotes an existing column instead. Correct labels make the report much less mysterious!"},{"id":"q33","t":"18 - Reframing and result tables","q":"q=[0.25,0.5,0.75,1] is passed to np.quantile for each column. How many quantiles does each column return?","h":"Each q specifies one quantile level. 0.5 is the median, and 1 is the sample endpoint.","c":["4","1","3","Equal to the number of input data rows"],"a":0,"e":"There are four q levels, so each column returns four quantile values. For a finite numeric sample, q=1 gives its maximum. Do not confuse this probability vector with the column count or observation count. Four requested dishes, four portions!"},{"id":"q34","t":"18 - Reframing and result tables","q":"In df.pipe(lambda d: pd.DataFrame({...})), what is d?","h":"pipe passes the current object into the function. It does not automatically split the table into individual rows.","c":["Always an array containing only numbers","The current DataFrame passed into the function","One randomly selected row","A column name string"],"a":1,"e":"pipe passes the current DataFrame as the callable's first argument. The callable can calculate from d and construct a new pd.DataFrame; pipe returns that callable result. It supports chaining without imposing an output shape. Panda sends the whole folder to the workshop, not one random page!"},{"id":"q35","t":"18 - Reframing and result tables","q":"pipe builds a DataFrame with 3 columns, each a PPF vector of length 4, and an index of length 4. What is its shape?","h":"The new vectors and index determine row count. It need not match the original table's 506 rows.","c":["(3,4)","(4,506)","(4,3)","(506,3)"],"a":2,"e":"Three vectors of four elements form three columns and four rows: 4×3. The callable constructs a new table rather than assigning short vectors to 506 existing rows. To control a new shape, build the output explicitly. Do not squeeze a four-slot suitcase into a 506-seat train!"},{"id":"q36","t":"18 - Reframing and result tables","q":"In the lesson, what does PPF take as input and return as output?","h":"CDF maps a value to a probability. PPF reverses that direction.","c":["A column name in; a rank out","A value in; cumulative probability out","A DataFrame in; always a Boolean mask out","A probability q in; a value on the distribution's scale out"],"a":3,"e":"PPF is a distribution's quantile function: enter a probability such as 0.25 to obtain its corresponding value. CDF goes the other way, from a value to cumulative probability. The example specifies distributions for demonstration; it does not prove that the observed data follow them. Check the direction before boarding!"},{"id":"q37","t":"18 - Reframing and result tables","q":"The lesson shows inf for stats.norm.ppf(1), stats.expon.ppf(1) and stats.gamma.ppf(1,a=2). How should you interpret this?","h":"These example distributions have unbounded upper tails. Probability 1 is a boundary, unlike a finite sample's maximum.","c":["It is the infinite upper boundary quantile of these distributions","All original observations must be inf","PPF fails for every possible q","inf means a negative probability"],"a":0,"e":"At q=1, these three example distributions have upper quantile +inf. This boundary behavior does not mean observations are infinite or the function is broken. np.quantile at q=1 on a finite numeric sample instead gives the sample maximum. Model and sample quantiles travel different roads!"},{"id":"q38","t":"18 - Reframing and result tables","q":"stats.norm.ppf(0.25,loc=...,scale=...) gives 5.81. Does that prove exactly 25% of observed data lie below 5.81?","h":"Distinguish a quantile of the specified normal model from an empirical quantile calculated directly from observations.","c":["No, because PPF never returns finite values","No; 5.81 is a quantile of the specified distribution","Yes, exactly, for every possible sample","Yes, PPF sorts the observations and counts rows automatically"],"a":1,"e":"PPF uses the specified distribution and parameters, so 5.81 is the model's cumulative-probability-0.25 cutoff. It does not count the observed proportion below that cutoff; the sample proportion can differ. The lesson uses distribution assumptions to illustrate reframing. A model is a map—check the actual road too!"},{"id":"q39","t":"19 - Across-column transformations","q":"The lesson's min-max formula is (s-s.min())/(s.max()-s.min()). For s=[10,20,30], which result is correct?","h":"Subtract min=10 and divide by range 30-10=20. Try the middle item first: (20-10)/20.","c":["[0,1,2]","[1/3,2/3,1]","[0.0,0.5,1.0]","[10,20,30]"],"a":2,"e":"The calculations are 0/20, 10/20 and 20/20, giving 0,0.5,1. For a nonconstant column, this formula maps min to 0 and max to 1. It is not division by the sum or simply by the maximum. Resize the ruler without changing value order!"},{"id":"q40","t":"19 - Across-column transformations","q":"For s=[7,7,7], why does the original min-max function need an extra check?","h":"Calculate max-min first: both are 7. What warning does the denominator give?","c":["The result must be [1,1,1]","Pandas automatically removes the column","The column automatically becomes category","The denominator is zero, producing undefined values/NaN"],"a":3,"e":"max-min=7-7=0, and every numerator is zero too. The lesson's original function has no constant-column branch, so this numeric Series produces NaN. Choose an explicit handling rule for your purpose. This follows directly from the formula—do not divide by zero and ask Pandas to read your mind!"},{"id":"q41","t":"19 - Across-column transformations","q":"df_num has 5 rows and 2 nonconstant numeric columns. What shape does df_num.apply(min_max_scaler,axis=0) have?","h":"The function receives a column and returns a same-length Series. Count what it returns rather than guessing from apply's name.","c":["(5,2)","(1,2)","(2,5)","(5,1)"],"a":0,"e":"min_max_scaler transforms every value and returns a five-element Series for each column. Combining the two results keeps a 5×2 table. apply may preserve or reduce shape depending on its callable. Same machine, different attachment, different product!"},{"id":"q42","t":"19 - Across-column transformations","q":"df_num contains only numeric columns. What does df_num.apply(np.mean,axis=0) return?","h":"np.mean returns one scalar per column Series. The same apply method now uses a reducing function.","c":["A mean column automatically added to df_num","A Series containing the mean of each column","A normalized DataFrame retaining all original rows","A mean of the column names"],"a":1,"e":"apply(axis=0) passes each column to np.mean. Since every call returns one number, the combined result is a Series indexed by column names. Nothing is automatically assigned into the original table. The difference from vector-returning min-max lies in the callable, not the word apply!"},{"id":"q43","t":"19 - Across-column transformations","type":"fill","q":"Fill in the method: df.___(include=np.number).columns gets numeric column names.","h":"Select columns by dtype first, then use .columns for their labels. Do not look for digits in column names.","answers":["select_dtypes"],"e":"select_dtypes(include=np.number) selects columns with numeric dtypes; .columns retrieves their labels for iteration. A numeric-looking column name does not determine dtype. This chooses the right targets before np.log is applied. Inspect qualifications before assigning jobs!"},{"id":"q44","t":"19 - Across-column transformations","q":"In df.assign(**{col: np.log(df[col]) for col in numeric_cols}), what does ** do?","h":"The dictionary maps column names to computed results. assign needs those pairs as keyword arguments.","c":["Squares every value","Doubles the number of rows","Automatically renames every column with a number","Unpacks the dictionary into column-name keyword arguments"],"a":3,"e":"Here ** unpacks dictionary key:value pairs as keyword arguments to assign. Each key names a column and each value provides replacement data. It is not exponentiation in this argument-unpacking context. Two stars can have different jobs—check where they are standing!"},{"id":"q45","t":"19 - Across-column transformations","q":"df contains numeric Height and string Name. Only numeric_cols appear in the assign dictionary using np.log. What happens to Name?","h":"assign updates the named columns and keeps others. No step selects only numeric_cols as the complete output.","c":["Name remains present with unchanged values","Name is removed from the table","Name is forced through log and becomes NaN","Name automatically becomes the index"],"a":0,"e":"Only numeric columns appear in the update dictionary, so assign updates those in the result while retaining Name unchanged. select_dtypes here decides what to modify, not which columns survive in the final table. The support crew stays on the team even without a log transformation!"},{"id":"q46","t":"19 - Across-column transformations","q":"What does if col != 'Name' do in the lowercase comprehension?","h":"col is the current column label, not an individual cell. The condition chooses which updates enter the dictionary.","c":["Lowercases only Name","Skips Name when building lowercase updates","Deletes all rows with the name Name","Converts Name to numbers"],"a":1,"e":"if col != 'Name' checks the column label and excludes Name from the update dictionary. Other selected columns receive .str.lower(); the entire Name column still exists in the result. Being exempt from a transformation is not being expelled from the table!"},{"id":"q47","t":"19 - Across-column transformations","type":"fill","q":"Fill in the method: df[col].str.___() converts letters to lowercase.","h":"The .str accessor opens string tools. Choose the operation opposite to upper.","answers":["lower"],"e":".str.lower() changes values such as 'BAL' to 'bal' and 'Catcher' to 'catcher'. It does not rename the column or promise to preserve category dtype; inspect the output if dtype matters. Lowercase is a quieter voice, not a new column identity!"},{"id":"q48","t":"19 - Across-column transformations","q":"df has Text with dtype object, Category with dtype category and Num with dtype int. Which columns does select_dtypes(include=['object','category']) select?","h":"Match the stated dtypes: object and category are included. Num is numeric and is not on this list.","c":["Only Num","All three columns","Only Category","Text and Category"],"a":3,"e":"include selects matching dtypes, so Text and Category are selected, while Num is not. The lesson mentions object/category and demonstrates string/category; match the actual column dtypes. After selection, .str operations still require suitable string-like values. Read the qualifications before handing out tools!"},{"id":"q49","t":"19 - Across-column transformations","q":"In df.pipe(lambda d: d.assign(**{col: np.log(d[col]) for col in d.select_dtypes(include=np.number).columns})), what does the lambda return?","h":"Unwrap it: select_dtypes chooses calculation targets, the dictionary holds updates, and assign creates the result table.","c":["A DataFrame with logged numeric columns and other columns retained","Only a dictionary of column names","One log value for the entire table","A list containing only numeric column names"],"a":0,"e":"pipe returns the lambda's result. That lambda returns d.assign(...), so the output is a DataFrame with numeric columns logged and other columns retained. pipe does not necessarily reduce data or return only updated columns. Follow the final return value to find the way home!"},{"id":"q50","t":"19 - Across-column transformations","q":"Doctor Oops says, 'apply always preserves shape!' Which example from the lesson disproves that?","h":"Compare min-max, which returns many values, with mean, which returns one. The method name alone does not determine output shape.","c":["df_num.sort_index()","df_num.apply(np.mean,axis=0) reduces each column to one number","df_num.apply(min_max_scaler,axis=0) on nonconstant columns","df_num.copy()"],"a":1,"e":"apply(np.mean,axis=0) returns a summary Series rather than the original multirow table, disproving 'always'. Min-max can preserve shape because it returns same-length vectors; copy and sort_index are not counterexamples involving apply. The golden question is: scalar, vector or table? Panda wins by asking! "}]};

    const T=I18N[QUIZ.meta.language]||I18N.en,$=id=>document.getElementById(id),S={name:"",history:[],quiz:[],index:0,correct:0,answers:[],locked:false};
    document.documentElement.lang=QUIZ.meta.language||"en";document.documentElement.dataset.theme=QUIZ.meta.theme||"default";document.title=QUIZ.meta.title;$("brandTitle").childNodes[0].nodeValue=QUIZ.meta.title;$("title").textContent=QUIZ.meta.title;$("subtitle").textContent=QUIZ.meta.subtitle;$("eyebrow").textContent=T.eyebrow;$("nameLabel").textContent=T.name;$("name").placeholder=T.namePh;$("enter").textContent=T.enter;$("bankPill").textContent=T.bank(QUIZ.meta.bankSize);$("attemptPill").textContent=T.attempt(QUIZ.meta.attemptSize);$("storagePill").textContent=T.storage;$("storageHelp").textContent=T.storageHelp;
    [["totalLabel",T.total],["latestLabel",T.latest],["bestLabel",T.best],["trendLabel",T.trend],["historyLabel",T.history],["timeHead",T.time],["scoreHead",T.score],["levelHead",T.level],["start",T.start(QUIZ.meta.attemptSize)],["importBtn",T.import],["exportBtn",T.export],["switchUser",T.switchUser],["again",T.again],["resultExport",T.export],["back",T.back]].forEach(([id,v])=>$(id).textContent=v);$("totalSub").textContent=T.attemptDone(QUIZ.meta.attemptSize);$("chartEmpty").textContent=T.chartEmpty;$("historyEmpty").textContent=T.historyEmpty;
    const shuffle=a=>{a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},pct=n=>Number.isInteger(n)?String(n):n.toFixed(2).replace(/0+$/,"").replace(/\.$/,""),level=p=>T.levels.find(x=>p>=x.min),key=()=>`lesson-quiz::${QUIZ.meta.id}::${S.name.normalize("NFC").toLocaleLowerCase()}`;
    function load(){try{const x=JSON.parse(localStorage.getItem(key())||"[]");return Array.isArray(x)?x:[]}catch{return[]}}function save(){localStorage.setItem(key(),JSON.stringify(S.history))}function stamp(){const d=new Date(),p=(n,w=2)=>String(n).padStart(w,"0"),base=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;if(!S.history.some(x=>x.time===base))return base;let v=`${base}.${p(d.getMilliseconds(),3)}`,n=2;while(S.history.some(x=>x.time===v))v=`${base}.${p(d.getMilliseconds(),3)}-${n++}`;return v}
    function esc(v){v=String(v);return/[",\r\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v}function csv(){return"\uFEFF"+["Name",...S.history.map(x=>x.time)].map(esc).join(",")+"\r\n"+[S.name,...S.history.map(x=>`${x.correct}/${x.total} (${pct(x.percent)}%) - ${x.label}`)].map(esc).join(",")+"\r\n"}function parseCsv(text){text=text.replace(/^\uFEFF/,"");const rows=[];let row=[],cell="",q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}else if(c==='"')q=true;else if(c===","){row.push(cell);cell=""}else if(c==="\n"){row.push(cell.replace(/\r$/,"") );rows.push(row);row=[];cell=""}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}if(q||rows.length!==2||rows[1][0]!==S.name||rows[0].length!==rows[1].length)throw Error(T.badCsv);return rows[0].slice(1).map((time,i)=>{const m=rows[1][i+1].match(/^(\d+)\/(\d+) \(([\d.]+)%\) - (.+)$/);if(!m)throw Error(T.badCsv);return{time,correct:+m[1],total:+m[2],percent:+m[3],label:m[4]}})}
    $("loginForm").addEventListener("submit",e=>{e.preventDefault();S.name=$("name").value.trim();if(!S.name)return;S.history=load();$("login").style.display="none";$("app").style.display="block";$("user").hidden=false;$("userName").textContent=S.name;$("avatar").textContent=S.name[0].toUpperCase();$("welcome").textContent=T.welcome(S.name);$("encourage").textContent=T.encourage;$("notice").textContent=T.notice;renderDash()});$("switchUser").onclick=()=>location.reload();
    function renderDash(){const h=S.history;$("total").textContent=h.length;$("historyCount").textContent=`${h.length}`;if(!h.length){$("latest").textContent=$("best").textContent="—";$("latestSub").textContent=T.noData;$("bestSub").textContent=T.firstMilestone;$("chart").style.display="none";$("chartEmpty").style.display="block";$("historyWrap").hidden=true;$("historyEmpty").style.display="block";return}const last=h.at(-1),best=h.reduce((a,b)=>b.percent>a.percent?b:a);$("latest").textContent=`${last.correct}/${last.total}`;$("latestSub").textContent=`${pct(last.percent)}% · ${last.label}`;$("best").textContent=`${best.correct}/${best.total}`;$("bestSub").textContent=`${pct(best.percent)}% · ${best.label}`;$("historyBody").replaceChildren(...[...h].reverse().map(x=>{const tr=document.createElement("tr");[x.time,`${x.correct}/${x.total} · ${pct(x.percent)}%`,x.label].forEach(v=>{const td=document.createElement("td");td.textContent=v;tr.append(td)});return tr}));$("chartEmpty").style.display="none";$("chart").style.display="block";$("historyEmpty").style.display="none";$("historyWrap").hidden=false;requestAnimationFrame(draw)}
    function draw(){const c=$("chart");if(!S.history.length)return;const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;const x=c.getContext("2d");x.scale(d,d);const w=r.width,h=r.height,p={l:38,r:15,t:15,b:30};x.font="12px system-ui";x.fillStyle="#718087";x.strokeStyle="#e4dfd5";[0,25,50,75,100].forEach(v=>{const y=p.t+(100-v)/100*(h-p.t-p.b);x.beginPath();x.moveTo(p.l,y);x.lineTo(w-p.r,y);x.stroke();x.fillText(v,7,y+4)});const pts=S.history.map((v,i)=>({x:S.history.length===1?(p.l+w-p.r)/2:p.l+i*(w-p.l-p.r)/(S.history.length-1),y:p.t+(100-v.percent)/100*(h-p.t-p.b)}));if(pts.length>1){x.beginPath();pts.forEach((v,i)=>i?x.lineTo(v.x,v.y):x.moveTo(v.x,v.y));x.strokeStyle="#087e78";x.lineWidth=3;x.stroke()}pts.forEach((v,i)=>{x.beginPath();x.arc(v.x,v.y,5,0,Math.PI*2);x.fillStyle=i===pts.length-1?"#e56b4d":"#087e78";x.fill()})}window.addEventListener("resize",()=>requestAnimationFrame(draw));
    function select(){const groups=[...new Set(QUIZ.questions.map(q=>q.t))].map(t=>shuffle(QUIZ.questions.filter(q=>q.t===t))),out=[];while(out.length<QUIZ.meta.attemptSize){let added=false;for(const g of shuffle(groups)){if(g.length&&out.length<QUIZ.meta.attemptSize){const q=g.pop(),opts=q.type==="fill"?null:shuffle(q.c.map((text,i)=>({text,ok:i===q.a})));out.push({...q,opts});added=true}}if(!added)break}return shuffle(out)}
    function start(){S.quiz=select();S.index=S.correct=0;S.answers=[];$("dashboard").style.display="none";$("mainActions").style.display="none";$("result").classList.remove("show");$("quiz").classList.add("show");renderQ();scrollTo({top:0})}$("start").onclick=$("again").onclick=start;
    function renderQ(){const q=S.quiz[S.index];S.locked=false;$("qcount").textContent=T.question(S.index+1,S.quiz.length);$("live").textContent=T.correct(S.correct);$("bar").style.width=`${S.index/S.quiz.length*100}%`;$("topic").textContent=q.t;$("question").textContent=q.q;$("hintWrap").hidden=!q.h;$("hint").hidden=true;$("hint").textContent=q.h||"";$("hintBtn").textContent=T.hint;$("feedback").classList.remove("show");$("next").disabled=true;$("next").textContent=S.index===S.quiz.length-1?T.results:T.next;if(q.type==="fill"){const form=document.createElement("form"),input=document.createElement("input"),button=document.createElement("button");form.className="fill-form";input.className="fill-input";input.type="text";input.placeholder=T.fillPh;input.autocomplete="off";input.required=true;button.className="btn";button.type="submit";button.textContent=T.check;form.onsubmit=e=>{e.preventDefault();answerFill(input.value,input,button)};form.append(input,button);$("options").replaceChildren(form);requestAnimationFrame(()=>input.focus())}else $("options").replaceChildren(...q.opts.map((o,i)=>{const b=document.createElement("button");b.className="option";b.type="button";b.dataset.ok=o.ok;b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span>`;b.append(document.createTextNode(o.text));b.onclick=()=>answer(o,b);return b}))}$("hintBtn").onclick=()=>{const h=$("hint");h.hidden=!h.hidden;$("hintBtn").textContent=h.hidden?T.hint:T.hideHint};

    function answer(o,chosen){if(S.locked)return;S.locked=true;const q=S.quiz[S.index];[...$("options").children].forEach(b=>{b.disabled=true;if(b.dataset.ok==="true")b.classList.add("correct")});if(!o.ok)chosen.classList.add("wrong");showFeedback(o.ok,q,o.text,q.c[q.a])}
    function answerFill(value,input,button){if(S.locked)return;const picked=value.trim();if(!picked){input.focus();return}S.locked=true;const clean=v=>String(v).trim().replace(/^`|`$/g,"").replace(/\s+/g," ").toLocaleLowerCase(),q=S.quiz[S.index],ok=q.answers.some(a=>clean(a)===clean(picked));input.disabled=button.disabled=true;input.classList.add(ok?"correct":"wrong");showFeedback(ok,q,picked,q.answers[0])}$("next").onclick=()=>{if(!S.locked)return;if(++S.index<S.quiz.length)renderQ();else finish()};
    function finish(){const percent=S.correct/S.quiz.length*100,l=level(percent),old=S.history.length?Math.max(...S.history.map(x=>x.percent)):-1;S.history.push({time:stamp(),correct:S.correct,total:S.quiz.length,percent,label:`${l.emoji} ${l.title}`});try{save();$("save").textContent=T.saved}catch{$("save").textContent=T.storageHelp}$("quiz").classList.remove("show");$("result").classList.add("show");$("resultEmoji").textContent=l.emoji;$("resultTitle").textContent=l.title;$("resultScore").textContent=T.result(S.correct,S.quiz.length,pct(percent));$("record").textContent=T.record;$("record").classList.toggle("show",percent>=old);const wrong=S.answers.filter(x=>!x.ok);$("review").replaceChildren();const h=document.createElement("h3");h.textContent=wrong.length?T.review(wrong.length):T.perfect;$("review").append(h);wrong.forEach((x,i)=>{const d=document.createElement("div");d.className="review-item";const q=document.createElement("strong"),p=document.createElement("p"),a=document.createElement("p"),e=document.createElement("p");q.textContent=`${i+1}. ${x.q}`;p.textContent=`${T.picked}: ${x.picked}`;a.textContent=`${T.answer}: ${x.answer}`;a.className="right";e.textContent=x.e;d.append(q,p,a,e);$("review").append(d)});scrollTo({top:0})}
    $("back").onclick=()=>{$("result").classList.remove("show");$("dashboard").style.display="block";$("mainActions").style.display="flex";renderDash();scrollTo({top:0})};function download(){if(!S.history.length){$("notice").textContent=T.noExport;return}const u=URL.createObjectURL(new Blob([csv()],{type:"text/csv;charset=utf-8"})),a=document.createElement("a");a.href=u;a.download=`${S.name.replace(/[<>:"/\\|?*]/g,"_")}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$("exportBtn").onclick=$("resultExport").onclick=download;$("importBtn").onclick=()=>$("csvInput").click();$("csvInput").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;try{const imported=parseCsv(await f.text()),m=new Map(S.history.map(x=>[x.time,x]));imported.forEach(x=>m.set(x.time,x));S.history=[...m.values()].sort((a,b)=>a.time.localeCompare(b.time));save();renderDash();$("notice").textContent=T.imported(imported.length,f.name);$("notice").className="notice"}catch(err){$("notice").textContent=err.message;$("notice").className="notice error"}};
