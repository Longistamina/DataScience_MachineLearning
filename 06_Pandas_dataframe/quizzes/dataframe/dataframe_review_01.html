  <title>Lesson Review Quiz</title>
  <style>
    :root{--ink:#17232b;--muted:#63727b;--paper:#f7f4ed;--card:#fffdf8;--line:#ded9cd;--teal:#087e78;--dark:#055d59;--coral:#e56b4d;--gold:#f2b544;--good:#267a4b;--bad:#b23b3b;--shadow:0 18px 50px #182a2f1f;--r:22px}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 8% 5%,#f2b54447,transparent 25rem),radial-gradient(circle at 90% 15%,#087e7833,transparent 30rem),var(--paper);font:16px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{width:min(1120px,calc(100% - 32px));margin:auto;padding:28px 0 56px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px;font-weight:850}.mark{width:44px;height:44px;display:grid;place-items:center;color:#fff;background:var(--teal);border-radius:14px;box-shadow:0 8px 20px #087e783d}.brand small{display:block;color:var(--muted);font-weight:600;letter-spacing:.06em}.panel{background:#fffdf8eb;border:1px solid #ded9cde6;border-radius:var(--r);box-shadow:var(--shadow)}
    .login{min-height:560px;display:grid;grid-template-columns:1.05fr .95fr;overflow:hidden}.login-copy{padding:clamp(32px,6vw,72px);display:flex;flex-direction:column;justify-content:center}.eyebrow{color:var(--coral);font-weight:850;text-transform:uppercase;letter-spacing:.12em;font-size:.78rem}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(2.35rem,5vw,4.7rem);line-height:.98;letter-spacing:-.055em;margin:10px 0 22px}h1 span{color:var(--teal)}.lede{color:var(--muted);font-size:1.08rem}.pills{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 30px}.pill{padding:8px 12px;border-radius:999px;background:#eef4f1;color:var(--dark);font-weight:750;font-size:.88rem}.login-form{display:grid;gap:10px;max-width:480px}label{font-weight:800}input[type=text]{width:100%;padding:14px 16px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:13px;outline:0}input[type=text]:focus{border-color:var(--teal);box-shadow:0 0 0 4px #087e781f}.btn{border:0;border-radius:13px;padding:13px 18px;font-weight:850;color:#fff;background:var(--teal);transition:.16s}.btn:hover:not(:disabled){background:var(--dark);transform:translateY(-1px)}.btn:focus-visible,.option:focus-visible{outline:3px solid #f2b544cc;outline-offset:3px}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.secondary{color:var(--dark);background:#e9f3f0}.btn.ghost{color:var(--ink);background:transparent;border:1px solid var(--line)}.help{color:var(--muted);font-size:.84rem}
    .art{position:relative;overflow:hidden;min-height:430px;background:linear-gradient(145deg,var(--dark),#0c8b82 64%,#25a69a)}.code{position:absolute;width:min(400px,82%);padding:24px;color:#d7fff8;background:#0a2026d1;border:1px solid #ffffff26;border-radius:18px;box-shadow:0 26px 60px #0003;font:600 .9rem/1.8 ui-monospace,monospace}.code.one{top:14%;left:9%;transform:rotate(-3deg)}.code.two{right:7%;bottom:13%;transform:rotate(4deg)}.key{color:#ffce69}.call{color:#73e6d7}.note{color:#9eb8b8}.orb{position:absolute;border-radius:50%;background:#ffffff14}.orb.a{width:280px;height:280px;top:-100px;right:-70px}.orb.b{width:180px;height:180px;bottom:-60px;left:-50px}
    #app{display:none}.user{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:#dceee9;color:var(--dark);font-weight:900}.hero{padding:28px;margin-bottom:18px;background:linear-gradient(115deg,#073f3f,var(--teal));color:#fff;position:relative;overflow:hidden}.hero:after{content:"?";position:absolute;right:36px;top:-55px;font-weight:900;font-size:11rem;opacity:.08}.hero h2{margin-bottom:7px;font-size:clamp(1.65rem,3vw,2.4rem);letter-spacing:-.035em}.hero p{margin:0;color:#ccece7}.notice{margin-bottom:18px;padding:14px 16px;border-radius:12px;background:#eef7f5;border:1px solid #b8ddd6;color:var(--dark)}.notice.error{background:#ffeded;border-color:#efb0b0;color:#7f2828}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{padding:20px}.stat-label{color:var(--muted);font-weight:750;font-size:.88rem}.stat-value{font-size:clamp(1.65rem,3vw,2.35rem);line-height:1.15;margin-top:8px;font-weight:900}.stat-sub{color:var(--muted);font-size:.83rem;margin-top:6px}.best{background:linear-gradient(150deg,#fff8df,#fffdf8);border-color:#efdba1}.dash-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:16px}.chart-card,.history-card{padding:22px;min-width:0}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.section-head h3{margin:0;font-size:1.05rem}#chart{display:block;width:100%;height:230px}.empty{padding:34px 16px;text-align:center;color:var(--muted)}.history-wrap{max-height:270px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{padding:10px 8px;border-bottom:1px solid #ece7dc;text-align:left;white-space:nowrap}th{color:var(--muted);font-size:.76rem;text-transform:uppercase;letter-spacing:.06em}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0}.actions .spacer{flex:1}
    .quiz{display:none;padding:clamp(22px,5vw,46px)}.quiz.show,.result.show{display:block}.quiz-top{display:flex;justify-content:space-between;gap:14px;margin-bottom:12px}.qcount{font-weight:900;color:var(--dark)}.live{color:var(--muted);font-weight:750}.progress{height:8px;overflow:hidden;border-radius:99px;background:#e6e2d8;margin-bottom:30px}.progress div{height:100%;width:0;background:linear-gradient(90deg,var(--teal),#36ae9e)}.tag{display:inline-block;margin-bottom:12px;padding:5px 10px;border-radius:8px;background:#e9f3f0;color:var(--dark);font-size:.78rem;font-weight:850}.question{font-size:clamp(1.25rem,2.4vw,1.75rem);line-height:1.3;letter-spacing:-.025em;margin-bottom:16px}.hint-wrap{margin-bottom:18px}.hint{margin-top:10px;padding:12px 14px;border-left:4px solid var(--gold);border-radius:8px;background:#fff8df;color:#654b15}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{min-height:68px;display:flex;align-items:center;gap:12px;padding:14px 16px;color:var(--ink);text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px}.option:hover:not(:disabled){transform:translateY(-1px);border-color:var(--teal);background:#f4fbf9}.option:disabled{cursor:default;opacity:1}.option.correct{border-color:#57a878;background:#eaf7ee;color:#155e38}.option.wrong{border-color:#da7777;background:#fff0f0;color:#8f2929}.letter{flex:0 0 32px;height:32px;display:grid;place-items:center;border-radius:9px;background:#f0eee8;font-weight:900}.feedback{display:none;margin-top:20px;padding:17px 18px;border-left:4px solid var(--teal);border-radius:10px;background:#eef7f5}.feedback.show{display:block}.feedback strong{display:block;margin-bottom:4px}.quiz-foot{display:flex;justify-content:flex-end;margin-top:22px}.result{display:none;padding:clamp(28px,6vw,60px);text-align:center}.result-emoji{font-size:4.6rem;line-height:1}.result h2{font-size:clamp(2rem,5vw,3.7rem);letter-spacing:-.045em;margin:14px 0 4px}.result-score,.save{color:var(--muted)}.record{display:none;width:fit-content;margin:18px auto 0;padding:9px 14px;border-radius:999px;background:#fff0c5;color:#765412;font-weight:900}.record.show{display:block}.save{margin:18px auto}.result-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.review{margin-top:30px;text-align:left}.review-item{padding:16px 0;border-top:1px solid var(--line)}.review-item p{margin:5px 0}.right{color:var(--good);font-weight:800}
    @media(max-width:820px){.login{grid-template-columns:1fr}.art{min-height:320px}.stats,.dash-grid,.options{grid-template-columns:1fr}}@media(max-width:520px){.shell{width:calc(100% - 20px);padding-top:16px}.brand small,.user>span:not(.avatar){display:none}.login-copy{padding:28px 22px}.hero,.stat,.chart-card,.history-card{padding:18px}.quiz-top{flex-direction:column}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand"><div class="mark">Q</div><div id="brandTitle">Lesson Quiz<small id="brandSub">REVIEW LAB</small></div></div><div class="user" id="user" hidden><span class="avatar" id="avatar">L</span><span id="userName"></span></div></header>
    <section class="panel login" id="login">
      <div class="login-copy"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="lede" id="subtitle"></p><div class="pills"><span class="pill" id="bankPill"></span><span class="pill" id="attemptPill"></span><span class="pill" id="storagePill"></span></div><form class="login-form" id="loginForm"><label for="name" id="nameLabel"></label><input id="name" type="text" autocomplete="name" maxlength="100" required><button class="btn" id="enter" type="submit"></button><div class="help" id="storageHelp"></div><div class="notice error" id="loginError" hidden></div></form></div>
      <div class="art" aria-hidden="true"><div class="orb a"></div><div class="orb b"></div><div class="code one"><span class="key">learn</span>.<span class="call">map</span>(idea =&gt; recall(idea))<br><span class="note">// practice makes progress</span></div><div class="code two"><span class="key">result</span> = <span class="call">challenge</span>(<span class="key">today</span>)</div></div>
    </section>
    <section id="app">
      <div class="panel hero"><h2 id="welcome"></h2><p id="encourage"></p></div><div class="notice" id="notice"></div>
      <div id="dashboard"><div class="stats"><article class="panel stat"><div class="stat-label" id="totalLabel"></div><div class="stat-value" id="total">0</div><div class="stat-sub" id="totalSub"></div></article><article class="panel stat"><div class="stat-label" id="latestLabel"></div><div class="stat-value" id="latest">—</div><div class="stat-sub" id="latestSub"></div></article><article class="panel stat best"><div class="stat-label" id="bestLabel"></div><div class="stat-value" id="best">—</div><div class="stat-sub" id="bestSub"></div></article></div>
        <div class="dash-grid"><article class="panel chart-card"><div class="section-head"><h3 id="trendLabel"></h3><span class="help">%</span></div><div class="empty" id="chartEmpty"></div><canvas id="chart"></canvas></article><article class="panel history-card"><div class="section-head"><h3 id="historyLabel"></h3><span class="help" id="historyCount"></span></div><div class="empty" id="historyEmpty"></div><div class="history-wrap" id="historyWrap" hidden><table><thead><tr><th id="timeHead"></th><th id="scoreHead"></th><th id="levelHead"></th></tr></thead><tbody id="historyBody"></tbody></table></div></article></div>
      </div>
      <div class="actions" id="mainActions"><button class="btn" id="start"></button><button class="btn secondary" id="importBtn"></button><button class="btn ghost" id="exportBtn"></button><input id="csvInput" type="file" accept=".csv,text/csv" hidden><div class="spacer"></div><button class="btn ghost" id="switchUser"></button></div>
      <section class="panel quiz" id="quiz" aria-live="polite"><div class="quiz-top"><div class="qcount" id="qcount"></div><div class="live" id="live"></div></div><div class="progress"><div id="bar"></div></div><span class="tag" id="topic"></span><h2 class="question" id="question"></h2><div class="hint-wrap" id="hintWrap"><button class="btn ghost" id="hintBtn" type="button"></button><div class="hint" id="hint" hidden></div></div><div class="options" id="options"></div><div class="feedback" id="feedback"><strong id="feedbackTitle"></strong><span id="feedbackText"></span></div><div class="quiz-foot"><button class="btn" id="next" disabled></button></div></section>
      <section class="panel result" id="result" aria-live="polite"><div class="result-emoji" id="resultEmoji"></div><h2 id="resultTitle"></h2><div class="result-score" id="resultScore"></div><div class="record" id="record"></div><div class="save" id="save"></div><div class="result-actions"><button class="btn" id="again"></button><button class="btn ghost" id="resultExport"></button><button class="btn ghost" id="back"></button></div><div class="review" id="review"></div></section>
    </section>
  </main>
  <script>
    const QUIZ={"meta":{"id":"pandas-dataframe-review-01-04-en","title":"Pandas DataFrame Review: Lessons 01-04","subtitle":"Build, load, inspect, and understand DataFrames without summoning spreadsheet panic","attemptSize":20,"language":"en","bankSize":50},"questions":[{"id":"q01","t":"01 - Creating DataFrames","q":"When you create a DataFrame from a dictionary, what do the dictionary keys usually become?","h":"Imagine each key sitting above a vertical stack of values.","c":["Column names","Row numbers","Missing values","Data types"],"a":0,"e":"Dictionary keys become column names, and their values supply the column data. Nice and tidy: the key gets the tiny office sign above the column."},{"id":"q02","t":"01 - Creating DataFrames","q":"Two Series have index labels [a, b, c] and [a, b, c, d]. What index will their DataFrame use?","h":"pandas cares about labels here, not merely how many items each Series has.","c":["Only [a, b, c]","Only [d]","[0, 1, 2, 3]","The union [a, b, c, d]"],"a":3,"e":"pandas aligns Series by index label and uses the union of their labels. The first Series has no value for d, so that cell becomes NaN. No disaster: pandas simply leaves a polite empty chair."},{"id":"q03","t":"01 - Creating DataFrames","q":"Why does column one contain NaN at row label d when its source Series has no d label?","h":"Think about what pandas must place at a row-column intersection with no supplied value.","c":["The column was converted to text","pandas marks the missing aligned value","NaN is always added to the last row","The index was sorted incorrectly"],"a":1,"e":"The DataFrame includes row d because another Series supplied that label. Since column one has no matching d value, pandas represents that missing value with NaN. This is label alignment doing its job, not a bug wearing sunglasses."},{"id":"q04","t":"01 - Creating DataFrames","q":"What happens if a dictionary of plain lists contains columns with different lengths?","h":"Unlike Series, plain lists carry no index labels that pandas can align.","c":["Short lists repeat their last value","Short lists are padded with NaN","A ValueError is raised","Extra values are silently removed"],"a":2,"e":"All plain lists or arrays used as columns must have the same length, otherwise pandas raises ValueError. Lists have positions but no labels, so pandas cannot safely guess where missing rows belong. Guessing is for game shows, not data integrity."},{"id":"q05","t":"01 - Creating DataFrames","q":"A row dictionary has keys a and b, while another also has key c. What appears in column c for the first row?","h":"Each dictionary is one row, and pandas collects all keys as possible columns.","c":["Zero","An empty string","The value from the next row","NaN"],"a":3,"e":"pandas uses the union of dictionary keys as columns. A row missing key c receives NaN in column c, clearly recording that no value was provided. Missing is information too."},{"id":"q06","t":"01 - Creating DataFrames","q":"In pd.DataFrame(data_2d, columns=[...], index=[...]), what does index= define?","h":"Columns label the vertical direction; what labels the horizontal records?","c":["Row labels","Column data types","The number of dimensions","Missing-value symbols"],"a":0,"e":"index= defines row labels, while columns= defines column labels. The data stays the same; these labels make rows and columns easier to identify than a crowd of anonymous numbers."},{"id":"q07","t":"01 - Creating DataFrames","q":"Why can a 2D NumPy array mixing numbers and text cause numeric-looking values to become strings before DataFrame creation?","h":"Ask how many dtypes one ordinary NumPy array can have.","c":["DataFrames forbid numbers","NumPy arrays use one common dtype","columns= converts everything to text","The index always stores strings"],"a":1,"e":"A regular NumPy array uses one dtype for all elements. When text and numbers are mixed, NumPy chooses a compatible common dtype, often text, before pandas receives the array. The conversion happened upstream; pandas is merely opening the package."},{"id":"q08","t":"01 - Creating DataFrames","q":"In a NumPy structured array, what do fields such as A, B, and C become in a DataFrame?","h":"Structured fields already look suspiciously like named columns.","c":["Row labels","Separate DataFrames","Column names","File names"],"a":2,"e":"Named fields in a structured or record array become DataFrame columns. Their field dtypes also help pandas preserve the intended structure, which is rather considerate of NumPy."},{"id":"q09","t":"01 - Creating DataFrames","q":"A dictionary uses tuples as column keys and tuples as row keys. What structure can pandas create?","h":"A tuple can provide more than one label level.","c":["A DataFrame with hierarchical row and column indexes","A one-dimensional Series only","A JSON document","A DataFrame with no labels"],"a":0,"e":"Tuple keys can form MultiIndex levels for rows and columns, creating hierarchical labels. It is powerful but advanced, so beginners only need to recognize the pattern for now; no need to wrestle the entire octopus today."},{"id":"q10","t":"01 - Creating DataFrames","q":"When a DataFrame is created from Point(x, y) namedtuples, where do the column names x and y come from?","h":"A namedtuple is a tuple whose positions already have names.","c":["The list length","The namedtuple field names","The DataFrame index","Random pandas defaults"],"a":1,"e":"pandas reads the namedtuple field names and uses them as columns. Each namedtuple becomes a row, so Point(1, 2) maps naturally to x=1 and y=2."},{"id":"q11","t":"01 - Creating DataFrames","q":"What does each dataclass instance normally represent when a list of dataclasses becomes a DataFrame?","h":"Compare one object with one observation in a table.","c":["One row","One dtype","One index level","One entire workbook"],"a":0,"e":"Each dataclass instance becomes one row, and dataclass fields become columns. This is handy when structured Python objects need to join the tabular world without changing costumes."},{"id":"q12","t":"01 - Creating DataFrames","q":"What does orient='index' mean in DataFrame.from_dict(...)?","h":"The word index points toward row labels.","c":["Dictionary keys become row labels","Dictionary keys are deleted","Values become column labels only","The DataFrame is transposed twice"],"a":0,"e":"With orient='index', each dictionary key identifies a row rather than a column. The columns= argument can then name the values within each row. Orientation is simply pandas asking, 'Which way should I place this furniture?'"},{"id":"q13","t":"01 - Creating DataFrames","q":"What does index='C' do in DataFrame.from_records(record, index='C')?","h":"C is the name of a field inside each record.","c":["Creates a new constant column C","Uses field C as row labels","Drops every field except C","Converts C to category"],"a":1,"e":"The C field becomes the DataFrame index, so it is removed from the ordinary data columns and used as row labels. This is useful when a record field uniquely identifies observations."},{"id":"q14","t":"01 - Creating DataFrames","q":"Which constructor argument explicitly supplies column labels?","h":"Its name is refreshingly literal.","c":["index=","copy=","columns=","shape="],"a":2,"e":"columns= supplies column labels; index= supplies row labels. pandas can infer labels when possible, but explicit names make beginner code much easier to read and debug."},{"id":"q15","t":"02 - Reading Data","q":"Which function reads a comma-separated file into a DataFrame?","h":"The file format appears directly in the function name.","c":["pd.read_csv()","pd.open_table()","pd.load_rows()","pd.DataFrame.csv()"],"a":0,"e":"pd.read_csv() loads CSV data into a DataFrame and supports many controls for labels, types, dates, missing values, and more. The name is gloriously un-mysterious."},{"id":"q16","t":"02 - Reading Data","q":"What does index_col='id' do while reading a CSV?","h":"An index identifies rows rather than remaining an ordinary feature column.","c":["Sorts rows by id","Uses id as row labels","Converts id to strings","Removes rows with missing id"],"a":1,"e":"index_col='id' uses the id column as the DataFrame index. It does not automatically sort or clean the values; it only changes the column's role from regular data to row labels."},{"id":"q17","t":"02 - Reading Data","q":"Why use usecols=['name', 'salary', 'dept']?","h":"Think about paying only for the groceries you actually need.","c":["To rename all columns","To read only the selected columns","To force three rows","To remove missing values"],"a":1,"e":"usecols reads only the requested columns. This can reduce memory use and I/O time, especially in wide datasets; your laptop gets fewer unnecessary groceries to carry."},{"id":"q18","t":"02 - Reading Data","q":"A department column contains a small repeated set such as IT, HR, and Finance. Which dtype may save memory?","h":"Look for the dtype designed for repeated labels.","c":["category","float64","datetime64","complex128"],"a":0,"e":"category stores repeated labels as compact codes plus a set of unique categories. It often saves memory for low-cardinality columns, but you should check the data rather than converting every text column with wild optimism."},{"id":"q19","t":"02 - Reading Data","q":"Which option explicitly parses start_date as datetime while reading?","h":"Supply the date column inside a list.","c":["dtype={'start_date': 'date'}","dates=True","parse_dates=['start_date']","index_col=['datetime']"],"a":2,"e":"parse_dates=['start_date'] asks pandas to parse that column as datetime64. Explicit column names are easy to review and avoid relying on pandas to guess which values are dates."},{"id":"q20","t":"02 - Reading Data","q":"A CSV truly has no header row. Which setting prevents its first data row from being mistaken for column names?","h":"Tell pandas that the header is absent, not merely at a different row.","c":["header=False","header=None","names=None","skiprows=None"],"a":1,"e":"header=None tells pandas there is no header row, so the first row remains data. You can pair it with names=[...] to provide your own column names and save row one from an accidental promotion."},{"id":"q21","t":"02 - Reading Data","q":"How do you read a tab-separated file with read_csv()?","h":"A tab is written with the escape sequence \\t.","c":["sep='tab'","delimiter='spaces'","sep='\\t'","tabs=True"],"a":2,"e":"Use sep='\\t' because read_csv can read many delimiter-separated formats, not only commas. The function kept its famous surname, but it is flexible about punctuation."},{"id":"q22","t":"02 - Reading Data","q":"The source uses '?' to mean missing. Which option teaches pandas this rule?","h":"You are adding a custom token to pandas' set of NA markers.","c":["missing='?'","na_values=['?']","fillna='?'","dropna=['?']"],"a":1,"e":"na_values=['?'] converts that token to a missing-value marker during import. This is better than letting '?' masquerade as real data and surprise the model later."},{"id":"q23","t":"02 - Reading Data","q":"What does skiprows=2, nrows=4 mean?","h":"One option moves the starting point; the other limits how much is read.","c":["Skip two columns and read four columns","Skip two initial rows and then read four rows","Read rows numbered 2 and 4 only","Delete six rows after loading"],"a":1,"e":"skiprows=2 ignores the first two rows, then nrows=4 reads four rows from the remaining input. This is useful for files with preamble text or for quickly inspecting a small sample."},{"id":"q24","t":"02 - Reading Data","q":"In the lesson, which engine is required when using skipfooter=2 with read_csv()?","h":"It is the engine named after the language you are learning with.","c":["python","excel","numpy","xml"],"a":0,"e":"The lesson uses engine='python' because skipfooter is not supported by the default C engine in this setup. The Python engine may be slower, but it knows how to politely ignore the footer."},{"id":"q25","t":"02 - Reading Data","q":"What does read_csv(..., chunksize=10000) return?","h":"It does not immediately return one giant DataFrame.","c":["A single row","An iterator of smaller DataFrames","A compressed CSV file","A list of column names"],"a":1,"e":"chunksize returns an iterator that yields smaller DataFrames, each with up to the requested number of rows. This lets you process data piece by piece instead of asking RAM to perform heroic stunts."},{"id":"q26","t":"02 - Reading Data","q":"What is the important risk of on_bad_lines='skip'?","h":"The import continues, but what happened to the troublesome records?","c":["Every value becomes text","Skipped rows are lost unless investigated separately","The file is overwritten","All missing values become zero"],"a":1,"e":"Malformed rows are skipped, so their information does not enter the DataFrame. The option can keep a pipeline moving, but real projects should log or investigate those rows; sweeping data under the rug still leaves a suspiciously lumpy rug."},{"id":"q27","t":"02 - Reading Data","q":"What does pd.read_excel(file, sheet_name=None) return?","h":"There may be several sheets, so one DataFrame is not enough.","c":["The last sheet only","A dictionary mapping sheet names to DataFrames","A list of cell values","An empty DataFrame"],"a":1,"e":"sheet_name=None reads every worksheet and returns a dictionary. Each key is a sheet name and each value is its DataFrame, giving every sheet its own tidy room."},{"id":"q28","t":"02 - Reading Data","q":"A file stores one JSON object per line. Which option is needed?","h":"The format is called JSON Lines.","c":["records=True","lines=True","split=True","newline='json'"],"a":1,"e":"Use lines=True for JSON Lines, where each line is a complete JSON record. Without it, pandas expects the input to be one complete JSON document and may complain, quite reasonably."},{"id":"q29","t":"02 - Reading Data","q":"Which function flattens a nested list of book dictionaries into table-like columns?","h":"Its name includes what you want to do to nested data.","c":["pd.json_normalize()","pd.read_flat()","pd.DataFrame.squeeze()","pd.json_columns()"],"a":0,"e":"pd.json_normalize() turns nested records into a flatter tabular structure. With record_path, you can point it toward the nested list that should become rows. Tiny map, fewer caves."},{"id":"q30","t":"02 - Reading Data","q":"In pd.read_xml(file, xpath='./CD'), what does xpath select?","h":"Each selected XML node will become a table row.","c":["The output filename","The XML nodes to parse as records","The DataFrame index dtype","Only numeric elements"],"a":1,"e":"xpath selects the XML nodes that represent records; here each CD node becomes a row. It is a navigation instruction inside the XML tree, not a filter applied after DataFrame creation."},{"id":"q31","t":"02 - Reading Data","q":"What can pd.read_csv(url) do when the URL points directly to accessible CSV data?","h":"filepath_or_buffer accepts more than local filesystem paths.","c":["Read the remote CSV into a DataFrame","Only download an HTML page","Open the browser and wait","Convert the URL into an index"],"a":0,"e":"read_csv can read directly from an accessible URL. This still depends on network access, permissions, and a successful server response; the internet occasionally has opinions of its own."},{"id":"q32","t":"03 - Inspecting and Memory","q":"Without an argument, how many rows does df.head() return at most?","h":"The default is the same small number used by df.tail().","c":["1","3","5","10"],"a":2,"e":"df.head() returns the first five rows by default, or fewer if the DataFrame has fewer than five. It is the quick hello, not the entire autobiography."},{"id":"q33","t":"03 - Inspecting and Memory","q":"What does df.tail(3) return?","h":"Tail points toward the end.","c":["The first three columns","The final three rows","Three random rows","The final three columns"],"a":1,"e":"df.tail(3) returns the last three rows. It is useful for checking how a dataset ends, including suspicious footer rows that may have sneaked into the party."},{"id":"q34","t":"03 - Inspecting and Memory","q":"What value does df.info() return after printing its summary?","h":"It is an inspection method, not a method that creates a new table.","c":["A DataFrame","A dictionary","None","A NumPy array"],"a":2,"e":"df.info() prints a summary and returns None. Therefore, assigning result = df.info() stores None in result; the useful information was printed, not packed into a secret suitcase."},{"id":"q35","t":"03 - Inspecting and Memory","q":"Which information is included in the summary printed by df.info()?","h":"Think structure and completeness, not individual cell values.","c":["Column names, non-null counts, dtypes, and memory estimate","Every unique value in every column","A correlation matrix","A machine-learning accuracy score"],"a":0,"e":"info() summarizes the row range, columns, non-null counts, dtypes, and estimated memory use. It is an excellent first health check before analysis or modeling."},{"id":"q36","t":"03 - Inspecting and Memory","q":"Why can df.info(memory_usage='deep') report more memory than the default?","h":"Text stored as Python objects has data beyond the array of references.","c":["It duplicates the DataFrame","It inspects object-backed values such as strings more deeply","It converts integers to float64","It includes disk space for the CSV"],"a":1,"e":"Deep inspection examines memory used by object-backed values such as Python strings, while the default may mostly count their references. It is a better estimate for those columns, though not an exact measurement of the whole Python process."},{"id":"q37","t":"03 - Inspecting and Memory","q":"How do you calculate the DataFrame's total deep memory estimate from memory_usage()?","h":"memory_usage() returns one number per column, so combine them.","c":["df.memory_usage(deep=True).sum()","df.memory_usage(deep=True).mean()","df.info().sum()","df.size.memory()"],"a":0,"e":"memory_usage(deep=True) returns bytes for the index and each column, and sum() adds them into a total. Divide by 1024**2 if you want MiB rather than bytes."},{"id":"q38","t":"03 - Inspecting and Memory","q":"Why can category use much less memory for a column such as Medal with Gold, Silver, and Bronze repeated many times?","h":"Store the three labels once, then represent rows compactly.","c":["It deletes duplicate rows","It stores unique labels plus compact codes","It compresses the entire CSV file","It rounds text values"],"a":1,"e":"A categorical column stores a small set of unique labels and integer-like codes for each row. Repeating compact codes is cheaper than repeatedly storing general text objects, so low-cardinality labels are ideal candidates."},{"id":"q39","t":"03 - Inspecting and Memory","q":"When might converting a text column to category fail to save memory?","h":"Imagine a user ID column where nearly every value is different.","c":["When almost every value is unique","When values repeat often","When there are only three labels","When the DataFrame has an index"],"a":0,"e":"If almost every value is unique, category must store nearly all values as categories plus a code for every row. That overhead may equal or exceed string storage, so inspect cardinality before inviting category to move in."},{"id":"q40","t":"03 - Inspecting and Memory","q":"For a large CSV, why is choosing usecols and dtypes during import often better than loading everything first?","h":"Consider peak memory use, not only the final DataFrame size.","c":["It avoids loading unnecessary data and oversized dtypes","It guarantees no missing values","It automatically trains a model","It alphabetically sorts all columns"],"a":0,"e":"Selecting columns and suitable dtypes during import reduces unnecessary I/O and peak memory use. Loading a giant table and shrinking it afterward still requires enough memory for the giant version first; RAM remembers the ordeal."},{"id":"q41","t":"03 - Inspecting and Memory","q":"What should you check before converting an integer column to a smaller dtype such as uint16?","h":"A smaller container has a smaller valid range and unsigned types cannot hold negatives.","c":["Only the column name","Value range and missing values","Whether rows are sorted","The CSV filename extension"],"a":1,"e":"Validate the minimum, maximum, and missing-value requirements before choosing a smaller numeric dtype. Values outside the supported range cannot be represented safely, and unsigned integers cannot hold negative numbers. Small is useful; too small is comedy followed by debugging."},{"id":"q42","t":"04 - DataFrame Attributes","q":"A DataFrame has 1015 rows and 7 columns. What is df.shape?","h":"shape reports (rows, columns), in that order.","c":["(7, 1015)","7105","(1015, 7)","2"],"a":2,"e":"df.shape is the tuple (1015, 7): rows first, columns second. It describes the table's dimensions without counting every element individually."},{"id":"q43","t":"04 - DataFrame Attributes","q":"A DataFrame has shape (1015, 7). What is df.size?","h":"Multiply rows by columns.","c":["1022","7105","1015","7"],"a":1,"e":"df.size counts all cells: 1015 x 7 = 7105. It is not the memory size in bytes; despite the name, it is simply the number of elements."},{"id":"q44","t":"04 - DataFrame Attributes","q":"What is df.ndim for a pandas DataFrame?","h":"A DataFrame has a row axis and a column axis.","c":["1","2","The number of columns","The number of rows"],"a":1,"e":"A DataFrame is always two-dimensional, so ndim is 2. A Series is one-dimensional; this distinction is small but appears everywhere in pandas."},{"id":"q45","t":"04 - DataFrame Attributes","q":"Which attribute reports the dtype of every DataFrame column?","h":"The plural ending matters because a DataFrame can have several column types.","c":["df.dtype","df.types","df.dtypes","df.info_type"],"a":2,"e":"df.dtypes returns a Series containing one dtype per column. DataFrames can mix integers, floats, categories, and text, so the attribute is plural. Tiny s, mighty consequence."},{"id":"q46","t":"04 - DataFrame Attributes","q":"What does df.axes contain?","h":"A two-dimensional object has two label collections.","c":["Only column labels","A list containing row labels and column labels","Only numeric columns","The x and y values for a chart"],"a":1,"e":"df.axes is a list containing the index first and columns second. In most beginner tasks, df.index and df.columns are clearer, but axes shows both label systems together."},{"id":"q47","t":"04 - DataFrame Attributes","q":"What important information is not preserved in the array returned by df.to_numpy()?","h":"A NumPy array contains values and positions, not pandas labels.","c":["Cell values","The number of dimensions","Row and column labels","The array shape"],"a":2,"e":"to_numpy() returns the values without DataFrame index or column labels. Keep the DataFrame when labels matter, or store those labels separately before sending the array into code that expects NumPy."},{"id":"q48","t":"04 - DataFrame Attributes","q":"Why does df.to_numpy() often produce dtype object when the DataFrame mixes text and numeric columns?","h":"The output array needs one dtype that can hold every value.","c":["object is the only dtype pandas knows","A NumPy array needs one common dtype","Numeric columns are deleted","to_numpy() converts everything to JSON"],"a":1,"e":"A regular NumPy array uses one dtype for all cells. For mixed text and numbers, object is often the common container that can hold everything; the original per-column dtypes no longer exist in that single array."},{"id":"q49","t":"04 - DataFrame Attributes","q":"What does df.T do?","h":"Transpose swaps the two axes.","c":["Swaps rows and columns","Sorts values from top to bottom","Converts text to title case","Returns the last row"],"a":0,"e":"df.T transposes the DataFrame: original rows become columns and original columns become rows. The operation changes orientation, not the underlying meaning of values, though mixed dtypes may make the result less tidy."},{"id":"q50","t":"04 - DataFrame Attributes","q":"Which DataFrame makes df.empty return False?","h":"Missing values still occupy cells if rows and columns exist.","c":["pd.DataFrame()","pd.DataFrame(columns=['a', 'b'])","pd.DataFrame({'a': [None], 'b': [None]})","A DataFrame with zero rows and two columns"],"a":2,"e":"A one-row DataFrame filled with None or NaN is not empty because its cells still exist. df.empty is True when at least one axis has length zero; it does not ask whether every value is missing. A table full of blanks is still a table, just a very quiet one."}]};

    function load(){try{const x=JSON.parse(localStorage.getItem(key())||"[]");return Array.isArray(x)?x:[]}catch{return[]}}function save(){localStorage.setItem(key(),JSON.stringify(S.history))}function stamp(){const d=new Date(),p=(n,w=2)=>String(n).padStart(w,"0"),base=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;if(!S.history.some(x=>x.time===base))return base;let v=`${base}.${p(d.getMilliseconds(),3)}`,n=2;while(S.history.some(x=>x.time===v))v=`${base}.${p(d.getMilliseconds(),3)}-${n++}`;return v}
    function esc(v){v=String(v);return/[",\r\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v}function csv(){return"\uFEFF"+["Name",...S.history.map(x=>x.time)].map(esc).join(",")+"\r\n"+[S.name,...S.history.map(x=>`${x.correct}/${x.total} (${pct(x.percent)}%) - ${x.label}`)].map(esc).join(",")+"\r\n"}function parseCsv(text){text=text.replace(/^\uFEFF/,"");const rows=[];let row=[],cell="",q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}else if(c==='"')q=true;else if(c===","){row.push(cell);cell=""}else if(c==="\n"){row.push(cell.replace(/\r$/,"") );rows.push(row);row=[];cell=""}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}if(q||rows.length!==2||rows[1][0]!==S.name||rows[0].length!==rows[1].length)throw Error(T.badCsv);return rows[0].slice(1).map((time,i)=>{const m=rows[1][i+1].match(/^(\d+)\/(\d+) \(([\d.]+)%\) - (.+)$/);if(!m)throw Error(T.badCsv);return{time,correct:+m[1],total:+m[2],percent:+m[3],label:m[4]}})}

    function renderDash(){const h=S.history;$("total").textContent=h.length;$("historyCount").textContent=`${h.length}`;if(!h.length){$("latest").textContent=$("best").textContent="—";$("latestSub").textContent=T.noData;$("bestSub").textContent=T.firstMilestone;$("chart").style.display="none";$("chartEmpty").style.display="block";$("historyWrap").hidden=true;$("historyEmpty").style.display="block";return}const last=h.at(-1),best=h.reduce((a,b)=>b.percent>a.percent?b:a);$("latest").textContent=`${last.correct}/${last.total}`;$("latestSub").textContent=`${pct(last.percent)}% · ${last.label}`;$("best").textContent=`${best.correct}/${best.total}`;$("bestSub").textContent=`${pct(best.percent)}% · ${best.label}`;$("historyBody").replaceChildren(...[...h].reverse().map(x=>{const tr=document.createElement("tr");[x.time,`${x.correct}/${x.total} · ${pct(x.percent)}%`,x.label].forEach(v=>{const td=document.createElement("td");td.textContent=v;tr.append(td)});return tr}));$("chartEmpty").style.display="none";$("chart").style.display="block";$("historyEmpty").style.display="none";$("historyWrap").hidden=false;requestAnimationFrame(draw)}
    function draw(){const c=$("chart");if(!S.history.length)return;const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;const x=c.getContext("2d");x.scale(d,d);const w=r.width,h=r.height,p={l:38,r:15,t:15,b:30};x.font="12px system-ui";x.fillStyle="#718087";x.strokeStyle="#e4dfd5";[0,25,50,75,100].forEach(v=>{const y=p.t+(100-v)/100*(h-p.t-p.b);x.beginPath();x.moveTo(p.l,y);x.lineTo(w-p.r,y);x.stroke();x.fillText(v,7,y+4)});const pts=S.history.map((v,i)=>({x:S.history.length===1?(p.l+w-p.r)/2:p.l+i*(w-p.l-p.r)/(S.history.length-1),y:p.t+(100-v.percent)/100*(h-p.t-p.b)}));if(pts.length>1){x.beginPath();pts.forEach((v,i)=>i?x.lineTo(v.x,v.y):x.moveTo(v.x,v.y));x.strokeStyle="#087e78";x.lineWidth=3;x.stroke()}pts.forEach((v,i)=>{x.beginPath();x.arc(v.x,v.y,5,0,Math.PI*2);x.fillStyle=i===pts.length-1?"#e56b4d":"#087e78";x.fill()})}window.addEventListener("resize",()=>requestAnimationFrame(draw));
    function select(){const groups=[...new Set(QUIZ.questions.map(q=>q.t))].map(t=>shuffle(QUIZ.questions.filter(q=>q.t===t))),out=[];while(out.length<QUIZ.meta.attemptSize){let added=false;for(const g of shuffle(groups)){if(g.length&&out.length<QUIZ.meta.attemptSize){const q=g.pop(),opts=shuffle(q.c.map((text,i)=>({text,ok:i===q.a})));out.push({...q,opts});added=true}}if(!added)break}return shuffle(out)}
    function start(){S.quiz=select();S.index=S.correct=0;S.answers=[];$("dashboard").style.display="none";$("mainActions").style.display="none";$("result").classList.remove("show");$("quiz").classList.add("show");renderQ();scrollTo({top:0})}$("start").onclick=$("again").onclick=start;
    function renderQ(){const q=S.quiz[S.index];S.locked=false;$("qcount").textContent=T.question(S.index+1,S.quiz.length);$("live").textContent=T.correct(S.correct);$("bar").style.width=`${S.index/S.quiz.length*100}%`;$("topic").textContent=q.t;$("question").textContent=q.q;$("hintWrap").hidden=!q.h;$("hint").hidden=true;$("hint").textContent=q.h||"";$("hintBtn").textContent=T.hint;$("feedback").classList.remove("show");$("next").disabled=true;$("next").textContent=S.index===S.quiz.length-1?T.results:T.next;$("options").replaceChildren(...q.opts.map((o,i)=>{const b=document.createElement("button");b.className="option";b.type="button";b.dataset.ok=o.ok;b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span>`;b.append(document.createTextNode(o.text));b.onclick=()=>answer(o,b);return b}))}$("hintBtn").onclick=()=>{const h=$("hint");h.hidden=!h.hidden;$("hintBtn").textContent=h.hidden?T.hint:T.hideHint};
    function answer(o,chosen){if(S.locked)return;S.locked=true;const q=S.quiz[S.index];if(o.ok)S.correct++;S.answers.push({q:q.q,picked:o.text,answer:q.c[q.a],e:q.e,ok:o.ok});[...$("options").children].forEach(b=>{b.disabled=true;if(b.dataset.ok==="true")b.classList.add("correct")});if(!o.ok)chosen.classList.add("wrong");$("live").textContent=T.correct(S.correct);$("feedbackTitle").textContent=o.ok?T.yes:T.no;$("feedbackText").textContent=q.e;$("feedback").classList.add("show");$("next").disabled=false;$("next").focus()}$("next").onclick=()=>{if(!S.locked)return;if(++S.index<S.quiz.length)renderQ();else finish()};
    function finish(){const percent=S.correct/S.quiz.length*100,l=level(percent),old=S.history.length?Math.max(...S.history.map(x=>x.percent)):-1;S.history.push({time:stamp(),correct:S.correct,total:S.quiz.length,percent,label:`${l.emoji} ${l.title}`});try{save();$("save").textContent=T.saved}catch{$("save").textContent=T.storageHelp}$("quiz").classList.remove("show");$("result").classList.add("show");$("resultEmoji").textContent=l.emoji;$("resultTitle").textContent=l.title;$("resultScore").textContent=T.result(S.correct,S.quiz.length,pct(percent));$("record").textContent=T.record;$("record").classList.toggle("show",percent>=old);const wrong=S.answers.filter(x=>!x.ok);$("review").replaceChildren();const h=document.createElement("h3");h.textContent=wrong.length?T.review(wrong.length):T.perfect;$("review").append(h);wrong.forEach((x,i)=>{const d=document.createElement("div");d.className="review-item";const q=document.createElement("strong"),p=document.createElement("p"),a=document.createElement("p"),e=document.createElement("p");q.textContent=`${i+1}. ${x.q}`;p.textContent=`${T.picked}: ${x.picked}`;a.textContent=`${T.answer}: ${x.answer}`;a.className="right";e.textContent=x.e;d.append(q,p,a,e);$("review").append(d)});scrollTo({top:0})}
    $("back").onclick=()=>{$("result").classList.remove("show");$("dashboard").style.display="block";$("mainActions").style.display="flex";renderDash();scrollTo({top:0})};function download(){if(!S.history.length){$("notice").textContent=T.noExport;return}const u=URL.createObjectURL(new Blob([csv()],{type:"text/csv;charset=utf-8"})),a=document.createElement("a");a.href=u;a.download=`${S.name.replace(/[<>:"/\\|?*]/g,"_")}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$("exportBtn").onclick=$("resultExport").onclick=download;$("importBtn").onclick=()=>$("csvInput").click();$("csvInput").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;try{const imported=parseCsv(await f.text()),m=new Map(S.history.map(x=>[x.time,x]));imported.forEach(x=>m.set(x.time,x));S.history=[...m.values()].sort((a,b)=>a.time.localeCompare(b.time));save();renderDash();$("notice").textContent=T.imported(imported.length,f.name);$("notice").className="notice"}catch(err){$("notice").textContent=err.message;$("notice").className="notice error"}};
  </script>
