  <style>

    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 8% 5%,#f2b54447,transparent 25rem),radial-gradient(circle at 90% 15%,#087e7833,transparent 30rem),var(--paper);font:16px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{width:min(1120px,calc(100% - 32px));margin:auto;padding:28px 0 56px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px;font-weight:850}.mark{width:44px;height:44px;display:grid;place-items:center;color:#fff;background:var(--teal);border-radius:14px;box-shadow:0 8px 20px #087e783d}.brand small{display:block;color:var(--muted);font-weight:600;letter-spacing:.06em}.panel{background:#fffdf8eb;border:1px solid #ded9cde6;border-radius:var(--r);box-shadow:var(--shadow)}
    .login{min-height:560px;display:grid;grid-template-columns:1.05fr .95fr;overflow:hidden}.login-copy{padding:clamp(32px,6vw,72px);display:flex;flex-direction:column;justify-content:center}.eyebrow{color:var(--coral);font-weight:850;text-transform:uppercase;letter-spacing:.12em;font-size:.78rem}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(2.35rem,5vw,4.7rem);line-height:.98;letter-spacing:-.055em;margin:10px 0 22px}h1 span{color:var(--teal)}.lede{color:var(--muted);font-size:1.08rem}.pills{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 30px}.pill{padding:8px 12px;border-radius:999px;background:#eef4f1;color:var(--dark);font-weight:750;font-size:.88rem}.login-form{display:grid;gap:10px;max-width:480px}label{font-weight:800}input[type=text]{width:100%;padding:14px 16px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:13px;outline:0}input[type=text]:focus{border-color:var(--teal);box-shadow:0 0 0 4px #087e781f}.btn{border:0;border-radius:13px;padding:13px 18px;font-weight:850;color:#fff;background:var(--teal);transition:.16s}.btn:hover:not(:disabled){background:var(--dark);transform:translateY(-1px)}.btn:focus-visible,.option:focus-visible{outline:3px solid #f2b544cc;outline-offset:3px}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.secondary{color:var(--dark);background:#e9f3f0}.btn.ghost{color:var(--ink);background:transparent;border:1px solid var(--line)}.help{color:var(--muted);font-size:.84rem}
    .art{position:relative;overflow:hidden;min-height:430px;background:linear-gradient(145deg,var(--dark),#0c8b82 64%,#25a69a)}.code{position:absolute;width:min(400px,82%);padding:24px;color:#d7fff8;background:#0a2026d1;border:1px solid #ffffff26;border-radius:18px;box-shadow:0 26px 60px #0003;font:600 .9rem/1.8 ui-monospace,monospace}.code.one{top:14%;left:9%;transform:rotate(-3deg)}.code.two{right:7%;bottom:13%;transform:rotate(4deg)}.key{color:#ffce69}.call{color:#73e6d7}.note{color:#9eb8b8}.orb{position:absolute;border-radius:50%;background:#ffffff14}.orb.a{width:280px;height:280px;top:-100px;right:-70px}.orb.b{width:180px;height:180px;bottom:-60px;left:-50px}
    #app{display:none}.user{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:#dceee9;color:var(--dark);font-weight:900}.hero{padding:28px;margin-bottom:18px;background:linear-gradient(115deg,#073f3f,var(--teal));color:#fff;position:relative;overflow:hidden}.hero:after{content:"?";position:absolute;right:36px;top:-55px;font-weight:900;font-size:11rem;opacity:.08}.hero h2{margin-bottom:7px;font-size:clamp(1.65rem,3vw,2.4rem);letter-spacing:-.035em}.hero p{margin:0;color:#ccece7}.notice{margin-bottom:18px;padding:14px 16px;border-radius:12px;background:#eef7f5;border:1px solid #b8ddd6;color:var(--dark)}.notice.error{background:#ffeded;border-color:#efb0b0;color:#7f2828}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{padding:20px}.stat-label{color:var(--muted);font-weight:750;font-size:.88rem}.stat-value{font-size:clamp(1.65rem,3vw,2.35rem);line-height:1.15;margin-top:8px;font-weight:900}.stat-sub{color:var(--muted);font-size:.83rem;margin-top:6px}.best{background:linear-gradient(150deg,#fff8df,#fffdf8);border-color:#efdba1}.dash-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:16px}.chart-card,.history-card{padding:22px;min-width:0}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.section-head h3{margin:0;font-size:1.05rem}#chart{display:block;width:100%;height:230px}.empty{padding:34px 16px;text-align:center;color:var(--muted)}.history-wrap{max-height:270px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{padding:10px 8px;border-bottom:1px solid #ece7dc;text-align:left;white-space:nowrap}th{color:var(--muted);font-size:.76rem;text-transform:uppercase;letter-spacing:.06em}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0}.actions .spacer{flex:1}
    .quiz{display:none;padding:clamp(22px,5vw,46px)}.quiz.show,.result.show{display:block}.quiz-top{display:flex;justify-content:space-between;gap:14px;margin-bottom:12px}.qcount{font-weight:900;color:var(--dark)}.live{color:var(--muted);font-weight:750}.progress{height:8px;overflow:hidden;border-radius:99px;background:#e6e2d8;margin-bottom:30px}.progress div{height:100%;width:0;background:linear-gradient(90deg,var(--teal),#36ae9e)}.tag{display:inline-block;margin-bottom:12px;padding:5px 10px;border-radius:8px;background:#e9f3f0;color:var(--dark);font-size:.78rem;font-weight:850}.question{font-size:clamp(1.25rem,2.4vw,1.75rem);line-height:1.3;letter-spacing:-.025em;margin-bottom:16px}.hint-wrap{margin-bottom:18px}.hint{margin-top:10px;padding:12px 14px;border-left:4px solid var(--gold);border-radius:8px;background:#fff8df;color:#654b15}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{min-height:68px;display:flex;align-items:center;gap:12px;padding:14px 16px;color:var(--ink);text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px}.option:hover:not(:disabled){transform:translateY(-1px);border-color:var(--teal);background:#f4fbf9}.option:disabled{cursor:default;opacity:1}.option.correct{border-color:#57a878;background:#eaf7ee;color:#155e38}.option.wrong{border-color:#da7777;background:#fff0f0;color:#8f2929}.letter{flex:0 0 32px;height:32px;display:grid;place-items:center;border-radius:9px;background:#f0eee8;font-weight:900}.fill-form{grid-column:1/-1;display:flex;gap:10px;align-items:stretch}.fill-input{min-width:0;flex:1;padding:15px 16px;border:1.5px solid var(--line);border-radius:13px;outline:0;font:700 1rem/1.4 ui-monospace,monospace}.fill-input:focus{border-color:var(--teal);box-shadow:0 0 0 4px #087e781f}.fill-input.correct{border-color:#57a878;background:#eaf7ee}.fill-input.wrong{border-color:#da7777;background:#fff0f0}.feedback{display:none;margin-top:20px;padding:17px 18px;border-left:4px solid var(--teal);border-radius:10px;background:#eef7f5}.feedback.show{display:block}.feedback strong{display:block;margin-bottom:4px}.quiz-foot{display:flex;justify-content:flex-end;margin-top:22px}.result{display:none;padding:clamp(28px,6vw,60px);text-align:center}.result-emoji{font-size:4.6rem;line-height:1}.result h2{font-size:clamp(2rem,5vw,3.7rem);letter-spacing:-.045em;margin:14px 0 4px}.result-score,.save{color:var(--muted)}.record{display:none;width:fit-content;margin:18px auto 0;padding:9px 14px;border-radius:999px;background:#fff0c5;color:#765412;font-weight:900}.record.show{display:block}.save{margin:18px auto}.result-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.review{margin-top:30px;text-align:left}.review-item{padding:16px 0;border-top:1px solid var(--line)}.review-item p{margin:5px 0}.right{color:var(--good);font-weight:800}
    html[data-theme="purple"]{--ink:#2a2140;--muted:#6a5d7b;--paper:#f5f0fa;--card:#fff;--line:#cdbce0;--teal:#7650a3;--dark:#513174;--coral:#b13d68;--gold:#d39a2e;--good:#2d7253;--bad:#a7354a;--shadow:0 18px 50px #51317420;--bg-a:#eee6f7;--bg-b:#fbf9fd;--soft:#f0e9f8;--soft-line:#d6c3e8;--art:#a681c3;--hint-bg:#fff6d9;--best-bg:#fff5dd;--best-line:#dfc06d}
    html[data-theme="green"]{--ink:#17352f;--muted:#587269;--paper:#eef7f2;--card:#fff;--line:#b8d3c8;--teal:#3a8068;--dark:#245b49;--coral:#a63f59;--gold:#c99825;--good:#216b49;--bad:#a63f59;--shadow:0 18px 50px #245b491f;--bg-a:#e4f2e9;--bg-b:#f8fcf9;--soft:#e6f3ec;--soft-line:#b7d8c9;--art:#82b79d;--hint-bg:#fff6d9;--best-bg:#fff4df;--best-line:#dfbd69}
    html[data-theme="winter"]{--ink:#14263d;--muted:#53687e;--paper:#edf6fb;--card:#fff;--line:#bfd3e2;--teal:#167d8d;--dark:#163c66;--coral:#a7354a;--gold:#d29a20;--good:#23704a;--bad:#a7354a;--shadow:0 18px 50px #163c661c;--bg-a:#e5f2f9;--bg-b:#f7fbfd;--soft:#e7f4f7;--soft-line:#a9d1d8;--art:#9ecbda;--hint-bg:#fff7dc;--best-bg:#fff8e5;--best-line:#e4c777}
    html[data-theme="yellow"]{--ink:#263247;--muted:#687386;--paper:#fffaf0;--card:#fff;--line:#ddc77f;--teal:#9b7517;--dark:#324c69;--coral:#a73d59;--gold:#d5a51f;--good:#347052;--bad:#a73d59;--shadow:0 18px 50px #7155121f;--bg-a:#fff1bd;--bg-b:#fffdf6;--soft:#fff4cd;--soft-line:#dfc56d;--art:#d4af48;--hint-bg:#eef6f8;--best-bg:#e9f4f7;--best-line:#8ab9c7}
    html[data-theme]:not([data-theme="default"]) body{background:linear-gradient(180deg,var(--bg-a) 0,var(--bg-b) 45%,var(--paper) 100%)}html[data-theme]:not([data-theme="default"]) .panel{background:#ffffffed;border-color:var(--line)}html[data-theme]:not([data-theme="default"]) .art{background:linear-gradient(145deg,var(--dark),var(--teal) 68%,var(--art))}html[data-theme]:not([data-theme="default"]) .orb{display:none}html[data-theme]:not([data-theme="default"]) .hero{background:linear-gradient(115deg,var(--dark),var(--teal))}html[data-theme]:not([data-theme="default"]) .notice,html[data-theme]:not([data-theme="default"]) .feedback{background:var(--soft);border-color:var(--soft-line)}html[data-theme]:not([data-theme="default"]) .hint{background:var(--hint-bg);color:var(--ink)}html[data-theme]:not([data-theme="default"]) .best{background:var(--best-bg);border-color:var(--best-line)}html[data-theme]:not([data-theme="default"]) th,html[data-theme]:not([data-theme="default"]) td{border-color:var(--line)}
    @media(max-width:820px){.login{grid-template-columns:1fr}.art{min-height:320px}.stats,.dash-grid,.options{grid-template-columns:1fr}}@media(max-width:520px){.shell{width:calc(100% - 20px);padding-top:16px}.brand small,.user>span:not(.avatar){display:none}.login-copy{padding:28px 22px}.hero,.stat,.chart-card,.history-card{padding:18px}.quiz-top{flex-direction:column}.fill-form{flex-direction:column}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>

<body>
  <main class="shell">
    <header class="top"><div class="brand"><div class="mark">Q</div><div id="brandTitle">Lesson Quiz<small id="brandSub">REVIEW LAB</small></div></div><div class="user" id="user" hidden><span class="avatar" id="avatar">L</span><span id="userName"></span></div></header>
    <section class="panel login" id="login">
      <div class="login-copy"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="lede" id="subtitle"></p><div class="pills"><span class="pill" id="bankPill"></span><span class="pill" id="attemptPill"></span><span class="pill" id="storagePill"></span></div><form class="login-form" id="loginForm"><label for="name" id="nameLabel"></label><input id="name" type="text" autocomplete="name" maxlength="100" required><button class="btn" id="enter" type="submit"></button><div class="help" id="storageHelp"></div><div class="notice error" id="loginError" hidden></div></form></div>
      <div class="art" aria-hidden="true"><div class="orb a"></div><div class="orb b"></div><div class="code one"><span class="key">learn</span>.<span class="call">map</span>(idea =&gt; recall(idea))<br><span class="note">// practice makes progress</span></div><div class="code two"><span class="key">result</span> = <span class="call">challenge</span>(<span class="key">today</span>)</div></div>
    </section>
    <section id="app">
      <div class="panel hero"><h2 id="welcome"></h2><p id="encourage"></p></div><div class="notice" id="notice"></div>
      <div id="dashboard"><div class="stats"><article class="panel stat"><div class="stat-label" id="totalLabel"></div><div class="stat-value" id="total">0</div><div class="stat-sub" id="totalSub"></div></article><article class="panel stat"><div class="stat-label" id="latestLabel"></div><div class="stat-value" id="latest">—</div><div class="stat-sub" id="latestSub"></div></article><article class="panel stat best"><div class="stat-label" id="bestLabel"></div><div class="stat-value" id="best">—</div><div class="stat-sub" id="bestSub"></div></article></div>
        <div class="dash-grid"><article class="panel chart-card"><div class="section-head"><h3 id="trendLabel"></h3><span class="help">%</span></div><div class="empty" id="chartEmpty"></div><canvas id="chart"></canvas></article><article class="panel history-card"><div class="section-head"><h3 id="historyLabel"></h3><span class="help" id="historyCount"></span></div><div class="empty" id="historyEmpty"></div><div class="history-wrap" id="historyWrap" hidden><table><thead><tr><th id="timeHead"></th><th id="scoreHead"></th><th id="levelHead"></th></tr></thead><tbody id="historyBody"></tbody></table></div></article></div>
      </div>
      <div class="actions" id="mainActions"><button class="btn" id="start"></button><button class="btn secondary" id="importBtn"></button><button class="btn ghost" id="exportBtn"></button><input id="csvInput" type="file" accept=".csv,text/csv" hidden><div class="spacer"></div><button class="btn ghost" id="switchUser"></button></div>
      <section class="panel quiz" id="quiz" aria-live="polite"><div class="quiz-top"><div class="qcount" id="qcount"></div><div class="live" id="live"></div></div><div class="progress"><div id="bar"></div></div><span class="tag" id="topic"></span><h2 class="question" id="question"></h2><div class="hint-wrap" id="hintWrap"><button class="btn ghost" id="hintBtn" type="button"></button><div class="hint" id="hint" hidden></div></div><div class="options" id="options"></div><div class="feedback" id="feedback"><strong id="feedbackTitle"></strong><span id="feedbackText"></span></div><div class="quiz-foot"><button class="btn" id="next" disabled></button></div></section>
      <section class="panel result" id="result" aria-live="polite"><div class="result-emoji" id="resultEmoji"></div><h2 id="resultTitle"></h2><div class="result-score" id="resultScore"></div><div class="record" id="record"></div><div class="save" id="save"></div><div class="result-actions"><button class="btn" id="again"></button><button class="btn ghost" id="resultExport"></button><button class="btn ghost" id="back"></button></div><div class="review" id="review"></div></section>
    </section>
  </main>
  <script>
    const QUIZ={"meta":{"id":"pandas-rows-11-14-en","title":"Pandas: The Row Rescue Squad!","subtitle":"Lessons 11-14 | Index labels, filtering, dropping rows, unique and deduplication | 50 questions, 20 per attempt","attemptSize":20,"language":"en","theme":"winter","bankSize":50},"questions":[{"id":"q01","t":"11 - Row labels","q":"df has 3 rows. How can you replace its entire index with ['a','b','c']?","h":"The index holds the rows' name tags. Look for an assignment to those tags, rather than to the data.","c":["df.index = ['a','b','c']","df.columns = ['a','b','c']","df = ['a','b','c']","df.index = ['a']"],"a":0,"e":"Assigning df.index replaces all three row labels in their existing order. df.columns renames columns; assigning a list to df replaces the DataFrame variable; a single label does not match three rows. New name tags, same residents!"},{"id":"q02","t":"11 - Row labels","type":"fill","q":"Fill in the number: df = df.set_axis(['a','b'], axis=___) to relabel 2 rows.","h":"The row axis comes before the column axis. Start counting at zero!","answers":["0"],"e":"axis=0 means rows; axis=1 means columns. set_axis returns a DataFrame, so this example assigns the result back to df. Pick the right axis to avoid delivering name tags to the wrong floor!"},{"id":"q03","t":"11 - Row labels","q":"df has 8 rows, but new_indices contains only 7 labels. What happens with df.index = new_indices?","h":"Count the rows and name tags first. Pandas will not invent the missing label.","c":["An error: the number of labels does not match the number of rows","The eighth row is automatically deleted","A None label is automatically added","Only the first 7 rows are relabeled"],"a":0,"e":"Replacing the entire index requires one label per row. Seven labels cannot cover eight rows, so the assignment raises an error rather than relabeling just part of the table. Tip: check len(new_indices) == len(df) before handing out name tags."},{"id":"q04","t":"11 - Row labels","q":"Index [0,1,2] is transformed with astype(str).str.replace(r'\\d+', 'row', regex=True). What is the result?","h":"Each label consists entirely of digits. Every matched group is replaced by the same string.","c":["['row','row','row']","['row0','row1','row2']","['row_1','row_2','row_3']","[0,1,2]"],"a":0,"e":"\\d+ matches the whole group of digits in each label, so every label becomes 'row'. Nothing appends a sequence number. Duplicate index labels can exist; Pandas does not automatically issue a new ID to every 'row'!"},{"id":"q05","t":"11 - Row labels","q":"For index [0,1], what does astype(str).map(lambda s: s.center(len(s)+2, '_')) produce?","h":"The string '0' has length 1. Center it in a width of 3 using underscores.","c":["['_0_','_1_']","['__0','__1']","['0__','1__']","['_row0_','_row1_']"],"a":0,"e":"astype(str) produces '0' and '1'. center increases each width by 2, adding one underscore on each side. map applies the function to each label. Two tiny pillows around each number; no 'row' text is added!"},{"id":"q06","t":"11 - Row labels","type":"fill","q":"Fill in the method: df = df.___('id') to use column id as the index.","h":"A column currently inside the table is being invited to become the rows' name tags.","answers":["set_index"],"e":"set_index('id') uses the id values as row labels and, by default, removes id from the data columns. This differs from rename, which changes existing labels. Column id just got promoted to index!"},{"id":"q07","t":"11 - Row labels","q":"After df.set_index('id') with default arguments, where is id?","h":"In the employee example, id appears on the left as the name of the index.","c":["It becomes the index and is no longer a data column","Both its values and labels are deleted","It remains a column and the index stays unchanged","It becomes the name of every column"],"a":0,"e":"By default, set_index uses drop=True: id leaves the data-column area, but its values still exist in the index. Leaving a desk is not the same as disappearing from the company!"},{"id":"q08","t":"11 - Row labels","type":"fill","q":"Fill in True or False: df.reset_index(drop=___) discards the old index without adding it as a column.","h":"drop means discard. Should the old index retire, or stay on as a column?","answers":["True"],"e":"drop=True discards the old index and creates the integer index 0,1,2,... With drop=False (the default), the old index becomes a column. Resetting relabels rows; it does not sort the data."},{"id":"q09","t":"11 - Row labels","q":"After filtering, the index is [11,27,43]. What index does reset_index(drop=True) produce?","h":"There are 3 rows. Count again from zero while keeping their order.","c":["[0,1,2]","[11,27,43]","[1,2,3]","[0,11,27]"],"a":0,"e":"reset_index(drop=True) assigns the default index starting at zero to the three rows and discards the old labels. It does not filter or sort the data. New jersey numbers, same lineup!"},{"id":"q10","t":"11 - Row labels","q":"df has index [0,1,2]. What does df.rename(index={0:'row_0'}) change?","h":"The dictionary names only one old label. Labels not mentioned stay put.","c":["Only 0 becomes 'row_0'; 1 and 2 stay unchanged","All labels become 'row_0'","Column 0 becomes 'row_0'","Row 0 is deleted"],"a":0,"e":"rename(index=...) maps old labels to new labels without changing row values or labels omitted from the dictionary. Assign the returned result if you are not using inplace=True. This is a very selective name-tag repair!"},{"id":"q11","t":"11 - Row labels","type":"fill","q":"A MultiIndex has Country at level 0 and Year at level 1. Fill in: df.rename(index={2018:'Year_2018'}, level=___).","h":"Count from zero: Country first, Year second. Choose the right elevator floor!","answers":["1"],"e":"level=1 restricts renaming to Year, so 2018 is renamed for every country with that year. level=0 would target Country and would not match the numeric label 2018 in this example."},{"id":"q12","t":"11 - Row labels","q":"What does df.rename(index={0:'a'}, inplace=True) do?","h":"inplace means update the existing object; you do not need to receive a new DataFrame.","c":["It modifies df directly and returns None","It returns a new DataFrame and leaves df unchanged","It only prints the result","It sorts the index"],"a":0,"e":"inplace=True updates df and returns None. Do not write df = df.rename(..., inplace=True), or df will become None. Let Pandas repair the table; do not mistake the receipt for the table!"},{"id":"q13","t":"12 - Row filtering","q":"What does df['HP'] > 200 create before it is placed inside df[...]?","h":"Each row is asked a yes/no question about its HP.","c":["A Boolean Series used as a mask","An already filtered DataFrame","A single total HP value","A list of column names"],"a":0,"e":"The comparison produces True or False for each row. df[mask] then keeps the rows marked True. Think of the mask as a ticket inspector: True gets in, False stays out. It does not calculate new HP values."},{"id":"q14","t":"12 - Row filtering","q":"HP values are [199,200,201]. Which values survive df[df['HP'] > 200]?","h":"The > sign means strictly greater. Being exactly equal does not pass the gate.","c":["Only 201","200 and 201","199 and 200","All three"],"a":0,"e":"Neither 199 nor 200 is greater than 200; only 201 satisfies the condition. Use >= to include 200. One little symbol can send a Pokemon to the wrong queue!"},{"id":"q15","t":"12 - Row filtering","type":"fill","q":"Fill in the method: df['Speed'].___(5,10) checks a range and includes both endpoints by default.","h":"Its name means 'in the middle'. The result is still a Boolean mask.","answers":["between"],"e":"between(5,10) defaults to inclusive='both', equivalent to (Speed >= 5) & (Speed <= 10). Both 5 and 10 are included. To select rows, put the mask inside df[...]."},{"id":"q16","t":"12 - Row filtering","q":"Speed=[5,7,10]. What survives between(5,10,inclusive='neither')?","h":"neither means neither endpoint: both ticket 5 and ticket 10 are turned away.","c":["Only 7","5 and 7","7 and 10","All of 5,7,10"],"a":0,"e":"inclusive='neither' means 5 < Speed < 10, so only 7 is strictly inside. 'both' includes both endpoints, 'left' includes only the left endpoint, and 'right' includes only the right endpoint. Different fences, different guests!"},{"id":"q17","t":"12 - Row filtering","q":"Which condition is equivalent to between(5,10,inclusive='left')?","h":"Left is the endpoint 5. The left endpoint enters; the right one waits outside.","c":["(Speed >= 5) & (Speed < 10)","(Speed > 5) & (Speed <= 10)","(Speed > 5) & (Speed < 10)","(Speed >= 5) & (Speed <= 10)"],"a":0,"e":"inclusive='left' includes 5 but excludes 10: the interval [5,10). Do not confuse it with 'right', which excludes 5 and includes 10. The keyword names the endpoint that is included."},{"id":"q18","t":"12 - Row filtering","type":"fill","q":"Fill in the method: df['Type_1'].___(['Fire','Water']) checks membership in either type.","h":"Ask 'is this value in the list?' rather than comparing a cell with a whole list using ==.","answers":["isin"],"e":"isin returns True when a value is Fire or Water. df[mask] then selects the corresponding rows. Using == with a list does not express this membership test. Two types, one guest list!"},{"id":"q19","t":"12 - Row filtering","q":"Which mask finds names containing 'Mega'?","h":"The .str accessor handles strings. Containing text differs from starting with it.","c":["df['Name'].str.contains('Mega')","df['Name'].str.startswith('Mega')","df['Name'] == 'Mega'","df['Name'].isin(['Mega'])"],"a":0,"e":"contains finds 'Mega' anywhere, such as in 'CharizardMega Charizard X'. startswith checks only the beginning; == and isin(['Mega']) require the whole name to be 'Mega'. Mega can hide in the middle and still get spotted!"},{"id":"q20","t":"12 - Row filtering","q":"Which mask finds Name values starting with 'Bulb'?","h":"You are testing a prefix, rather than a suffix or a whole-name match.","c":["df['Name'].str.startswith('Bulb')","df['Name'].str.endswith('Bulb')","df['Name'] == 'Bulb'","df['Name'].isin(['Bulb'])"],"a":0,"e":"startswith checks the beginning of each string, so 'Bulbasaur' matches. endswith checks the ending; == and isin here require the entire name to equal 'Bulb'. Look at the right end of the problem, then the right end of the string!"},{"id":"q21","t":"12 - Row filtering","type":"fill","q":"Fill in the attribute: df['Name'].str.___('saur') finds names ending in saur.","h":"contains searches everywhere, startswith checks the beginning. What checks the end?","answers":["endswith"],"e":"endswith('saur') produces a suffix-based mask; Bulbasaur matches, for example. This checks the ending rather than searching for 'saur' anywhere. You just caught the name by its tail!"},{"id":"q22","t":"12 - Row filtering","type":"fill","q":"start_date is already datetime. Fill in the accessor: df['start_date'].___.is_month_start.","h":".str is for strings. Dates and times have their own two-letter toolbox.","answers":["dt"],"e":".dt accesses datetime properties; is_month_start returns True for the first day of a month, such as 2012-01-01. Read the column with parse_dates or convert it to datetime first. A date string needs its datetime passport before using this toolbox!"},{"id":"q23","t":"12 - Row filtering","q":"start_date is datetime. What does .dt.is_leap_year check?","h":"Being a leap year is a property of the entire year, not just February 29.","c":["Whether the date falls in a leap year","Whether the date must be February 29","Whether the date is a month end","Whether the month has 30 days"],"a":0,"e":"is_leap_year checks whether each date belongs to a leap year. 2012-01-01 is also True because 2012 is a leap year, even though the date is not February 29. The whole year does not have to dress up as February 29!"},{"id":"q24","t":"12 - Row filtering","type":"fill","q":"Fill in the operator: df[___df['Type_2'].isin(['Ground','Ghost'])] selects rows outside those two types.","h":"Flip True to False and vice versa. The symbol looks like a tiny wave.","answers":["~"],"e":"~ negates the mask produced by isin, excluding rows that belong to the list. This works element by element; do not apply Python's not to the entire Series. One tiny wave reverses the Pokemon traffic!"},{"id":"q25","t":"12 - Row filtering","q":"Select Fire rows AND Generation equal to the string '1'. Which expression works?","h":"Both conditions must be true. Put parentheses around each comparison when combining Series masks.","c":["df[(df['Type_1']=='Fire') & (df['Generation']=='1')]","df[(df['Type_1']=='Fire') | (df['Generation']=='1')]","df[(df['Type_1']=='Fire') and (df['Generation']=='1')]","df[df['Type_1']=='Fire']['Generation']=='1'"],"a":0,"e":"& combines Booleans element by element and keeps a row only when both conditions are True. | needs just one; and cannot combine two Series this way; the final option returns a Boolean Series rather than the desired DataFrame. Two conditions, two interview rounds!"},{"id":"q26","t":"12 - Row filtering","type":"fill","q":"Fill in the operator: (df['HP'] < 30) ___ (df['HP'] > 100) to keep rows meeting either condition.","h":"Elementwise OR uses a vertical bar. Python's and/or do not combine two Series this way.","answers":["|"],"e":"| is elementwise OR: HP=20 and HP=120 both pass, while HP=60 does not. & would demand HP below 30 and above 100 simultaneously, impossible for one number. Do not ask a Pokemon to split into two!"},{"id":"q27","t":"12 - Row filtering","q":"Why write (df['HP'] > 30) & (df['Speed'] < 100) with parentheses?","h":"Parentheses ensure that each comparison is evaluated before the masks are combined.","c":["To group each comparison correctly according to operator precedence","To sort rows automatically","To convert numbers to strings","Because & works only with integers"],"a":0,"e":"The parentheses create two clear Boolean Series, then & combines them. Without them, Python's operator precedence can group the expression incorrectly and cause an error. Parentheses are seat belts, not code decorations!"},{"id":"q28","t":"12 - Row filtering","q":"Choose the logic for (Fire OR Water) AND Generation > '4', using the ordered category from the lesson.","h":"Group the two types first, then intersect that group with the generation condition.","c":["((Type_1=='Fire') | (Type_1=='Water')) & (Generation>'4')","(Type_1=='Fire') & (Type_1=='Water') & (Generation>'4')","(Type_1=='Fire') | ((Type_1=='Water') & (Generation>'4'))","(Type_1=='Fire') | (Type_1=='Water') | (Generation>'4')"],"a":0,"e":"The OR group accepts either type; the following & requires every selected row to have Generation > '4'. If Fire sits outside that AND group, older Fire generations can slip through. Generation in the lesson is an ordered category with string labels, hence '4'."},{"id":"q29","t":"12 - Row filtering","type":"fill","q":"Fill in: df.___[df['HP'] > 200, ['Name','HP']] filters rows and selects only two columns.","h":"This selector takes [row condition, column list]. One comma separates the two jobs.","answers":["loc"],"e":"loc[mask, columns] selects rows with HP > 200 and keeps only Name and HP. df[mask] alone keeps all columns. The comma separates 'who gets in' from 'what information they bring'."},{"id":"q30","t":"12 - Row filtering","q":"Which columns does df.loc[df['HP'] > 200, ['Name','HP']] return?","h":"Look after the comma: that is the requested column list.","c":["Name and HP","All columns","Only Name","Only the index"],"a":0,"e":"['Name','HP'] limits the output columns; the condition before the comma selects rows. Nothing is summed, and no columns are deleted from the original df. Pack light: bring just the two things you need!"},{"id":"q31","t":"12 - Row filtering","type":"fill","q":"Fill in the method: df.___('HP > 200') filters using a string expression.","h":"Its name means to ask for information. Inside the string, you can refer to column names directly.","answers":["query"],"e":"query('HP > 200') evaluates the expression and returns matching rows. You do not need df['HP'] inside the string. This expresses a filtering condition; it does not sort rows or choose columns."},{"id":"q32","t":"12 - Row filtering","type":"fill","q":"threshold=180. Fill in the symbol: df.query('Attack >= ___threshold').","h":"A variable outside the DataFrame needs a special sign so query can recognize it.","answers":["@"],"e":"@threshold refers to the Python variable threshold=180; Attack is a column name. Without @, query may look for a column named threshold and raise an error if none exists. @ is the visitor pass for an outside variable!"},{"id":"q33","t":"12 - Row filtering","q":"A column is named 'Sp. Atk'. Which query is correct?","h":"A name with spaces or dots needs backticks, rather than quotes that make an ordinary string.","c":["df.query('`Sp. Atk` < 60')","df.query('Sp. Atk < 60')","df.query('\"Sp. Atk\" < 60')","df.query('@Sp. Atk < 60')"],"a":0,"e":"Backticks wrap a special-character column name so query recognizes it as one name. Double quotes create a string literal, while @ refers to an outside Python variable. Give that fancy column name a backtick jacket!"},{"id":"q34","t":"12 - Row filtering","q":"Following the lesson's query example, how can you filter names containing Mega?","h":"You can still use the .str string accessor inside query.","c":["df.query('Name.str.contains(\"Mega\")')","df.query('Name == \"Mega\"')","df.query('Name.str.startswith(\"Mega\")')","df.query('Name.str.endswith(\"Mega\")')"],"a":0,"e":"contains tests for a substring anywhere. The other options check the whole name, the beginning, or the ending. Many names have Mega in the middle, so those options do not express the same requirement. Read the verb to pick the right move!"},{"id":"q35","t":"12 - Row filtering","q":"The lesson uses from pandas import col as c. What does c('HP') represent in a filtering expression?","h":"as c only creates a function alias. c is not a new DataFrame.","c":["A reference to column HP in the expression","The number of HP rows","A copy of the entire df","The name of an automatically created new column"],"a":0,"e":"The lesson uses pd.col('HP'), or its alias c('HP'), for a column reference in expressions such as c('HP') > 100. This syntax requires a Pandas version that supports col; df['HP'] is the direct form used throughout the lesson. No counting happens here."},{"id":"q36","t":"12 - Row filtering","q":"In the lesson, Generation is an ordered category labeled ['1',...,'6']. Why compare with '4'?","h":"Check the label type: quotes indicate a string. The category defines the ordering.","c":["The category labels are strings and already ordered","Every numeric column must be compared with a string","Pandas always converts numeric 4 to '4' automatically","'4' is a column name"],"a":0,"e":"The lesson calls cat.as_ordered() and uses string generation labels, so Generation > '4' matches that setup. Do not generalize this to every numeric column: HP still compares with numbers. Check the dtype before choosing your move!"},{"id":"q37","t":"13 - Dropping rows","q":"df has index [0,1,2,3,4]. Which labels remain after df.drop(labels=[0,3],axis=0)?","h":"Delete the listed labels. The remaining labels are not automatically renumbered.","c":["[1,2,4]","[0,1,2]","[0,3]","[1,2,3]"],"a":0,"e":"axis=0 removes row labels 0 and 3, leaving 1,2,4 in their original order. drop does not automatically reset_index. Gaps in the numbering are normal, not missing-data errors!"},{"id":"q38","t":"13 - Dropping rows","type":"fill","q":"Fill in the keyword: df.drop(___=['row_2','row_4']) removes these two row labels.","h":"You can name the axis directly instead of using labels=... with axis=0.","answers":["index"],"e":"index= specifies row labels to remove, equivalent to labels=['row_2','row_4'], axis=0. columns= targets columns instead. Use the right address so Pandas knocks on the right door!"},{"id":"q39","t":"13 - Dropping rows","q":"df has index ['row_1','row_2','row_3']. How do you remove the second row in this example?","h":"drop uses labels, rather than row positions. What is actually written on the name tag?","c":["df.drop(index=['row_2'])","df.drop(index=[1])","df.drop(index=[2])","df.drop(columns=['row_2'])"],"a":0,"e":"The second row is labeled 'row_2', so pass that label to index=. Neither integer 1 nor 2 is a label here; either would raise an error by default. columns= targets columns. Do not mistake the seat number for the passenger's name!"},{"id":"q40","t":"13 - Dropping rows","q":"out = df.drop(index=[0], inplace=False). What happens to the original df?","h":"inplace=False produces a result that another variable can receive.","c":["This command leaves df unchanged","df immediately loses row 0","df becomes None","df keeps only row 0"],"a":0,"e":"With inplace=False, drop returns a DataFrame: out receives the table without row 0, while df is unchanged. To update df, use df = df.drop(...) or inplace=True. Two ways to handle the result; choose one clearly!"},{"id":"q41","t":"13 - Dropping rows","q":"After df.drop(index=[0], inplace=True), which variable should you inspect to see the updated table?","h":"An in-place change updates df itself. The return value is not a table.","c":["df","The return value of drop is a new DataFrame","An automatically created index variable","An automatically created labels variable"],"a":0,"e":"inplace=True modifies df directly and returns None. Inspect df afterward; do not assign df = df.drop(...,inplace=True). Look at the renovated house, rather than the empty receipt!"},{"id":"q42","t":"13 - Dropping rows","q":"Which command is equivalent to df.drop(index=[1,2,3])?","h":"Use the same labels and the same row axis; only the parameter spelling changes.","c":["df.drop(labels=[1,2,3], axis=0)","df.drop(labels=[1,2,3], axis=1)","df.rename(index={1:2,2:3})","df.reset_index(drop=True)"],"a":0,"e":"index= explicitly identifies the row axis; labels= with axis=0 expresses the same operation. axis=1 removes columns, rename changes labels, and reset_index relabels rows without removing data rows. Read the verb before pressing the button!"},{"id":"q43","t":"14 - Unique and deduplication","q":"brand=['Yum Yum','Yum Yum','Indomie','Indomie','Indomie']. What values does brand.unique() return?","h":"unique takes each value once, in first-appearance order. It does not count occurrences.","c":["['Yum Yum','Indomie']","['Indomie','Yum Yum'] because it sorts automatically","[2,3]","All five values"],"a":0,"e":"unique returns distinct values in first-appearance order: Yum Yum, then Indomie. It neither sorts automatically nor returns frequencies. The displayed container can vary by dtype; this question asks about the values. One ticket per brand!"},{"id":"q44","t":"14 - Unique and deduplication","type":"fill","q":"Fill in: df['rating'].___() gets the distinct rating values.","h":"The method's name means one of a kind. You want distinct values in a single column.","answers":["unique"],"e":"unique() on the rating Series takes each level once. For [4,4,3.5,15,5], the values are [4,3.5,15,5]. It neither removes rows from the original DataFrame nor calculates an average. One rating level, one seat!"},{"id":"q45","t":"14 - Unique and deduplication","q":"Noodle rows (brand,style,rating): 0=(Yum Yum,cup,4), 1=(Yum Yum,cup,4), 2=(Indomie,cup,3.5), 3=(Indomie,pack,15), 4=(Indomie,pack,5). Which index labels survive drop_duplicates()?","h":"By default, compare all data columns and keep the first occurrence. Same brand and style with different ratings still means different rows.","c":["[0,2,3,4]","[0,2,3]","[0,2]","[1,2,4]"],"a":0,"e":"Only row 1 matches every data value in row 0, so row 1 is removed. Rows 3 and 4 have different ratings (15 and 5), so both remain. The index is not a data column used to identify duplicates. Same noodles, different review experience!"},{"id":"q46","t":"14 - Unique and deduplication","q":"Noodle rows (brand,style,rating): 0=(Yum Yum,cup,4), 1=(Yum Yum,cup,4), 2=(Indomie,cup,3.5), 3=(Indomie,pack,15), 4=(Indomie,pack,5). Which index labels survive drop_duplicates(subset=['brand','style'])?","h":"Compare only brand + style. Rating no longer gets a vote. Keep the first occurrence.","c":["[0,2,3]","[0,2,3,4]","[0,2]","[1,2,4]"],"a":0,"e":"The three distinct pairs are Yum Yum/cup, Indomie/cup, and Indomie/pack, first seen at 0,2,3. Row 4 is removed because its key pair matches row 3, despite a different rating. subset selects the duplicate criteria, not the output columns."},{"id":"q47","t":"14 - Unique and deduplication","type":"fill","q":"Fill in the parameter: df.drop_duplicates(___=['brand','style']) checks duplicates using these two columns.","h":"Specify a subset of columns to act as comparison keys.","answers":["subset"],"e":"subset chooses the columns that define duplicates. Other columns remain in the result but do not decide whether rows match. You are choosing the referees, not sending the other columns off the field!"},{"id":"q48","t":"14 - Unique and deduplication","q":"Does drop_duplicates(subset=['brand','style']) remove the rating column from the result?","h":"Distinguish the comparison criteria from the list of output columns.","c":["No, rating remains","Yes, only brand and style remain","Yes, only the index remains","rating becomes the index"],"a":0,"e":"subset limits only the columns used to identify duplicates. The result still contains all original data columns. To keep only brand and style, select columns separately. The referees inspect two criteria, but the scoreboard stays complete!"},{"id":"q49","t":"14 - Unique and deduplication","q":"rating=[4,4,3.5,15,5]. Does unique() automatically remove 15 because it looks unusual?","h":"Being distinct and being valid are different questions. This method answers only the first.","c":["No, 15 remains a distinct value","Yes, all ratings > 5 are removed","Yes, unique keeps only integers 1-5","Yes, 15 is changed to 5"],"a":0,"e":"unique does not know your rating-scale rules and does not clean outliers. It keeps [4,3.5,15,5]. If the business rule requires rating <=5, add a separate filter. Pandas has not been hired as the noodle-tasting judge!"},{"id":"q50","t":"14 - Unique and deduplication","q":"After drop_duplicates(), the index is [0,2,3,4]. How can you get [0,1,2,3]?","h":"Removing duplicates and renumbering the index are two separate steps. The second discards the old labels.","c":["df.drop_duplicates().reset_index(drop=True)","df.drop_duplicates().rename(index={0:0})","df['rating'].unique()","df.set_index('rating')"],"a":0,"e":"drop_duplicates removes duplicate rows but preserves the labels of surviving rows. reset_index(drop=True) renumbers from zero without adding the old index as a column. First tidy the house, then renumber the rooms!"}]};

    [["totalLabel",T.total],["latestLabel",T.latest],["bestLabel",T.best],["trendLabel",T.trend],["historyLabel",T.history],["timeHead",T.time],["scoreHead",T.score],["levelHead",T.level],["start",T.start(QUIZ.meta.attemptSize)],["importBtn",T.import],["exportBtn",T.export],["switchUser",T.switchUser],["again",T.again],["resultExport",T.export],["back",T.back]].forEach(([id,v])=>$(id).textContent=v);$("totalSub").textContent=T.attemptDone(QUIZ.meta.attemptSize);$("chartEmpty").textContent=T.chartEmpty;$("historyEmpty").textContent=T.historyEmpty;
    const shuffle=a=>{a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},pct=n=>Number.isInteger(n)?String(n):n.toFixed(2).replace(/0+$/,"").replace(/\.$/,""),level=p=>T.levels.find(x=>p>=x.min),key=()=>`lesson-quiz::${QUIZ.meta.id}::${S.name.normalize("NFC").toLocaleLowerCase()}`;
    function load(){try{const x=JSON.parse(localStorage.getItem(key())||"[]");return Array.isArray(x)?x:[]}catch{return[]}}function save(){localStorage.setItem(key(),JSON.stringify(S.history))}function stamp(){const d=new Date(),p=(n,w=2)=>String(n).padStart(w,"0"),base=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;if(!S.history.some(x=>x.time===base))return base;let v=`${base}.${p(d.getMilliseconds(),3)}`,n=2;while(S.history.some(x=>x.time===v))v=`${base}.${p(d.getMilliseconds(),3)}-${n++}`;return v}
    function esc(v){v=String(v);return/[",\r\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v}function csv(){return"\uFEFF"+["Name",...S.history.map(x=>x.time)].map(esc).join(",")+"\r\n"+[S.name,...S.history.map(x=>`${x.correct}/${x.total} (${pct(x.percent)}%) - ${x.label}`)].map(esc).join(",")+"\r\n"}function parseCsv(text){text=text.replace(/^\uFEFF/,"");const rows=[];let row=[],cell="",q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}else if(c==='"')q=true;else if(c===","){row.push(cell);cell=""}else if(c==="\n"){row.push(cell.replace(/\r$/,"") );rows.push(row);row=[];cell=""}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}if(q||rows.length!==2||rows[1][0]!==S.name||rows[0].length!==rows[1].length)throw Error(T.badCsv);return rows[0].slice(1).map((time,i)=>{const m=rows[1][i+1].match(/^(\d+)\/(\d+) \(([\d.]+)%\) - (.+)$/);if(!m)throw Error(T.badCsv);return{time,correct:+m[1],total:+m[2],percent:+m[3],label:m[4]}})}
    $("loginForm").addEventListener("submit",e=>{e.preventDefault();S.name=$("name").value.trim();if(!S.name)return;S.history=load();$("login").style.display="none";$("app").style.display="block";$("user").hidden=false;$("userName").textContent=S.name;$("avatar").textContent=S.name[0].toUpperCase();$("welcome").textContent=T.welcome(S.name);$("encourage").textContent=T.encourage;$("notice").textContent=T.notice;renderDash()});$("switchUser").onclick=()=>location.reload();
    function renderDash(){const h=S.history;$("total").textContent=h.length;$("historyCount").textContent=`${h.length}`;if(!h.length){$("latest").textContent=$("best").textContent="—";$("latestSub").textContent=T.noData;$("bestSub").textContent=T.firstMilestone;$("chart").style.display="none";$("chartEmpty").style.display="block";$("historyWrap").hidden=true;$("historyEmpty").style.display="block";return}const last=h.at(-1),best=h.reduce((a,b)=>b.percent>a.percent?b:a);$("latest").textContent=`${last.correct}/${last.total}`;$("latestSub").textContent=`${pct(last.percent)}% · ${last.label}`;$("best").textContent=`${best.correct}/${best.total}`;$("bestSub").textContent=`${pct(best.percent)}% · ${best.label}`;$("historyBody").replaceChildren(...[...h].reverse().map(x=>{const tr=document.createElement("tr");[x.time,`${x.correct}/${x.total} · ${pct(x.percent)}%`,x.label].forEach(v=>{const td=document.createElement("td");td.textContent=v;tr.append(td)});return tr}));$("chartEmpty").style.display="none";$("chart").style.display="block";$("historyEmpty").style.display="none";$("historyWrap").hidden=false;requestAnimationFrame(draw)}
    function draw(){const c=$("chart");if(!S.history.length)return;const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;const x=c.getContext("2d");x.scale(d,d);const w=r.width,h=r.height,p={l:38,r:15,t:15,b:30};x.font="12px system-ui";x.fillStyle="#718087";x.strokeStyle="#e4dfd5";[0,25,50,75,100].forEach(v=>{const y=p.t+(100-v)/100*(h-p.t-p.b);x.beginPath();x.moveTo(p.l,y);x.lineTo(w-p.r,y);x.stroke();x.fillText(v,7,y+4)});const pts=S.history.map((v,i)=>({x:S.history.length===1?(p.l+w-p.r)/2:p.l+i*(w-p.l-p.r)/(S.history.length-1),y:p.t+(100-v.percent)/100*(h-p.t-p.b)}));if(pts.length>1){x.beginPath();pts.forEach((v,i)=>i?x.lineTo(v.x,v.y):x.moveTo(v.x,v.y));x.strokeStyle="#087e78";x.lineWidth=3;x.stroke()}pts.forEach((v,i)=>{x.beginPath();x.arc(v.x,v.y,5,0,Math.PI*2);x.fillStyle=i===pts.length-1?"#e56b4d":"#087e78";x.fill()})}window.addEventListener("resize",()=>requestAnimationFrame(draw));
    function select(){const groups=[...new Set(QUIZ.questions.map(q=>q.t))].map(t=>shuffle(QUIZ.questions.filter(q=>q.t===t))),out=[];while(out.length<QUIZ.meta.attemptSize){let added=false;for(const g of shuffle(groups)){if(g.length&&out.length<QUIZ.meta.attemptSize){const q=g.pop(),opts=q.type==="fill"?null:shuffle(q.c.map((text,i)=>({text,ok:i===q.a})));out.push({...q,opts});added=true}}if(!added)break}return shuffle(out)}
    function start(){S.quiz=select();S.index=S.correct=0;S.answers=[];$("dashboard").style.display="none";$("mainActions").style.display="none";$("result").classList.remove("show");$("quiz").classList.add("show");renderQ();scrollTo({top:0})}$("start").onclick=$("again").onclick=start;
    function renderQ(){const q=S.quiz[S.index];S.locked=false;$("qcount").textContent=T.question(S.index+1,S.quiz.length);$("live").textContent=T.correct(S.correct);$("bar").style.width=`${S.index/S.quiz.length*100}%`;$("topic").textContent=q.t;$("question").textContent=q.q;$("hintWrap").hidden=!q.h;$("hint").hidden=true;$("hint").textContent=q.h||"";$("hintBtn").textContent=T.hint;$("feedback").classList.remove("show");$("next").disabled=true;$("next").textContent=S.index===S.quiz.length-1?T.results:T.next;if(q.type==="fill"){const form=document.createElement("form"),input=document.createElement("input"),button=document.createElement("button");form.className="fill-form";input.className="fill-input";input.type="text";input.placeholder=T.fillPh;input.autocomplete="off";input.required=true;button.className="btn";button.type="submit";button.textContent=T.check;form.onsubmit=e=>{e.preventDefault();answerFill(input.value,input,button)};form.append(input,button);$("options").replaceChildren(form);requestAnimationFrame(()=>input.focus())}else $("options").replaceChildren(...q.opts.map((o,i)=>{const b=document.createElement("button");b.className="option";b.type="button";b.dataset.ok=o.ok;b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span>`;b.append(document.createTextNode(o.text));b.onclick=()=>answer(o,b);return b}))}$("hintBtn").onclick=()=>{const h=$("hint");h.hidden=!h.hidden;$("hintBtn").textContent=h.hidden?T.hint:T.hideHint};
    function showFeedback(ok,q,picked,correct){if(ok)S.correct++;S.answers.push({q:q.q,picked,answer:correct,e:q.e,ok});$("live").textContent=T.correct(S.correct);$("feedbackTitle").textContent=ok?T.yes:T.no;$("feedbackText").textContent=q.e;$("feedback").classList.add("show");$("next").disabled=false;$("next").focus()}
    function answer(o,chosen){if(S.locked)return;S.locked=true;const q=S.quiz[S.index];[...$("options").children].forEach(b=>{b.disabled=true;if(b.dataset.ok==="true")b.classList.add("correct")});if(!o.ok)chosen.classList.add("wrong");showFeedback(o.ok,q,o.text,q.c[q.a])}
    function answerFill(value,input,button){if(S.locked)return;const picked=value.trim();if(!picked){input.focus();return}S.locked=true;const clean=v=>String(v).trim().replace(/^`|`$/g,"").replace(/\s+/g," ").toLocaleLowerCase(),q=S.quiz[S.index],ok=q.answers.some(a=>clean(a)===clean(picked));input.disabled=button.disabled=true;input.classList.add(ok?"correct":"wrong");showFeedback(ok,q,picked,q.answers[0])}$("next").onclick=()=>{if(!S.locked)return;if(++S.index<S.quiz.length)renderQ();else finish()};
    function finish(){const percent=S.correct/S.quiz.length*100,l=level(percent),old=S.history.length?Math.max(...S.history.map(x=>x.percent)):-1;S.history.push({time:stamp(),correct:S.correct,total:S.quiz.length,percent,label:`${l.emoji} ${l.title}`});try{save();$("save").textContent=T.saved}catch{$("save").textContent=T.storageHelp}$("quiz").classList.remove("show");$("result").classList.add("show");$("resultEmoji").textContent=l.emoji;$("resultTitle").textContent=l.title;$("resultScore").textContent=T.result(S.correct,S.quiz.length,pct(percent));$("record").textContent=T.record;$("record").classList.toggle("show",percent>=old);const wrong=S.answers.filter(x=>!x.ok);$("review").replaceChildren();const h=document.createElement("h3");h.textContent=wrong.length?T.review(wrong.length):T.perfect;$("review").append(h);wrong.forEach((x,i)=>{const d=document.createElement("div");d.className="review-item";const q=document.createElement("strong"),p=document.createElement("p"),a=document.createElement("p"),e=document.createElement("p");q.textContent=`${i+1}. ${x.q}`;p.textContent=`${T.picked}: ${x.picked}`;a.textContent=`${T.answer}: ${x.answer}`;a.className="right";e.textContent=x.e;d.append(q,p,a,e);$("review").append(d)});scrollTo({top:0})}
    $("back").onclick=()=>{$("result").classList.remove("show");$("dashboard").style.display="block";$("mainActions").style.display="flex";renderDash();scrollTo({top:0})};function download(){if(!S.history.length){$("notice").textContent=T.noExport;return}const u=URL.createObjectURL(new Blob([csv()],{type:"text/csv;charset=utf-8"})),a=document.createElement("a");a.href=u;a.download=`${S.name.replace(/[<>:"/\\|?*]/g,"_")}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$("exportBtn").onclick=$("resultExport").onclick=download;$("importBtn").onclick=()=>$("csvInput").click();$("csvInput").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;try{const imported=parseCsv(await f.text()),m=new Map(S.history.map(x=>[x.time,x]));imported.forEach(x=>m.set(x.time,x));S.history=[...m.values()].sort((a,b)=>a.time.localeCompare(b.time));save();renderDash();$("notice").textContent=T.imported(imported.length,f.name);$("notice").className="notice"}catch(err){$("notice").textContent=err.message;$("notice").className="notice error"}};
