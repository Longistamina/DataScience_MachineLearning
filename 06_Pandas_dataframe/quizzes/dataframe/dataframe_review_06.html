  <style>
    :root{--ink:#17232b;--muted:#63727b;--paper:#f7f4ed;--card:#fffdf8;--line:#ded9cd;--teal:#087e78;--dark:#055d59;--coral:#e56b4d;--gold:#f2b544;--good:#267a4b;--bad:#b23b3b;--shadow:0 18px 50px #182a2f1f;--r:22px}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 8% 5%,#f2b54447,transparent 25rem),radial-gradient(circle at 90% 15%,#087e7833,transparent 30rem),var(--paper);font:16px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{width:min(1120px,calc(100% - 32px));margin:auto;padding:28px 0 56px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px;font-weight:850}.mark{width:44px;height:44px;display:grid;place-items:center;color:#fff;background:var(--teal);border-radius:14px;box-shadow:0 8px 20px #087e783d}.brand small{display:block;color:var(--muted);font-weight:600;letter-spacing:.06em}.panel{background:#fffdf8eb;border:1px solid #ded9cde6;border-radius:var(--r);box-shadow:var(--shadow)}
    .login{min-height:560px;display:grid;grid-template-columns:1.05fr .95fr;overflow:hidden}.login-copy{padding:clamp(32px,6vw,72px);display:flex;flex-direction:column;justify-content:center}.eyebrow{color:var(--coral);font-weight:850;text-transform:uppercase;letter-spacing:.12em;font-size:.78rem}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(2.35rem,5vw,4.7rem);line-height:.98;letter-spacing:-.055em;margin:10px 0 22px}h1 span{color:var(--teal)}.lede{color:var(--muted);font-size:1.08rem}.pills{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 30px}.pill{padding:8px 12px;border-radius:999px;background:#eef4f1;color:var(--dark);font-weight:750;font-size:.88rem}.login-form{display:grid;gap:10px;max-width:480px}label{font-weight:800}input[type=text]{width:100%;padding:14px 16px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:13px;outline:0}input[type=text]:focus{border-color:var(--teal);box-shadow:0 0 0 4px #087e781f}.btn{border:0;border-radius:13px;padding:13px 18px;font-weight:850;color:#fff;background:var(--teal);transition:.16s}.btn:hover:not(:disabled){background:var(--dark);transform:translateY(-1px)}.btn:focus-visible,.option:focus-visible{outline:3px solid #f2b544cc;outline-offset:3px}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.secondary{color:var(--dark);background:#e9f3f0}.btn.ghost{color:var(--ink);background:transparent;border:1px solid var(--line)}.help{color:var(--muted);font-size:.84rem}
    .art{position:relative;overflow:hidden;min-height:430px;background:linear-gradient(145deg,var(--dark),#0c8b82 64%,#25a69a)}.code{position:absolute;width:min(400px,82%);padding:24px;color:#d7fff8;background:#0a2026d1;border:1px solid #ffffff26;border-radius:18px;box-shadow:0 26px 60px #0003;font:600 .9rem/1.8 ui-monospace,monospace}.code.one{top:14%;left:9%;transform:rotate(-3deg)}.code.two{right:7%;bottom:13%;transform:rotate(4deg)}.key{color:#ffce69}.call{color:#73e6d7}.note{color:#9eb8b8}.orb{position:absolute;border-radius:50%;background:#ffffff14}.orb.a{width:280px;height:280px;top:-100px;right:-70px}.orb.b{width:180px;height:180px;bottom:-60px;left:-50px}
    #app{display:none}.user{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:#dceee9;color:var(--dark);font-weight:900}.hero{padding:28px;margin-bottom:18px;background:linear-gradient(115deg,#073f3f,var(--teal));color:#fff;position:relative;overflow:hidden}.hero:after{content:"?";position:absolute;right:36px;top:-55px;font-weight:900;font-size:11rem;opacity:.08}.hero h2{margin-bottom:7px;font-size:clamp(1.65rem,3vw,2.4rem);letter-spacing:-.035em}.hero p{margin:0;color:#ccece7}.notice{margin-bottom:18px;padding:14px 16px;border-radius:12px;background:#eef7f5;border:1px solid #b8ddd6;color:var(--dark)}.notice.error{background:#ffeded;border-color:#efb0b0;color:#7f2828}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{padding:20px}.stat-label{color:var(--muted);font-weight:750;font-size:.88rem}.stat-value{font-size:clamp(1.65rem,3vw,2.35rem);line-height:1.15;margin-top:8px;font-weight:900}.stat-sub{color:var(--muted);font-size:.83rem;margin-top:6px}.best{background:linear-gradient(150deg,#fff8df,#fffdf8);border-color:#efdba1}.dash-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:16px}.chart-card,.history-card{padding:22px;min-width:0}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.section-head h3{margin:0;font-size:1.05rem}#chart{display:block;width:100%;height:230px}.empty{padding:34px 16px;text-align:center;color:var(--muted)}.history-wrap{max-height:270px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{padding:10px 8px;border-bottom:1px solid #ece7dc;text-align:left;white-space:nowrap}th{color:var(--muted);font-size:.76rem;text-transform:uppercase;letter-spacing:.06em}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0}.actions .spacer{flex:1}
    .quiz{display:none;padding:clamp(22px,5vw,46px)}.quiz.show,.result.show{display:block}.quiz-top{display:flex;justify-content:space-between;gap:14px;margin-bottom:12px}.qcount{font-weight:900;color:var(--dark)}.live{color:var(--muted);font-weight:750}.progress{height:8px;overflow:hidden;border-radius:99px;background:#e6e2d8;margin-bottom:30px}.progress div{height:100%;width:0;background:linear-gradient(90deg,var(--teal),#36ae9e)}.tag{display:inline-block;margin-bottom:12px;padding:5px 10px;border-radius:8px;background:#e9f3f0;color:var(--dark);font-size:.78rem;font-weight:850}.question{font-size:clamp(1.25rem,2.4vw,1.75rem);line-height:1.3;letter-spacing:-.025em;margin-bottom:16px}.hint-wrap{margin-bottom:18px}.hint{margin-top:10px;padding:12px 14px;border-left:4px solid var(--gold);border-radius:8px;background:#fff8df;color:#654b15}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{min-height:68px;display:flex;align-items:center;gap:12px;padding:14px 16px;color:var(--ink);text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px}.option:hover:not(:disabled){transform:translateY(-1px);border-color:var(--teal);background:#f4fbf9}.option:disabled{cursor:default;opacity:1}.option.correct{border-color:#57a878;background:#eaf7ee;color:#155e38}.option.wrong{border-color:#da7777;background:#fff0f0;color:#8f2929}.letter{flex:0 0 32px;height:32px;display:grid;place-items:center;border-radius:9px;background:#f0eee8;font-weight:900}.fill-form{grid-column:1/-1;display:flex;gap:10px;align-items:stretch}.fill-input{min-width:0;flex:1;padding:15px 16px;border:1.5px solid var(--line);border-radius:13px;outline:0;font:700 1rem/1.4 ui-monospace,monospace}.fill-input:focus{border-color:var(--teal);box-shadow:0 0 0 4px #087e781f}.fill-input.correct{border-color:#57a878;background:#eaf7ee}.fill-input.wrong{border-color:#da7777;background:#fff0f0}.feedback{display:none;margin-top:20px;padding:17px 18px;border-left:4px solid var(--teal);border-radius:10px;background:#eef7f5}.feedback.show{display:block}.feedback strong{display:block;margin-bottom:4px}.quiz-foot{display:flex;justify-content:flex-end;margin-top:22px}.result{display:none;padding:clamp(28px,6vw,60px);text-align:center}.result-emoji{font-size:4.6rem;line-height:1}.result h2{font-size:clamp(2rem,5vw,3.7rem);letter-spacing:-.045em;margin:14px 0 4px}.result-score,.save{color:var(--muted)}.record{display:none;width:fit-content;margin:18px auto 0;padding:9px 14px;border-radius:999px;background:#fff0c5;color:#765412;font-weight:900}.record.show{display:block}.save{margin:18px auto}.result-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.review{margin-top:30px;text-align:left}.review-item{padding:16px 0;border-top:1px solid var(--line)}.review-item p{margin:5px 0}.right{color:var(--good);font-weight:800}
    html[data-theme="purple"]{--ink:#2a2140;--muted:#6a5d7b;--paper:#f5f0fa;--card:#fff;--line:#cdbce0;--teal:#7650a3;--dark:#513174;--coral:#b13d68;--gold:#d39a2e;--good:#2d7253;--bad:#a7354a;--shadow:0 18px 50px #51317420;--bg-a:#eee6f7;--bg-b:#fbf9fd;--soft:#f0e9f8;--soft-line:#d6c3e8;--art:#a681c3;--hint-bg:#fff6d9;--best-bg:#fff5dd;--best-line:#dfc06d}
    html[data-theme="green"]{--ink:#17352f;--muted:#587269;--paper:#eef7f2;--card:#fff;--line:#b8d3c8;--teal:#3a8068;--dark:#245b49;--coral:#a63f59;--gold:#c99825;--good:#216b49;--bad:#a63f59;--shadow:0 18px 50px #245b491f;--bg-a:#e4f2e9;--bg-b:#f8fcf9;--soft:#e6f3ec;--soft-line:#b7d8c9;--art:#82b79d;--hint-bg:#fff6d9;--best-bg:#fff4df;--best-line:#dfbd69}
    html[data-theme="winter"]{--ink:#14263d;--muted:#53687e;--paper:#edf6fb;--card:#fff;--line:#bfd3e2;--teal:#167d8d;--dark:#163c66;--coral:#a7354a;--gold:#d29a20;--good:#23704a;--bad:#a7354a;--shadow:0 18px 50px #163c661c;--bg-a:#e5f2f9;--bg-b:#f7fbfd;--soft:#e7f4f7;--soft-line:#a9d1d8;--art:#9ecbda;--hint-bg:#fff7dc;--best-bg:#fff8e5;--best-line:#e4c777}
    html[data-theme="yellow"]{--ink:#263247;--muted:#687386;--paper:#fffaf0;--card:#fff;--line:#ddc77f;--teal:#9b7517;--dark:#324c69;--coral:#a73d59;--gold:#d5a51f;--good:#347052;--bad:#a73d59;--shadow:0 18px 50px #7155121f;--bg-a:#fff1bd;--bg-b:#fffdf6;--soft:#fff4cd;--soft-line:#dfc56d;--art:#d4af48;--hint-bg:#eef6f8;--best-bg:#e9f4f7;--best-line:#8ab9c7}
    html[data-theme]:not([data-theme="default"]) body{background:linear-gradient(180deg,var(--bg-a) 0,var(--bg-b) 45%,var(--paper) 100%)}html[data-theme]:not([data-theme="default"]) .panel{background:#ffffffed;border-color:var(--line)}html[data-theme]:not([data-theme="default"]) .art{background:linear-gradient(145deg,var(--dark),var(--teal) 68%,var(--art))}html[data-theme]:not([data-theme="default"]) .orb{display:none}html[data-theme]:not([data-theme="default"]) .hero{background:linear-gradient(115deg,var(--dark),var(--teal))}html[data-theme]:not([data-theme="default"]) .notice,html[data-theme]:not([data-theme="default"]) .feedback{background:var(--soft);border-color:var(--soft-line)}html[data-theme]:not([data-theme="default"]) .hint{background:var(--hint-bg);color:var(--ink)}html[data-theme]:not([data-theme="default"]) .best{background:var(--best-bg);border-color:var(--best-line)}html[data-theme]:not([data-theme="default"]) th,html[data-theme]:not([data-theme="default"]) td{border-color:var(--line)}
    @media(max-width:820px){.login{grid-template-columns:1fr}.art{min-height:320px}.stats,.dash-grid,.options{grid-template-columns:1fr}}@media(max-width:520px){.shell{width:calc(100% - 20px);padding-top:16px}.brand small,.user>span:not(.avatar){display:none}.login-copy{padding:28px 22px}.hero,.stat,.chart-card,.history-card{padding:18px}.quiz-top{flex-direction:column}.fill-form{flex-direction:column}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand"><div class="mark">Q</div><div id="brandTitle">Lesson Quiz<small id="brandSub">REVIEW LAB</small></div></div><div class="user" id="user" hidden><span class="avatar" id="avatar">L</span><span id="userName"></span></div></header>
    <section class="panel login" id="login">
      <div class="login-copy"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="lede" id="subtitle"></p><div class="pills"><span class="pill" id="bankPill"></span><span class="pill" id="attemptPill"></span><span class="pill" id="storagePill"></span></div><form class="login-form" id="loginForm"><label for="name" id="nameLabel"></label><input id="name" type="text" autocomplete="name" maxlength="100" required><button class="btn" id="enter" type="submit"></button><div class="help" id="storageHelp"></div><div class="notice error" id="loginError" hidden></div></form></div>
      <div class="art" aria-hidden="true"><div class="orb a"></div><div class="orb b"></div><div class="code one"><span class="key">learn</span>.<span class="call">map</span>(idea =&gt; recall(idea))<br><span class="note">// practice makes progress</span></div><div class="code two"><span class="key">result</span> = <span class="call">challenge</span>(<span class="key">today</span>)</div></div>
    </section>
    <section id="app">
      <div class="panel hero"><h2 id="welcome"></h2><p id="encourage"></p></div><div class="notice" id="notice"></div>
      <div id="dashboard"><div class="stats"><article class="panel stat"><div class="stat-label" id="totalLabel"></div><div class="stat-value" id="total">0</div><div class="stat-sub" id="totalSub"></div></article><article class="panel stat"><div class="stat-label" id="latestLabel"></div><div class="stat-value" id="latest">—</div><div class="stat-sub" id="latestSub"></div></article><article class="panel stat best"><div class="stat-label" id="bestLabel"></div><div class="stat-value" id="best">—</div><div class="stat-sub" id="bestSub"></div></article></div>
        <div class="dash-grid"><article class="panel chart-card"><div class="section-head"><h3 id="trendLabel"></h3><span class="help">%</span></div><div class="empty" id="chartEmpty"></div><canvas id="chart"></canvas></article><article class="panel history-card"><div class="section-head"><h3 id="historyLabel"></h3><span class="help" id="historyCount"></span></div><div class="empty" id="historyEmpty"></div><div class="history-wrap" id="historyWrap" hidden><table><thead><tr><th id="timeHead"></th><th id="scoreHead"></th><th id="levelHead"></th></tr></thead><tbody id="historyBody"></tbody></table></div></article></div>
      </div>
      <div class="actions" id="mainActions"><button class="btn" id="start"></button><button class="btn secondary" id="importBtn"></button><button class="btn ghost" id="exportBtn"></button><input id="csvInput" type="file" accept=".csv,text/csv" hidden><div class="spacer"></div><button class="btn ghost" id="switchUser"></button></div>
      <section class="panel quiz" id="quiz" aria-live="polite"><div class="quiz-top"><div class="qcount" id="qcount"></div><div class="live" id="live"></div></div><div class="progress"><div id="bar"></div></div><span class="tag" id="topic"></span><h2 class="question" id="question"></h2><div class="hint-wrap" id="hintWrap"><button class="btn ghost" id="hintBtn" type="button"></button><div class="hint" id="hint" hidden></div></div><div class="options" id="options"></div><div class="feedback" id="feedback"><strong id="feedbackTitle"></strong><span id="feedbackText"></span></div><div class="quiz-foot"><button class="btn" id="next" disabled></button></div></section>
      <section class="panel result" id="result" aria-live="polite"><div class="result-emoji" id="resultEmoji"></div><h2 id="resultTitle"></h2><div class="result-score" id="resultScore"></div><div class="record" id="record"></div><div class="save" id="save"></div><div class="result-actions"><button class="btn" id="again"></button><button class="btn ghost" id="resultExport"></button><button class="btn ghost" id="back"></button></div><div class="review" id="review"></div></section>
    </section>
  </main>
  <script>
    const QUIZ={"meta":{"id":"pandas-string-datetime-ewm-24-25-en","title":"Pandas: Decode Text, Tame Time, Master EMA!","subtitle":"Real-world string cleaning, datetime workflows and EWM/EMA","attemptSize":20,"language":"en","theme":"winter","bankSize":50},"questions":[{"id":"q01","t":"24 - Real-world string cleaning","q":"An Excel table stores SCORE as text such as 'Math: 2.00 Literature: 5.50'. What should you do before computing a mean Math score?","h":"First identify the Math token, then consider the dtype of the extracted text. A column that looks numeric is not necessarily numeric.","c":["Extract Math's value and convert it to a numeric dtype","Average the original SCORE strings","Rename SCORE to Math and stop","Convert the whole SCORE column to category"],"a":0,"e":"The field contains several labeled values, not one number. Extract the relevant score and convert the extracted text to float before numeric calculations. Renaming changes a label, not the stored content. Captain Panda reads the ingredient label before putting anything in the calculator!"},{"id":"q02","t":"24 - Real-world string cleaning","q":"What is the distinction between df.rename(columns=...) and df.replace(...)?","h":"One edits column labels. The other edits values stored in the table.","c":["replace changes only the index name","rename changes column names; replace changes cell values","Both always change every cell","rename parses dates; replace sorts rows"],"a":1,"e":"rename(columns=...) maps column headers, such as a source-language header to SCORE. replace maps values inside cells. Neither operation automatically converts score text to float. New packaging does not change the ingredients!"},{"id":"q03","t":"24 - Real-world string cleaning","q":"Why does the lesson use SCORE.replace(subject_map,regex=True) to translate subject names inside long score strings?","h":"A whole cell contains more than one subject/value pair. Match parts of its text, not just whole-cell equality.","c":["It creates one row per subject automatically","It only renames the Series","Regex replacement can replace matching subject-name fragments inside each cell","It automatically computes subject averages"],"a":2,"e":"regex=True allows matching subject-name fragments within the larger score string. The surrounding scores remain for later extraction. It does not split the field or calculate statistics by itself. The translator changes signs inside the building, not the building's floor plan!"},{"id":"q04","t":"24 - Real-world string cleaning","type":"fill","q":"Fill in the accessor: df['SCORE'].___.extract(pattern,expand=False) applies string extraction columnwise.","h":"You have a Series of strings, not one Python string. Open its string-method toolbox.","answers":["str"],"e":"The .str accessor applies supported string operations elementwise to a Series. .str.extract uses a regular expression to capture content from each entry. It is different from calling a Python string method on the entire Series. One toolbox, many rows!"},{"id":"q05","t":"24 - Real-world string cleaning","q":"In r'Math:\\s*(\\d+\\.\\d+)', what does \\s* mean?","h":"The star means zero or more of the preceding pattern. Here that pattern represents whitespace.","c":["Allow zero or more whitespace characters after the colon","Require exactly one literal s","Capture the subject name","Match only a negative sign"],"a":0,"e":"\\s matches whitespace and * permits zero or more occurrences. Thus 'Math:2.00' and 'Math:   2.00' can both match. It does not determine the numeric value or capture the name. Some data like extra elbow room—this pattern allows it!"},{"id":"q06","t":"24 - Real-world string cleaning","q":"Why is the decimal dot written as \\. in the lesson's extraction pattern?","h":"A bare dot has a special regex meaning. You want the actual decimal punctuation.","c":["To split all subjects into rows","To match a literal decimal point","To make the score negative","To match an arbitrary character intentionally"],"a":1,"e":"Escaping the dot makes it literal. In contrast, a bare regex dot can match many characters, so the pattern could accept unintended separators. This makes score extraction more precise. A tiny backslash keeps Doctor Oops from accepting a banana as a decimal point!"},{"id":"q07","t":"24 - Real-world string cleaning","q":"What is captured by the parentheses in r'Math:\\s*(\\d+\\.\\d+)'?","h":"The subject name and colon are outside the parentheses. The capture contains digits, a literal dot and more digits.","c":["Only the word Math","The number of students","The numeric score text, such as '2.00'","The complete SCORE field"],"a":2,"e":"The capture group returns the numeric-looking substring, while the subject label helps locate it. For 'Math: 2.00 Literature: 5.50', the capture is '2.00'. It is still text until converted. The net catches the score, not the whole pond!"},{"id":"q08","t":"24 - Real-world string cleaning","q":"What does str.extract(pattern,expand=False) return when this pattern has one capture group?","h":"The number of capture groups matters. The lesson uses one group and disables DataFrame expansion.","c":["Always a Python float","A DataFrame with every original column","A list of subject names only","A Series of extracted values"],"a":3,"e":"With one capture group and expand=False, extract returns a Series. That lets the lesson chain .astype(float) and then assign results as a column. With different capture-group configuration, output structure can differ. Count the pockets before guessing the shape of the bag!"},{"id":"q09","t":"24 - Real-world string cleaning","q":"A row has 'Math: 4.50' but no English label. What does extracting English with the lesson's pattern produce?","h":"No match is not the same event as matching a score of zero.","c":["A missing extracted value","0.0 automatically","4.5 borrowed from Math","The word English"],"a":0,"e":"No regex match produces a missing extracted value, which remains missing after the lesson's float conversion. It does not prove the true English score was zero. The lesson later displays a not_attend marker, but extraction itself only establishes no match. An empty mailbox is not a zero-point letter!"},{"id":"q10","t":"24 - Real-world string cleaning","q":"The pattern requires digits on both sides of a decimal dot. Does 'Math: 8' match it?","h":"Check the required literal dot and the digits after it. There is no optional decimal group.","c":["Only when expand=True","No; the demonstrated pattern requires a decimal form such as 8.00","Yes, it always captures 8","Yes, it invents .00 automatically"],"a":1,"e":"The pattern \\d+\\.\\d+ requires a dot followed by digits, so integer-only text does not match. If the input format changes, the extraction pattern needs review. Do not interpret every no-match as nonattendance without checking the source format. Even a clever net needs the right mesh!"},{"id":"q11","t":"24 - Real-world string cleaning","type":"fill","q":"Fill in the dtype: extracted.astype(___) converts strings such as '2.00' to numeric scores. Use the Python type name.","h":"A score can have decimals, so integer conversion is not the intended step.","answers":["float"],"e":"astype(float) converts captured numeric text into floating-point values suitable for arithmetic. Existing missing captures remain missing in the demonstrated workflow. A label rename alone would not perform this conversion. Now the score can enter the calculator wearing the right uniform!"},{"id":"q12","t":"24 - Real-world string cleaning","q":"Why is an ID such as '018000001' useful to keep as text?","h":"An identifier is a label, not a measurement. Consider what integer conversion does to its first character.","c":["Text automatically calculates a better average","Integer conversion preserves all original formatting","Text IDs must always be used as dates","Text preserves leading zeros in the identifier"],"a":3,"e":"Converting this ID to an integer would discard its leading zero. Treating it as text preserves the original identifier format. The lesson uses ID as an index label, not as a quantity to average. A student's badge is not a lottery number to do arithmetic with!"},{"id":"q13","t":"24 - Real-world string cleaning","q":"What does df.assign(**subject_scores) do when subject_scores maps subject names to full-length extracted score arrays?","h":"The dictionary keys name columns; its values provide data. The double star unpacks the dictionary as keyword arguments.","c":["Adds or replaces the named subject columns","Deletes all original columns","Groups students by every score","Renames every row to a subject"],"a":0,"e":"assign receives each subject/value pair as a column update. Existing columns remain unless a later drop removes them. Full-length lists in the lesson follow row order; Series can align by index labels. The dictionary delivers labeled boxes, not a command to empty the warehouse!"},{"id":"q14","t":"24 - Real-world string cleaning","q":"What is a practical advantage of assigning extracted Series directly instead of converting them to lists?","h":"A Series carries index labels. A plain list carries only positional order.","c":["Lists always keep more dtype information","Series can preserve index-based alignment during assignment","Lists always repair invalid dates","Series automatically remove duplicate students"],"a":1,"e":"An extracted Series keeps the source index, helping assignment align by labels. A list is assigned positionally and must match the target row count and order. Both can work in the demonstrated unchanged-row workflow, but index changes deserve care. Keep address labels on the parcels!"},{"id":"q15","t":"24 - Real-world string cleaning","q":"After subject columns are added, what does drop(columns=['SCORE','BIRTHDAY','EXAM_LOCATION']) remove?","h":"This explicitly names columns, not students or missing rows.","c":["Only the labels while keeping duplicate hidden columns","All extracted subject scores","Those three columns from the result","All students missing those fields"],"a":2,"e":"The drop step removes the listed columns and keeps the other columns, including the new subject scores. It does not remove students just because a score is missing. Different cleanup operations target different things. Remove the empty packaging, not the entire team!"},{"id":"q16","t":"24 - Real-world string cleaning","type":"fill","q":"Fill in the method: result.___('ID') promotes student IDs to row labels.","h":"This selects an existing column as the index. It is not merely renaming current labels.","answers":["set_index"],"e":"set_index('ID') uses ID values as the index and by default removes ID from ordinary data columns. It does not calculate scores or sort students. The labels can remain zero-padded text. The badge gets promoted to the row's address!"},{"id":"q17","t":"24 - Real-world string cleaning","q":"What does result[subjects].notna().sum() count?","h":"First mark known values, then sum down each column. The subject columns are numeric at this stage.","c":["Non-missing extracted scores per subject","The sum of all scores per student","Missing entries per subject","Every student regardless of whether the subject matched"],"a":0,"e":"notna produces True for known extracted scores, and default sum counts these per subject column. Different subjects can have different counts. This is coverage of extracted data, not a score total or proof of attendance. Check who supplied a score before announcing the class average!"},{"id":"q18","t":"24 - Real-world string cleaning","q":"What is a consequence of filling numeric score gaps with the text 'not_attend'?","h":"Ask whether a column can stay a plain numeric float column while storing words too.","c":["It converts every gap to numeric zero","The result is no longer a purely numeric score representation","It guarantees the same numeric dtype","It proves each unmatched subject was not attended"],"a":1,"e":"Mixing a text marker into score values can change dtype or require explicit conversion on stricter versions. Keep a numeric score table for calculations and a separate display copy if needed. Also, no-match alone does not prove why the data are missing. A friendly label should not sneak into your arithmetic!"},{"id":"q19","t":"24-25 - Datetime parsing and calendar groups","q":"Birthday text is '12/03/1998'. What does format='%d/%m/%Y' mean?","h":"Read the format tokens in order: day, month, four-digit year.","c":["March 1992","An automatically inferred Unix timestamp","12 March 1998","3 December 1998"],"a":2,"e":"%d/%m/%Y explicitly means day/month/year, so 12/03/1998 is 12 March. Explicit parsing avoids relying on ambiguous day/month inference. It does not change the real birthday. Give the calendar a map instead of asking it to guess the route!"},{"id":"q20","t":"24-25 - Datetime parsing and calendar groups","type":"fill","q":"Fill in the errors option: pd.to_datetime(raw,format='%d/%m/%Y',errors='___') converts invalid dates to missing datetimes.","h":"Choose the option that coerces bad input rather than raising an exception.","answers":["coerce"],"e":"errors='coerce' turns invalid or incompatible inputs into NaT. It allows conversion to finish, but you must inspect the failures rather than pretend they were repaired. The original text is useful for diagnosis. A rejected passport needs investigation, not a new invented birthday!"},{"id":"q21","t":"24-25 - Datetime parsing and calendar groups","q":"What does NaT represent after datetime parsing?","h":"It is the datetime counterpart of a missing value, not a real date at midnight.","c":["A missing/invalid datetime value","The first day of the current year","A numeric score of zero","A timezone name"],"a":0,"e":"NaT means Not a Time: a missing datetime-like value. With errors='coerce', invalid birthday strings become NaT. Detect it with isna rather than treating it as a valid calendar date. The calendar left a blank card, not a secret appointment!"},{"id":"q22","t":"24-25 - Datetime parsing and calendar groups","q":"Why does '29/02/1998' fail the demonstrated birthday parse?","h":"A correct-looking day/month pattern is not enough: the calendar date must actually exist.","c":["The year must have only two digits","1998 is not a leap year, so February 29 is invalid","Every February 29 is invalid","%d always means month"],"a":1,"e":"The format matches the expected layout, but 1998 has no February 29. errors='coerce' therefore produces NaT. Parsing validates more than punctuation; it also checks calendar feasibility. A neatly printed ticket still cannot book a nonexistent day!"},{"id":"q23","t":"24-25 - Datetime parsing and calendar groups","q":"Which workflow best diagnoses birthday parsing failures without losing the bad original text?","h":"Keep raw strings, parse a separate Series, then use the missing-result mask on the raw data.","c":["Replace every NaT with today's date without checking","Sort by score and ignore birthday values","raw = df['BIRTHDAY'].copy(); parsed = pd.to_datetime(raw,format='%d/%m/%Y',errors='coerce'); raw.loc[parsed.isna()]","Overwrite raw text first, then expect NaT to reveal the old spelling"],"a":2,"e":"Keeping raw lets you inspect the original strings at failed parse locations. parsed.isna() marks failures or original missing entries; select those rows from raw to investigate. NaT itself does not remember the discarded text. Save the evidence before cleaning the crime scene!"},{"id":"q24","t":"24-25 - Datetime parsing and calendar groups","q":"The lesson's default row index happens to match positions. If you later use custom labels, how should invalid_idx labels select the raw birthday Series?","h":"iloc selects positions; loc selects labels. Preserve matching indexes between raw and parsed data.","c":["Always use raw.iloc[invalid_idx] even for text labels","Pass invalid_idx as a datetime format","Convert every row label to a score","Use raw.loc[invalid_idx] when invalid_idx contains index labels"],"a":3,"e":"isna-result indexes contain labels. With matching raw/parsed indexes, loc retrieves those labels correctly. iloc works on positional integers and only coincides with labels in special cases such as an unchanged default RangeIndex. Address labels are not seat numbers!"},{"id":"q25","t":"24-25 - Datetime parsing and calendar groups","q":"What does %z describe in format='%Y-%m-%d %H:%M:%S%z'?","h":"The time string in the lesson includes an offset such as +00:00. One token captures that information.","c":["The UTC offset/timezone offset in the input","The month name","A decimal score","The number of rows in a rolling window"],"a":0,"e":"%z parses a numeric UTC offset, producing timezone-aware timestamps for the lesson's uniformly offset data. It is different from the year, hour or seconds token. Keep the offset rather than silently comparing local clocks as if they were identical. Time has an address too!"},{"id":"q26","t":"24-25 - Datetime parsing and calendar groups","type":"fill","q":"Fill in the accessor: df['date'].___.month extracts month numbers after datetime conversion.","h":"Use the datetime toolbox, not the string toolbox. Parsing must happen first.","answers":["dt"],"e":"The .dt accessor exposes datetime properties such as month, year and weekday. It belongs on datetime-like Series. Reading a CSV date column as text does not automatically make .dt available. Give the column its datetime passport first!"},{"id":"q27","t":"24-25 - Datetime parsing and calendar groups","q":"For parsed dates 2024-01-10 and 2024-03-05, what does .dt.month return?","h":"Extract the month component from each timestamp. This is not a formatted month-name string.","c":["[10,5]","[2024,2024]","[1,3]","['January','March']"],"a":2,"e":".dt.month returns numeric month components, so January gives 1 and March gives 3. Days would be 10 and 5; years would be 2024. Calendar parts are separate drawers—open the right one!"},{"id":"q28","t":"24-25 - Datetime parsing and calendar groups","q":"What does df['date'].min() return after successful datetime parsing?","h":"On datetime values, minimum means earliest on the timeline, not the shortest text.","c":["The most frequent month","The last row regardless of its date","A count of invalid dates","The earliest non-missing timestamp"],"a":3,"e":"Datetime min finds the earliest valid timestamp; max finds the latest. Parsing ensures comparison uses datetime semantics rather than relying on raw text layouts. A shuffled table's first row need not be its earliest observation. Read the clock, not the seating order!"},{"id":"q29","t":"24-25 - Datetime parsing and calendar groups","q":"In groupby([df['date'].dt.weekday,'location']), what do weekday values 0 and 6 represent?","h":"Pandas' weekday numbering starts at Monday and ends at Sunday.","c":["0=Monday, 6=Sunday","0=Sunday, 6=Saturday","0=January, 6=July","0=midnight, 6=6 a.m."],"a":0,"e":".dt.weekday uses Monday=0 through Sunday=6. Combined with location, the lesson computes a mean for each weekday/location pair. This groups by day of week across dates, not by one specific calendar date. Seven weekday buckets can hold many different weeks!"},{"id":"q30","t":"24-25 - Datetime parsing and calendar groups","q":"What does pd.Grouper(key='date',freq='5D') define in the air-quality example?","h":"D denotes days. The number describes a time interval, not how many rows happen to arrive.","c":["Five separate countries","Five-day time bins using the datetime date column","Groups of exactly five observations","Only rows from the fifth day of each month"],"a":1,"e":"Grouper builds calendar-time bins based on the datetime key. Adding country makes each summary specific to a bin/country pair. Uneven sampling means different bins can contain different row counts. A five-day bucket is not a five-person team!"},{"id":"q31","t":"24-25 - Datetime parsing and calendar groups","q":"Why does the Paris workflow use set_index('date').sort_index() before time-based rolling?","h":"The rolling duration needs a datetime-based axis, and chronological order makes the trailing window meaningful.","c":["To force exactly two observations into every window","To remove all missing measurements automatically","To provide a chronologically ordered DatetimeIndex","To turn every date into a score"],"a":2,"e":"The demonstrated rolling('2h') reads a time-based index. Setting date as index and sorting it prepares the timeline before calculating trailing windows. Sorting is not imputation and two hours is not two rows. Put the story in time order before calculating its memory!"},{"id":"q32","t":"24-25 - Datetime parsing and calendar groups","q":"The data include multiple location stations. Why should you check the grouping scope before smoothing a single station's history?","h":"Filtering a city is not necessarily the same as selecting one station. Think about whose measurements enter the sequence.","c":["Every city always has exactly one station","Datetime parsing automatically groups by station","An EMA silently separates all text categories","Pooling several stations can mix different histories into one rolling or EMA sequence"],"a":3,"e":"The lesson filters Paris, while location is also present as a distinct field. For a per-station question, select or group the intended station before smoothing its numeric sequence. A smoother only sees the input sequence you give it. Do not blend the teammates' diaries and call it one person's memory!"},{"id":"q33","t":"25 - Rolling, expanding and EWM/EMA","q":"For s=[10,14,8], what does s.rolling(2).mean() return with default min_periods?","h":"An integer window needs two observations by default. Then average each trailing pair.","c":["[NaN,12,11]","[10,12,11]","[10,12,10]","[NaN,NaN,32/3]"],"a":0,"e":"The first window has only one observation, so it is NaN under the default two-observation requirement. The next means are (10+14)/2=12 and (14+8)/2=11. This is a fixed-count sliding window, not a cumulative mean. Two-seat windows wait for two passengers!"},{"id":"q34","t":"25 - Rolling, expanding and EWM/EMA","q":"How does rolling('2h') differ from rolling(2)?","h":"One window is a duration; the other is an observation count. Real-world time gaps are not always equal.","c":["2 requires a timezone column","'2h' selects a trailing time interval; 2 selects two observations","Both always use exactly two rows","'2h' always means a centered window"],"a":1,"e":"A duration window covers the last two hours, which may contain one, two or many measurements. An integer window uses the last two observations regardless of elapsed time. That distinction matters with irregular data. Two hours at a busy station can host many more visitors than two rows!"},{"id":"q35","t":"25 - Rolling, expanding and EWM/EMA","q":"Times are 09:00,09:02,09:03 with values [10,20,30]. Under default trailing rolling('2min'), what is the mean at 09:02?","h":"The default time window is open on the left and closed on the right: (09:00,09:02].","c":["10","25","20","15"],"a":2,"e":"At 09:02, the point exactly at the left boundary 09:00 is excluded by the default right-closed window. Only value 20 is included, so the mean is 20. At 09:03, 20 and 30 are inside. Boundary brackets are tiny, but they decide who gets through the door!"},{"id":"q36","t":"25 - Rolling, expanding and EWM/EMA","q":"For a duration-based rolling window, why can the first observed value already have a mean?","h":"Unlike an integer window's default, a time-offset window defaults to needing one observation.","c":["It fills earlier hours with zero automatically","It borrows future observations automatically","All windows ignore min_periods","Its default min_periods is 1"],"a":3,"e":"Time-offset rolling defaults to min_periods=1, so a first valid observation can produce its own mean. Integer rolling(window=2) defaults to requiring two. Explicitly set min_periods if your task needs a different minimum. Same family, different entry-ticket rules!"},{"id":"q37","t":"25 - Rolling, expanding and EWM/EMA","q":"What does s.expanding(min_periods=2).mean() return for [10,14,8]?","h":"Include every observation from the beginning through the current row. Wait until two known values exist.","c":["[NaN,12,32/3]","[NaN,12,11]","[10,14,8]","[NaN,NaN,8]"],"a":0,"e":"The first result is missing because only one observation is available. Then mean=(10+14)/2=12; finally all three give 32/3. Rolling(2) would drop the oldest observation at the third row. Expanding keeps the whole scrapbook!"},{"id":"q38","t":"25 - Rolling, expanding and EWM/EMA","type":"fill","q":"Fill in the method: s.___(span=3,adjust=False).mean() calculates the lesson's recursive exponentially weighted mean.","h":"First create the exponentially weighted window object, then request its mean.","answers":["ewm"],"e":"ewm sets weighting and calculation options; .mean() requests the weighted mean. EWM is the window family, while EMA/EWMA names the resulting exponentially weighted average in this context. Calling ewm alone does not produce the final average values. Set the gadget, then press calculate!"},{"id":"q39","t":"25 - Rolling, expanding and EWM/EMA","q":"What is the main weighting idea behind the lesson's EMA?","h":"Compare a recent observation with an older one. Their influence does not need to be equal.","c":["Only the newest observation can ever matter","It assigns bigger weights to future values","Older observations have exponentially decaying influence while recent data receive more weight","All historical observations always receive equal weights"],"a":2,"e":"The exponentially weighted mean gives progressively less weight to older data while retaining historical influence. It is different from expanding's equal-weight mean and a fixed rolling window that discards older entries completely. Panda remembers history, but the latest message gets a louder microphone!"},{"id":"q40","t":"25 - Rolling, expanding and EWM/EMA","q":"Using alpha=2/(span+1), what alpha corresponds to span=3?","h":"Substitute 3, add 1, then divide 2 by that denominator.","c":["0.75","1/3","3","0.5"],"a":3,"e":"alpha=2/(3+1)=0.5. In the adjust=False update this gives half the weight to the latest value and half to the previous EMA. span is a decay parameter, not a command to keep exactly three old rows. A memory dial is not a pair of scissors!"},{"id":"q41","t":"25 - Rolling, expanding and EWM/EMA","q":"What alpha corresponds to span=2 in the lesson?","h":"The denominator is span+1=3, not span=2.","c":["2/3","1/2","1/3","2"],"a":0,"e":"alpha=2/(2+1)=2/3. The remaining factor 1-alpha is 1/3, so historical influence shrinks by that factor per observation step. In the recursive update, the newest value gets weight 2/3. Doctor Oops can boast, but the denominator still needs its +1!"},{"id":"q42","t":"25 - Rolling, expanding and EWM/EMA","q":"For observations x and adjust=False, which update is correct?","h":"Combine the newest observation with the previous weighted mean; the two coefficients sum to one.","c":["y_t = mean of exactly the last span rows","y_t = alpha*x_t + (1-alpha)*y_(t-1), with y_0=x_0","y_t = x_t + y_(t-1), with y_0=0","y_t = alpha*x_(t+1), using tomorrow's value"],"a":1,"e":"For the no-missing examples here, adjust=False uses the stated recursive update starting at the first observation. It blends the newest value with the previous EMA, not the full raw history equally. No future observation is needed. Two ingredients, weights totaling one, and no time travel!"},{"id":"q43","t":"25 - Rolling, expanding and EWM/EMA","q":"s=[10,14], span=3, adjust=False. What is the second EMA value?","h":"alpha is 0.5. Start y_0=10, then blend x_1=14 with y_0.","c":["12.6667","10","12","14"],"a":2,"e":"The second EMA is 0.5*14+0.5*10=12. Returning 14 would discard history; 10 would ignore the new value. About 12.6667 belongs to the normalized adjust=True calculation here. Keep the adjustment setting on your scratchpad!"},{"id":"q44","t":"25 - Rolling, expanding and EWM/EMA","q":"s=[10,14,8], span=3, adjust=False. After y_1=12, what is y_2?","h":"The next step blends the new 8 with the previous EMA 12, not with just the previous raw observation 14.","c":["11","32/3","8","10"],"a":3,"e":"y_2=0.5*8+0.5*12=10. The last-two-observation rolling mean is (14+8)/2=11, while the expanding mean is 32/3. The previous EMA summarizes decayed history. Carry the summary forward, not the wrong suitcase!"},{"id":"q45","t":"25 - Rolling, expanding and EWM/EMA","q":"What is the default value of adjust in the Series EWM example, and what does it imply?","h":"The Series lesson explains the default as a normalized weighted calculation over available history.","c":["adjust=True; normalize the decaying weighted sum by its weight sum","adjust=False; always use a fixed-size rolling mean","adjust=True; delete the first span rows","adjust=False; use future observations"],"a":0,"e":"The default is adjust=True. It normalizes geometrically decaying weights across observations up to the current point. That is not generally identical to the adjust=False recurrence during initialization. The DataFrame lesson explicitly chooses False, so read the option rather than trusting the method name alone!"},{"id":"q46","t":"25 - Rolling, expanding and EWM/EMA","q":"s=[10,14], span=3, adjust=True. What is the second EWM mean?","h":"alpha=0.5. Current value has weight 1 and the previous value weight 0.5; divide by their total 1.5.","c":["14/2 = 7","(14+0.5*10)/1.5 = 12.6667 approximately","0.5*14+0.5*10 = 12","14+10 = 24"],"a":1,"e":"With adjust=True, the numerator is 14+0.5*10=19 and the denominator is 1+0.5=1.5, giving about 12.6667. Normalization distinguishes this from the second adjust=False value 12. Same input, different initialization rule—neither result needs a conspiracy theory!"},{"id":"q47","t":"25 - Rolling, expanding and EWM/EMA","q":"All else equal, which span generally responds faster to a new observation in the recursive EMA?","h":"Smaller span gives larger alpha. Compare alpha=2/(span+1).","c":["Both always respond identically","The span controls column names only","The smaller span","The larger span"],"a":2,"e":"A smaller span implies larger alpha, placing more weight on the latest observation. A larger span retains more influence from past values and generally smooths more. This describes responsiveness, not prediction accuracy. A faster microphone can amplify noise as well as useful news!"},{"id":"q48","t":"25 - Rolling, expanding and EWM/EMA","q":"Does ewm(span=3) discard every observation older than three rows?","h":"Contrast exponential decay with a fixed-count rolling window. A small old weight is not the same as an explicitly dropped row.","c":["Yes, it is identical to rolling(3)","Yes, and it deletes those rows from the original table","No, because it uses only future rows instead","No; span controls decay rather than a hard three-row cutoff"],"a":3,"e":"span sets alpha and therefore how quickly influence decays. In the demonstrated EWM mean, older history can continue to affect results rather than being cut off at a fixed window boundary. rolling(3) is the fixed-three-observation alternative. A fading memory is not a shredded notebook!"},{"id":"q49","t":"25 - Rolling, expanding and EWM/EMA","q":"What does min_periods control when calculating a window mean?","h":"Think about the minimum evidence required before showing a result, not the decay rate.","c":["The minimum number of valid observations required for a non-missing result","The exact alpha value","A guarantee that the result predicts the next observation","The number of subject columns to extract"],"a":0,"e":"min_periods can suppress early outputs until enough non-missing observations exist. It does not redefine alpha or turn an expanding window into a rolling one. The lesson demonstrates this with expanding(min_periods=2) and 5. A waiting rule is not a new memory rule!"},{"id":"q50","t":"25 - Rolling, expanding and EWM/EMA","q":"Which description best distinguishes rolling, expanding and EWM means for the no-missing examples?","h":"Ask three questions: hard recent window, all history equally, or decaying historical influence?","c":["EWM is simply a renamed string-extraction operation","Rolling uses a recent window; expanding uses all history equally; EWM uses exponential decay","All three always produce identical values","Expanding keeps only the newest observation"],"a":1,"e":"Rolling averages observations inside its selected window. Expanding's mean uses all observations from the start equally. EWM applies exponential decay and depends on its options such as adjust. Choose the memory style that matches the analysis question. Three gadgets, three memory personalities!"}]};

    const T=I18N[QUIZ.meta.language]||I18N.en,$=id=>document.getElementById(id),S={name:"",history:[],quiz:[],index:0,correct:0,answers:[],locked:false};
    document.documentElement.lang=QUIZ.meta.language||"en";document.documentElement.dataset.theme=QUIZ.meta.theme||"default";document.title=QUIZ.meta.title;$("brandTitle").childNodes[0].nodeValue=QUIZ.meta.title;$("title").textContent=QUIZ.meta.title;$("subtitle").textContent=QUIZ.meta.subtitle;$("eyebrow").textContent=T.eyebrow;$("nameLabel").textContent=T.name;$("name").placeholder=T.namePh;$("enter").textContent=T.enter;$("bankPill").textContent=T.bank(QUIZ.meta.bankSize);$("attemptPill").textContent=T.attempt(QUIZ.meta.attemptSize);$("storagePill").textContent=T.storage;$("storageHelp").textContent=T.storageHelp;
    [["totalLabel",T.total],["latestLabel",T.latest],["bestLabel",T.best],["trendLabel",T.trend],["historyLabel",T.history],["timeHead",T.time],["scoreHead",T.score],["levelHead",T.level],["start",T.start(QUIZ.meta.attemptSize)],["importBtn",T.import],["exportBtn",T.export],["switchUser",T.switchUser],["again",T.again],["resultExport",T.export],["back",T.back]].forEach(([id,v])=>$(id).textContent=v);$("totalSub").textContent=T.attemptDone(QUIZ.meta.attemptSize);$("chartEmpty").textContent=T.chartEmpty;$("historyEmpty").textContent=T.historyEmpty;
    const shuffle=a=>{a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},pct=n=>Number.isInteger(n)?String(n):n.toFixed(2).replace(/0+$/,"").replace(/\.$/,""),level=p=>T.levels.find(x=>p>=x.min),key=()=>`lesson-quiz::${QUIZ.meta.id}::${S.name.normalize("NFC").toLocaleLowerCase()}`;
    function load(){try{const x=JSON.parse(localStorage.getItem(key())||"[]");return Array.isArray(x)?x:[]}catch{return[]}}function save(){localStorage.setItem(key(),JSON.stringify(S.history))}function stamp(){const d=new Date(),p=(n,w=2)=>String(n).padStart(w,"0"),base=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;if(!S.history.some(x=>x.time===base))return base;let v=`${base}.${p(d.getMilliseconds(),3)}`,n=2;while(S.history.some(x=>x.time===v))v=`${base}.${p(d.getMilliseconds(),3)}-${n++}`;return v}
    function esc(v){v=String(v);return/[",\r\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v}function csv(){return"\uFEFF"+["Name",...S.history.map(x=>x.time)].map(esc).join(",")+"\r\n"+[S.name,...S.history.map(x=>`${x.correct}/${x.total} (${pct(x.percent)}%) - ${x.label}`)].map(esc).join(",")+"\r\n"}function parseCsv(text){text=text.replace(/^\uFEFF/,"");const rows=[];let row=[],cell="",q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}else if(c==='"')q=true;else if(c===","){row.push(cell);cell=""}else if(c==="\n"){row.push(cell.replace(/\r$/,"") );rows.push(row);row=[];cell=""}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}if(q||rows.length!==2||rows[1][0]!==S.name||rows[0].length!==rows[1].length)throw Error(T.badCsv);return rows[0].slice(1).map((time,i)=>{const m=rows[1][i+1].match(/^(\d+)\/(\d+) \(([\d.]+)%\) - (.+)$/);if(!m)throw Error(T.badCsv);return{time,correct:+m[1],total:+m[2],percent:+m[3],label:m[4]}})}
    $("loginForm").addEventListener("submit",e=>{e.preventDefault();S.name=$("name").value.trim();if(!S.name)return;S.history=load();$("login").style.display="none";$("app").style.display="block";$("user").hidden=false;$("userName").textContent=S.name;$("avatar").textContent=S.name[0].toUpperCase();$("welcome").textContent=T.welcome(S.name);$("encourage").textContent=T.encourage;$("notice").textContent=T.notice;renderDash()});$("switchUser").onclick=()=>location.reload();
    function renderDash(){const h=S.history;$("total").textContent=h.length;$("historyCount").textContent=`${h.length}`;if(!h.length){$("latest").textContent=$("best").textContent="—";$("latestSub").textContent=T.noData;$("bestSub").textContent=T.firstMilestone;$("chart").style.display="none";$("chartEmpty").style.display="block";$("historyWrap").hidden=true;$("historyEmpty").style.display="block";return}const last=h.at(-1),best=h.reduce((a,b)=>b.percent>a.percent?b:a);$("latest").textContent=`${last.correct}/${last.total}`;$("latestSub").textContent=`${pct(last.percent)}% · ${last.label}`;$("best").textContent=`${best.correct}/${best.total}`;$("bestSub").textContent=`${pct(best.percent)}% · ${best.label}`;$("historyBody").replaceChildren(...[...h].reverse().map(x=>{const tr=document.createElement("tr");[x.time,`${x.correct}/${x.total} · ${pct(x.percent)}%`,x.label].forEach(v=>{const td=document.createElement("td");td.textContent=v;tr.append(td)});return tr}));$("chartEmpty").style.display="none";$("chart").style.display="block";$("historyEmpty").style.display="none";$("historyWrap").hidden=false;requestAnimationFrame(draw)}
    function draw(){const c=$("chart");if(!S.history.length)return;const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;const x=c.getContext("2d");x.scale(d,d);const w=r.width,h=r.height,p={l:38,r:15,t:15,b:30};x.font="12px system-ui";x.fillStyle="#718087";x.strokeStyle="#e4dfd5";[0,25,50,75,100].forEach(v=>{const y=p.t+(100-v)/100*(h-p.t-p.b);x.beginPath();x.moveTo(p.l,y);x.lineTo(w-p.r,y);x.stroke();x.fillText(v,7,y+4)});const pts=S.history.map((v,i)=>({x:S.history.length===1?(p.l+w-p.r)/2:p.l+i*(w-p.l-p.r)/(S.history.length-1),y:p.t+(100-v.percent)/100*(h-p.t-p.b)}));if(pts.length>1){x.beginPath();pts.forEach((v,i)=>i?x.lineTo(v.x,v.y):x.moveTo(v.x,v.y));x.strokeStyle="#087e78";x.lineWidth=3;x.stroke()}pts.forEach((v,i)=>{x.beginPath();x.arc(v.x,v.y,5,0,Math.PI*2);x.fillStyle=i===pts.length-1?"#e56b4d":"#087e78";x.fill()})}window.addEventListener("resize",()=>requestAnimationFrame(draw));
    function select(){const groups=[...new Set(QUIZ.questions.map(q=>q.t))].map(t=>shuffle(QUIZ.questions.filter(q=>q.t===t))),out=[];while(out.length<QUIZ.meta.attemptSize){let added=false;for(const g of shuffle(groups)){if(g.length&&out.length<QUIZ.meta.attemptSize){const q=g.pop(),opts=q.type==="fill"?null:shuffle(q.c.map((text,i)=>({text,ok:i===q.a})));out.push({...q,opts});added=true}}if(!added)break}return shuffle(out)}
    function start(){S.quiz=select();S.index=S.correct=0;S.answers=[];$("dashboard").style.display="none";$("mainActions").style.display="none";$("result").classList.remove("show");$("quiz").classList.add("show");renderQ();scrollTo({top:0})}$("start").onclick=$("again").onclick=start;
    function renderQ(){const q=S.quiz[S.index];S.locked=false;$("qcount").textContent=T.question(S.index+1,S.quiz.length);$("live").textContent=T.correct(S.correct);$("bar").style.width=`${S.index/S.quiz.length*100}%`;$("topic").textContent=q.t;$("question").textContent=q.q;$("hintWrap").hidden=!q.h;$("hint").hidden=true;$("hint").textContent=q.h||"";$("hintBtn").textContent=T.hint;$("feedback").classList.remove("show");$("next").disabled=true;$("next").textContent=S.index===S.quiz.length-1?T.results:T.next;if(q.type==="fill"){const form=document.createElement("form"),input=document.createElement("input"),button=document.createElement("button");form.className="fill-form";input.className="fill-input";input.type="text";input.placeholder=T.fillPh;input.autocomplete="off";input.required=true;button.className="btn";button.type="submit";button.textContent=T.check;form.onsubmit=e=>{e.preventDefault();answerFill(input.value,input,button)};form.append(input,button);$("options").replaceChildren(form);requestAnimationFrame(()=>input.focus())}else $("options").replaceChildren(...q.opts.map((o,i)=>{const b=document.createElement("button");b.className="option";b.type="button";b.dataset.ok=o.ok;b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span>`;b.append(document.createTextNode(o.text));b.onclick=()=>answer(o,b);return b}))}$("hintBtn").onclick=()=>{const h=$("hint");h.hidden=!h.hidden;$("hintBtn").textContent=h.hidden?T.hint:T.hideHint};
    function showFeedback(ok,q,picked,correct){if(ok)S.correct++;S.answers.push({q:q.q,picked,answer:correct,e:q.e,ok});$("live").textContent=T.correct(S.correct);$("feedbackTitle").textContent=ok?T.yes:T.no;$("feedbackText").textContent=q.e;$("feedback").classList.add("show");$("next").disabled=false;$("next").focus()}
    function answer(o,chosen){if(S.locked)return;S.locked=true;const q=S.quiz[S.index];[...$("options").children].forEach(b=>{b.disabled=true;if(b.dataset.ok==="true")b.classList.add("correct")});if(!o.ok)chosen.classList.add("wrong");showFeedback(o.ok,q,o.text,q.c[q.a])}
    function answerFill(value,input,button){if(S.locked)return;const picked=value.trim();if(!picked){input.focus();return}S.locked=true;const clean=v=>String(v).trim().replace(/^`|`$/g,"").replace(/\s+/g," ").toLocaleLowerCase(),q=S.quiz[S.index],ok=q.answers.some(a=>clean(a)===clean(picked));input.disabled=button.disabled=true;input.classList.add(ok?"correct":"wrong");showFeedback(ok,q,picked,q.answers[0])}$("next").onclick=()=>{if(!S.locked)return;if(++S.index<S.quiz.length)renderQ();else finish()};
    function finish(){const percent=S.correct/S.quiz.length*100,l=level(percent),old=S.history.length?Math.max(...S.history.map(x=>x.percent)):-1;S.history.push({time:stamp(),correct:S.correct,total:S.quiz.length,percent,label:`${l.emoji} ${l.title}`});try{save();$("save").textContent=T.saved}catch{$("save").textContent=T.storageHelp}$("quiz").classList.remove("show");$("result").classList.add("show");$("resultEmoji").textContent=l.emoji;$("resultTitle").textContent=l.title;$("resultScore").textContent=T.result(S.correct,S.quiz.length,pct(percent));$("record").textContent=T.record;$("record").classList.toggle("show",percent>=old);const wrong=S.answers.filter(x=>!x.ok);$("review").replaceChildren();const h=document.createElement("h3");h.textContent=wrong.length?T.review(wrong.length):T.perfect;$("review").append(h);wrong.forEach((x,i)=>{const d=document.createElement("div");d.className="review-item";const q=document.createElement("strong"),p=document.createElement("p"),a=document.createElement("p"),e=document.createElement("p");q.textContent=`${i+1}. ${x.q}`;p.textContent=`${T.picked}: ${x.picked}`;a.textContent=`${T.answer}: ${x.answer}`;a.className="right";e.textContent=x.e;d.append(q,p,a,e);$("review").append(d)});scrollTo({top:0})}
    $("back").onclick=()=>{$("result").classList.remove("show");$("dashboard").style.display="block";$("mainActions").style.display="flex";renderDash();scrollTo({top:0})};function download(){if(!S.history.length){$("notice").textContent=T.noExport;return}const u=URL.createObjectURL(new Blob([csv()],{type:"text/csv;charset=utf-8"})),a=document.createElement("a");a.href=u;a.download=`${S.name.replace(/[<>:"/\\|?*]/g,"_")}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$("exportBtn").onclick=$("resultExport").onclick=download;$("importBtn").onclick=()=>$("csvInput").click();$("csvInput").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;try{const imported=parseCsv(await f.text()),m=new Map(S.history.map(x=>[x.time,x]));imported.forEach(x=>m.set(x.time,x));S.history=[...m.values()].sort((a,b)=>a.time.localeCompare(b.time));save();renderDash();$("notice").textContent=T.imported(imported.length,f.name);$("notice").className="notice"}catch(err){$("notice").textContent=err.message;$("notice").className="notice error"}};
